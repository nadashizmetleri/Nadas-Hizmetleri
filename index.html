  flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;
}
.rotate-lock .r-icon{display:flex;animation:rlspin 2.2s ease-in-out infinite;color:var(--orange);}
.rotate-lock .r-icon svg{width:44px;height:44px;}
.rotate-lock h3{font-family:'Space Grotesk';font-size:17px;}
.rotate-lock p{font-size:12.5px;color:var(--mid);max-width:260px;}
@keyframes rlspin{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-90deg);}}
@media(max-width:900px) and (orientation:landscape){
  .rotate-lock{display:flex;}
  body>*:not(.rotate-lock){display:none !important;}
}
</style>
</head>
<body>
<div class="rotate-lock">
  <div class="r-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.3" width="10" height="19.4" rx="2.2"/><line x1="10.8" y1="18" x2="13.2" y2="18"/></svg></div>
  <h3>Lütfen ekranınızı dikey çevirin</h3>
  <p>NADAS HİZMETLERİ en iyi deneyimi dikey (portre) modda sunar.</p>
</div>
<div id="toastStack" class="toast-stack"></div>
<div id="modalRoot"></div>
<div id="catMenuRoot"></div>
<div id="app"></div>
<div id="aiAssistFabRoot"></div>
<div id="globalChatRoot"></div>

<!-- Firebase SDK (compat sürüm — mevcut inline script/onclick yapısıyla uyumlu çalışması için) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   NADAS HİZMETLERİ — Pazaryeri (tek dosya uygulama + Firebase)
   ========================================================= */

/* ---------------- FIREBASE YAPILANDIRMASI ----------------
   AŞAĞIYA KENDİ FIREBASE PROJENİN BİLGİLERİNİ GİR.
   Firebase Console > Project Settings > General > "Your apps" > SDK setup and configuration
   bölümünden alabilirsin. Bilgiler girilmeden bu değerler placeholder olarak kalır ve
   uygulama otomatik olarak YEREL DEMO MODUNDA çalışır (mevcut mock veriyle), böylece
   Firebase bağlanana kadar hiçbir şey bozulmaz.

   ÖNEMLİ GÜVENLİK NOTU: Admin yetkisi bu dosyada asla e-posta/şifre karşılaştırmasıyla
   belirlenmez. Kullanıcı giriş yaptıktan sonra Firestore'daki users/{uid} dokümanının
   "role" alanı okunur; role === "admin" ise Yönetim Paneli açılır. Bu alanı normal
   kullanıcılar kendi kayıt formundan asla "admin" yapamaz — kayıt sırasında rol her zaman
   "user" olarak yazılır (bkz. registerUser fonksiyonu). Bir hesabı admin yapmak için
   Firebase Console > Firestore > users/{uid} dokümanına elle role:"admin" yazman gerekir
   (ya da güvenli bir Cloud Function ile). Ayrıca aşağıdaki Firestore Security Rules'ı
   Firebase Console'da Firestore > Rules kısmına yapıştırman ÇOK ÖNEMLİDİR — bu dosya
   sadece arayüzü kontrol eder, gerçek erişim güvenliği sunucu tarafında (rules) sağlanır:

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       function isSignedIn() { return request.auth != null; }
       function isAdmin() {
         return isSignedIn() &&
           get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
       }
       function isOwnerOfListing(listingId) {
         return isSignedIn() &&
           get(/databases/$(database)/documents/listings/$(listingId)).data.seller.sellerUid == request.auth.uid;
       }
       function hasPurchased(listingId) {
         return isSignedIn() &&
           exists(/databases/$(database)/documents/purchases/$(request.auth.uid + '_' + listingId));
       }
       // Herhangi bir uid için (sadece request.auth.uid değil) satın alma kanıtı
       // var mı diye bakar — ONAY/RET sistemi bildirimlerinde satıcının, ALICIYA
       // bildirim gönderebilmesi için gereklidir (bkz. notifications kuralı).
       function hasPurchasedByUid(uid, listingId) {
         return exists(/databases/$(database)/documents/purchases/$(uid + '_' + listingId));
       }
       function isValidSalesIncrement(listingId) {
         let before = resource.data.seller;
         let after = request.resource.data.seller;
         return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['seller'])
           && after.keys().hasOnly(before.keys())
           && after.sales is number && after.sales > before.sales
           && after.name == before.name
           && after.sellerUid == before.sellerUid
           && after.photoURL == before.photoURL
           && after.rating == before.rating
           && after.verified == before.verified
           && after.priority == before.priority;
       }
       // SATIN ALMA: bir alıcının, satın aldığı ilanın stoğunu SADECE azaltmasına
       // (asla artırmasına değil) ve 0'ın altına düşürmemesine izin verir.
       // "stock" dışında hiçbir alanı değiştiremez.
       function isValidStockDecrement(listingId) {
         let before = resource.data;
         let after = request.resource.data;
         return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['stock'])
           && after.stock is number
           && after.stock >= 0
           && after.stock < before.stock;
       }
       // YENİDEN YAYINLAMA: satılıp kilitlenen (active:false) bir ilanı, SADECE
       // ilanın sahibinin, yalnızca "active" ve "stock" alanlarını değiştirerek
       // (başka hiçbir alana dokunmadan) yeniden aktif hale getirmesine izin
       // verir. "active" mutlaka true, "stock" mutlaka 0'dan büyük bir sayı
       // olmalıdır — aksi halde ilan "aktif" görünse de stok filtresi yüzünden
       // yine kimseye gösterilmez.
       function isValidRepublish(listingId) {
         let before = resource.data;
         let after = request.resource.data;
         return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['active','stock'])
           && after.active == true
           && after.stock is number
           && after.stock > 0;
       }
       // MESAJLAŞMA: iki katılımcıdan (participants) diğerini döndürür.
       function otherParticipantOf(participants) {
         return participants[0] == request.auth.uid ? participants[1] : participants[0];
       }
       // MESAJLAŞMA: SATIN ALMA sonrası satıcı adına otomatik gönderilen sistem
       // mesajları (Random Hesap teslimat bilgisi VE normal ilan sipariş/teslimat
       // bilgisi) için özel doğrulama. Bu mesajları teknik olarak ALICI'nın
       // istemcisi yazar (from alanı satıcının uid'i olsa da request.auth.uid
       // alıcıdır) — bu yüzden normal "from == request.auth.uid" kuralına uymaz.
       // Kötüye kullanımı önlemek için: gönderen HER ZAMAN konuşmadaki karşı
       // taraf olmalı, mesaj "system" işaretli olmalı, sabit bir "kind" değeri
       // taşımalı VE en önemlisi — isteği yapan kullanıcının (alıcının) mesajda
       // belirtilen listingId için GERÇEK bir satın alma kanıtı (purchases/
       // {uid}_{listingId}) bulunmalı. Böylece bir kullanıcı satın almadığı bir
       // ilan için sahte "satıcıdan geldi" mesajı üretemez.
       function isAutoPurchaseSystemMessage(convId) {
         let conv = get(/databases/$(database)/documents/conversations/$(convId)).data;
         return isSignedIn() && request.auth.uid in conv.participants
           && request.resource.data.participants == conv.participants
           && request.resource.data.system == true
           && request.resource.data.from == otherParticipantOf(conv.participants)
           && request.resource.data.kind in ['auto_delivery', 'auto_purchase_info']
           && request.resource.data.listingId is string
           && request.resource.data.listingId != ''
           && hasPurchased(request.resource.data.listingId);
       }
       // MESAJLAŞMA: bir mesajın yazılmasına izin verilip verilmeyeceğini kontrol eder.
       // - Normal mesaj: sadece kendi uid'in ile ("from") yazabilirsin.
       // - Otomatik karşılama mesajı: yalnızca konuşmadaki autoReplySent HENÜZ false
       //   iken, "from" alanı karşı tarafın uid'i ve metin BİREBİR resmi otomatik
       //   cevap metniyle eşleşiyorsa oluşturulabilir (uygulama bunu, kullanıcının
       //   kendi ilk mesajıyla AYNI transaction içinde yazar).
       // - Otomatik satın alma/teslimat sistem mesajı: bkz. isAutoPurchaseSystemMessage.
       function messageIsValid(convId) {
         let conv = get(/databases/$(database)/documents/conversations/$(convId)).data;
         return isSignedIn() && request.auth.uid in conv.participants
           && request.resource.data.participants == conv.participants
           && (
             request.resource.data.from == request.auth.uid
             || (
               request.resource.data.system == true
               && request.resource.data.text == 'Mağazamız en kısa sürede mesajınıza cevap verecektir. İlginiz için teşekkür ederiz.'
               && request.resource.data.from == otherParticipantOf(conv.participants)
               && conv.autoReplySent == false
             )
             || isAutoPurchaseSystemMessage(convId)
           );
       }

       match /users/{userId} {
         allow read: if isSignedIn();
         allow create: if isSignedIn() && request.auth.uid == userId
           && request.resource.data.role == 'user';
         allow update: if isAdmin() || (isSignedIn() && request.auth.uid == userId
             && request.resource.data.role == resource.data.role)
           || (isSignedIn()
               && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['totalSales'])
               && request.resource.data.totalSales is number
               && request.resource.data.totalSales > resource.data.totalSales);
         allow delete: if isAdmin();
       }

       match /listings/{listingId} {
         allow read: if true;
         allow create: if isAdmin() || (isSignedIn() && request.resource.data.seller.sellerUid == request.auth.uid);
         allow update: if isAdmin()
           || (isOwnerOfListing(listingId) &&
               request.resource.data.diff(resource.data).affectedKeys().hasOnly(['badges','hasAutoDelivery']))
           || (isOwnerOfListing(listingId) && isValidRepublish(listingId))
           || (hasPurchased(listingId) && isValidSalesIncrement(listingId))
           || (hasPurchased(listingId) && isValidStockDecrement(listingId));
         allow delete: if isAdmin() || isOwnerOfListing(listingId);

         match /private/delivery {
           allow get: if isAdmin() || isOwnerOfListing(listingId) || hasPurchased(listingId);
           allow list: if false;
           allow write: if isAdmin() || isOwnerOfListing(listingId);
         }
       }

       match /orders/{orderId} {
         allow read: if isAdmin() || (isSignedIn() && resource.data.buyerUid == request.auth.uid);
         allow create: if isSignedIn() && request.resource.data.buyerUid == request.auth.uid;
         allow update, delete: if isAdmin();
       }

       match /purchases/{purchaseId} {
         allow read: if isAdmin() || (isSignedIn() && resource.data.buyerUid == request.auth.uid);
         allow create: if isSignedIn() && request.resource.data.buyerUid == request.auth.uid
           && purchaseId == request.auth.uid + '_' + request.resource.data.listingId;
         allow update: if isAdmin() || (isSignedIn()
           && request.auth.uid == resource.data.buyerUid
           && request.resource.data.buyerUid == resource.data.buyerUid
           && request.resource.data.listingId == resource.data.listingId);
         allow delete: if isAdmin();
       }

       // ONAY/RET (KARŞILIKLI ONAY) SİSTEMİ: bir siparişteki her ilan kalemi
       // için bir "deals/{orderId}__{listingId}" dokümanı tutulur. Para
       // hareketleri (satıcıya ödeme / alıcıya iade) KESİNLİKLE bu dosyanın
       // hiçbir yerinde başka bir kullanıcının bakiyesine doğrudan yazılarak
       // yapılmaz — her kullanıcı yalnızca KENDİ bakiyesini, ancak bu deal
       // dokümanı buna izin veren bir duruma (status:'completed'/'refunded' ve
       // henüz "claim" edilmemiş) geçtiğinde artırabilir (bkz. claimDealPayout /
       // claimDealRefund). Bu sayede users/{userId} kuralında hiçbir değişiklik
       // GEREKMEZ — zaten var olan "kendi dokümanını güncelleyebilir" izni yeterlidir.
       match /deals/{dealId} {
         allow read: if isAdmin() || (isSignedIn() && request.auth.uid in resource.data.participants);

         allow create: if isSignedIn()
           && request.resource.data.buyerUid == request.auth.uid
           && request.resource.data.participants.hasAll([request.resource.data.buyerUid, request.resource.data.sellerUid])
           && request.resource.data.participants.size() == 2
           && request.resource.data.buyerApproval == 'pending'
           && request.resource.data.sellerApproval == 'pending'
           && request.resource.data.status == 'pending'
           && request.resource.data.payoutClaimed == false
           && request.resource.data.refundClaimed == false
           && hasPurchased(request.resource.data.listingId)
           && dealId == request.resource.data.orderId + '__' + request.resource.data.listingId;

         allow update: if isAdmin() || (
           isSignedIn() && request.auth.uid in resource.data.participants && (
             // 1) Kendi Onayla/Reddet kararını bildirme.
             (
               resource.data.status == 'pending' &&
               (
                 (request.auth.uid == resource.data.buyerUid && resource.data.buyerApproval == 'pending'
                   && request.resource.data.diff(resource.data).affectedKeys()
                        .hasOnly(['buyerApproval','status','rejectDeadline','firstRejectBy','updatedAt','completedAt']))
                 ||
                 (request.auth.uid == resource.data.sellerUid && resource.data.sellerApproval == 'pending'
                   && request.resource.data.diff(resource.data).affectedKeys()
                        .hasOnly(['sellerApproval','status','rejectDeadline','firstRejectBy','updatedAt','completedAt']))
               )
             )
             // 2) 3 günlük süre dolduğunda otomatik ret + iade — iki taraftan
             //    hangisinin istemcisi önce fark ederse o tetikleyebilir.
             || (
               resource.data.status == 'pending'
               && resource.data.rejectDeadline != null
               && resource.data.rejectDeadline <= request.time
               && (resource.data.buyerApproval == 'rejected' || resource.data.sellerApproval == 'rejected')
               && request.resource.data.status == 'refunded'
               && request.resource.data.buyerApproval == 'rejected'
               && request.resource.data.sellerApproval == 'rejected'
               && request.resource.data.diff(resource.data).affectedKeys()
                    .hasOnly(['buyerApproval','sellerApproval','status','autoRejected','updatedAt','completedAt'])
             )
             // 3) Ödeme/iade talebi (claim) — yalnızca kendi payını, yalnızca
             //    ilgili durum kesinleştikten sonra, yalnızca BİR kez işaretler.
             || (
               request.auth.uid == resource.data.sellerUid && resource.data.status == 'completed'
               && resource.data.payoutClaimed == false && request.resource.data.payoutClaimed == true
               && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['payoutClaimed'])
             )
             || (
               request.auth.uid == resource.data.buyerUid && resource.data.status == 'refunded'
               && resource.data.refundClaimed == false && request.resource.data.refundClaimed == true
               && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['refundClaimed'])
             )
           )
         );
         allow delete: if isAdmin();
       }

       match /sales/{saleId} {
         allow read: if isAdmin()
           || (isSignedIn() && resource.data.sellerUid == request.auth.uid)
           || (isSignedIn() && resource.data.buyerUid == request.auth.uid);
         allow create: if isSignedIn()
           && request.resource.data.buyerUid == request.auth.uid
           && request.resource.data.qty is number && request.resource.data.qty > 0
           && request.resource.data.sellerUid ==
                get(/databases/$(database)/documents/listings/$(request.resource.data.listingId)).data.seller.sellerUid;
         allow update, delete: if isAdmin();
       }

       match /banners/{bannerId} {
         allow read: if true;
         allow write: if isAdmin();
       }

       match /paymentRequests/{reqId} {
         allow read: if isAdmin() || (isSignedIn() && resource.data.uid == request.auth.uid);
         allow create: if isSignedIn() && request.resource.data.uid == request.auth.uid
           && request.resource.data.status == 'Bekliyor';
         allow update: if isAdmin();
       }

       // PARA ÇEKME TALEPLERİ: kullanıcı SADECE kendi uid'i, 'Bekliyor' durumu
       // ve o an Firestore'daki GERÇEK bakiyesini AŞMAYAN bir tutar ile talep
       // oluşturabilir — böylece istemci tarafı doğrulaması atlatılsa bile
       // sunucu tarafında da yetersiz bakiyeyle talep açılması engellenir.
       // Onay/red/not ekleme (status, note alanları) SADECE admin tarafından
       // güncellenebilir; onay anında kullanıcının bakiyesinden düşme işlemi
       // admin panelinde ayrı bir transaction ile 'users/{uid}' dokümanına
       // uygulanır (bkz. adminApproveWithdrawal).
       match /withdrawalRequests/{reqId} {
         allow read: if isAdmin() || (isSignedIn() && resource.data.uid == request.auth.uid);
         allow create: if isSignedIn() && request.resource.data.uid == request.auth.uid
           && request.resource.data.status == 'Bekliyor'
           && request.resource.data.fullName is string && request.resource.data.fullName.size() > 0
           && request.resource.data.iban is string && request.resource.data.iban.size() > 0
           && request.resource.data.amount is number && request.resource.data.amount > 0
           && request.resource.data.amount <=
                get(/databases/$(database)/documents/users/$(request.auth.uid)).data.balance;
         allow update: if isAdmin();
       }

       match /transactions/{txId} {
         allow read: if isAdmin() || (isSignedIn() && resource.data.uid == request.auth.uid);
         allow write: if isAdmin();
       }

       match /supportTickets/{ticketId} {
         allow read: if isAdmin() || (isSignedIn() && resource.data.uid == request.auth.uid);
         allow create: if isSignedIn() && request.resource.data.uid == request.auth.uid;
         allow update: if isAdmin();
       }

       // DUYURULAR: 'title','text','tag','audience' alanlarına ek olarak
       // admin panelinden isteğe bağlı 'type' (bildirim türü, bkz. NOTIF_TYPES)
       // ve 'link' ({view,params}, tıklanınca yönlendirme) alanları da
       // yazılabilir — şema serbest olduğundan (create sadece isAdmin()
       // gerektirir, alan kısıtlaması yoktur) bu ek alanlar için kural
       // değişikliği gerekmez.
       match /announcements/{announcementId} {
         allow read: if isSignedIn();
         allow create, delete: if isAdmin();
       }

       // BİLDİRİMLER: her bildirim tek bir hedef kullanıcıya (uid) aittir.
       // Bir kullanıcı SADECE kendi bildirimlerini okuyabilir (admin hepsini
       // okuyabilir). Oluşturma iki şekilde geçerlidir:
       //  a) Kendi bildirimini kendine yazma (ör. "siparişin oluşturuldu").
       //  b) Başka bir kullanıcıya (satıcıya) satış bildirimi yazma — bu
       //     SADECE isteği yapan kullanıcının o "listingId"yi GERÇEKTEN
       //     satın aldığı (hasPurchased) VE hedef uid'in o ilanın satıcısı
       //     olduğu kanıtlanabiliyorsa kabul edilir; böylece bir kullanıcı
       //     rastgele başka bir kullanıcıya sahte bildirim yazamaz.
       // Admin ise (ör. bakiye talebi onayı/reddi bildirimi göndermek için,
       // ya da Yönetim Paneli > Bildirim & Duyuru Yönetimi bölümünden
       // belirli bir kullanıcıya doğrudan özel bildirim/duyuru göndermek
       // için) her zaman ve HERHANGİ bir hedef uid'e yazabilir. Güncelleme
       // SADECE bildirimin sahibine (veya admin'e) ve SADECE "read" alanına
       // izin verir.
       match /notifications/{notifId} {
         allow read: if isAdmin()
           || (isSignedIn() && resource.data.uid == request.auth.uid);

         allow create: if isAdmin()
           || (
             isSignedIn()
             && (
               request.resource.data.uid == request.auth.uid
               || (
                 request.resource.data.listingId is string
                 && hasPurchased(request.resource.data.listingId)
                 && request.resource.data.uid ==
                   get(/databases/$(database)/documents/listings/$(request.resource.data.listingId))
                     .data.seller.sellerUid
               )
               || (
                 // ONAY/RET SİSTEMİ: satıcı, ilgili ilanı gerçekten satın almış
                 // olan ALICIYA (hedef uid) bildirim gönderebilir — ör. "satıcı
                 // onayladı", "satıcı reddetti" bildirimleri.
                 request.resource.data.listingId is string
                 && isOwnerOfListing(request.resource.data.listingId)
                 && hasPurchasedByUid(request.resource.data.uid, request.resource.data.listingId)
               )
             )
           );

         allow update: if isAdmin()
           || (
             isSignedIn()
             && request.auth.uid == resource.data.uid
             && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['read'])
           );

         allow delete: if isAdmin();
       }

       match /shops/{shopId} {
         allow read: if true;
         allow create: if isAdmin() || isSignedIn();
         allow update: if isAdmin() ||
           (isSignedIn() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['description','avatarUrl','name'])) ||
           (isSignedIn() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['reviews']));
         allow delete: if isAdmin();
       }

       // MESAJLAŞMA: bir konuşma sadece iki katılımcısı (participants) tarafından
       // okunabilir/güncellenebilir. Oluştururken katılımcılardan biri istek
       // sahibi olmalı ve dizide TAM İKİ farklı uid bulunmalı. Güncellemede
       // "participants" dizisi asla değiştirilemez ve her katılımcı yalnızca
       // KENDİ "names.<kendi uid'i>" alanını değiştirebilir — karşı tarafın
       // görünen mağaza adını asla değiştiremez.
       // Oluşturma (create) iki şekilde geçerlidir:
       //  a) Normal sohbet başlatma: messageCount 0, autoReplySent false ile
       //     boş bir konuşma açılır, mesaj ayrı olarak eklenir.
       //  b) Otomatik satın alma/teslimat sistem mesajıyla BİRLİKTE ilk kez
       //     açılan konuşma: messageCount 1, autoReplySent true — ama SADECE
       //     alıcının gerçekten satın aldığı (hasPurchased) bir "listingId"
       //     ile ilişkilendirilmişse.
       match /conversations/{convId} {
         allow read: if isSignedIn() && request.auth.uid in resource.data.participants;
         allow create: if isSignedIn()
           && request.auth.uid in request.resource.data.participants
           && request.resource.data.participants.size() == 2
           && request.resource.data.participants[0] != request.resource.data.participants[1]
           && (
             (request.resource.data.messageCount == 0 && request.resource.data.autoReplySent == false)
             || (

document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('gesturechange', e=>e.preventDefault());
document.addEventListener('gestureend', e=>e.preventDefault());
document.addEventListener('touchmove', function(e){
  if(e.touches && e.touches.length > 1) e.preventDefault();
}, {passive:false});
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  const now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});
document.addEventListener('wheel', function(e){
  if(e.ctrlKey) e.preventDefault();
}, {passive:false});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && ['+','-','=','0'].includes(e.key)) e.preventDefault();
});

// Kategori → İlan türüne göre alan tanımlarının tamamı. Yeni bir kategoriye özel alan seti
// eklemek için buraya `catId: TYPE_FIELDS_OBJESI` eklemek yeterlidir; eklenmeyen kategoriler
// (örn. "Diğer") otomatik olarak genel/basit ilan formuna düşer.
const CATEGORY_TYPE_FIELDS = {
  pubgm: PUBG_TYPE_FIELDS,
  valorant: VLR_TYPE_FIELDS,
  lol: LOL_TYPE_FIELDS,
  mlbb: MLBB_TYPE_FIELDS,
  roblox: RBLX_TYPE_FIELDS,
  freefire: FF_TYPE_FIELDS,
  social: SOC_TYPE_FIELDS,
};
function getCatTypeFields(cat, type){ return ((CATEGORY_TYPE_FIELDS[cat]||{})[type]) || []; }

function toggleMultiSelect(containerId, checkboxEl, max){
  const container = document.getElementById(containerId);
  if(!container) return;
  const checked = container.querySelectorAll('input[type=checkbox]:checked');
  if(checked.length > max){
    checkboxEl.checked = false;
    toast('En fazla '+max+' seçim yapabilirsin','error');
  }
  container.querySelectorAll('.chip-checkbox').forEach(lbl=>{
    const cb = lbl.querySelector('input');
    lbl.classList.toggle('selected', cb.checked);
  });
}
function renderCatField(f,d){
  const val = (d.fields && d.fields[f.id]!==undefined) ? d.fields[f.id] : '';
  const inputId = 'f_field_'+f.id;
  if(f.kind==='multiselect'){
    const selected = String(val||'').split(',').map(s=>s.trim()).filter(Boolean);
    return `<div class="field" style="grid-column:1/-1;">
      <label>${f.label} <span class="small text-mid">(en fazla ${f.max||4} seçebilirsin)</span></label>
      <div class="chip-select-group" id="${inputId}">
        ${f.options.map(o=>`<label class="chip-checkbox ${selected.includes(o)?'selected':''}">
          <input type="checkbox" value="${esc(o)}" ${selected.includes(o)?'checked':''} onchange="toggleMultiSelect('${inputId}', this, ${f.max||4})"> ${esc(o)}
        </label>`).join('')}
      </div>
    </div>`;
  }
  if(f.kind==='select'){
    return `<div class="field"><label>${f.label}</label><select id="${inputId}"><option value="" ${val===''?'selected':''}>Seçiniz</option>${f.options.map(o=>`<option ${String(val)===String(o)?'selected':''}>${esc(String(o))}</option>`).join('')}</select></div>`;
  }
  return `<div class="field"><label>${f.label}</label><input id="${inputId}" type="${f.kind==='number'?'number':'text'}" placeholder="${esc(f.placeholder||'')}" value="${esc(String(val))}"></div>`;
}
function renderCatFields(d){
  const fields = getCatTypeFields(d.cat, d.type);
  const rows = [];
  for(let i=0;i<fields.length;i++){
    if(fields[i].kind==='multiselect'){ rows.push(`<div class="field-row">${renderCatField(fields[i],d)}</div>`); continue; }
    const pair = [fields[i]];
    if(fields[i+1] && fields[i+1].kind!=='multiselect'){ pair.push(fields[i+1]); i++; }
    rows.push(`<div class="field-row">${pair.map(f=>renderCatField(f,d)).join('')}</div>`);
  }
  return rows.join('');
}
function buildListingSpecs(d){
  if(CATEGORY_TYPE_FIELDS[d.cat] && d.type){
    const fields = getCatTypeFields(d.cat, d.type);
    const data = d.fields||{};
    const specs = [['İlan Türü', typeName(d.type)]];
    if(d.type==='hesap') specs.push(['Hesap Oluşturma', d.randomAccount ? 'Random Hesap' : 'Hazır Hesap']);
    fields.forEach(f=>{ if(data[f.id]) specs.push([f.label, data[f.id]]); });
    specs.push(['Teslimat', d.delivery||'Belirtilmedi']);
    return specs;
  }
  return [[d.spec1?'Özellik':'Not', d.spec1||'-'],['Teslimat',d.delivery||'Belirtilmedi']];
}

/* ---------------- IMGBB: GÖRSEL YÜKLEME ----------------
   İlan görselleri imgbb üzerinden yüklenir ve dönen URL Firestore'a kaydedilir.
   Bu sayede satıcılar ilanlarına gerçek fotoğraf ekleyebilir. ------------- */
const IMGBB_API_KEY = '257ea3701a67d1b6ab2fd08d20851f1e';
async function uploadToImgbb(file){
  const formData = new FormData();
  formData.append('image', file);
  const res = await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_API_KEY, { method:'POST', body:formData });
  const data = await res.json().catch(()=>null);
  if(!res.ok || !data || !data.success) throw new Error((data && data.error && data.error.message) || 'Görsel yüklenemedi');
  return data.data.url;
}
function listingImages(l){ return (l && Array.isArray(l.images) && l.images.length) ? l.images : null; }

/* Firestore, dizi içinde dizi (nested array) desteklemez — specs [[k,v],[k,v]] biçiminde
   olduğu için kaydetmeden önce {k,v} nesne dizisine çevrilir, okurken geri çevrilir. */
function specsToFirestore(specs){ return (specs||[]).map(s=>Array.isArray(s)?{k:s[0], v:s[1]}:s); }
function specsFromFirestore(specs){ return (specs||[]).map(s=>Array.isArray(s)?s:[s.k, s.v]); }

const LOCAL_APP_STATE_KEY = 'nadas_local_app_state_v1';
function saveLocalAppState(){
  if(FIREBASE_ENABLED) return;
  try{
    const snapshot = {
      loggedIn: state.loggedIn,
      isAdmin: state.isAdmin,
      userName: state.userName,
      userEmail: state.userEmail,

      photoURL: state.photoURL,

      successfulDealCount: state.successfulDealCount,
      myListings: state.myListings,
      notifications: state.notifications,
      favorites: Array.from(state.favorites||[]),
      cart: state.cart,
      hasPass: state.hasPass,
      passExpiry: state.passExpiry,
      tickets: state.tickets,
      paymentRequests: state.paymentRequests,
      withdrawalRequests: state.withdrawalRequests,
      globalTransactions: state.globalTransactions,
      listings: LISTINGS,
    };
    localStorage.setItem(LOCAL_APP_STATE_KEY, JSON.stringify(snapshot));
  }catch(e){ console.error('Yerel veri kaydedilemedi:', e); }
}
function loadLocalAppState(){
  if(FIREBASE_ENABLED) return;
  try{
    const raw = localStorage.getItem(LOCAL_APP_STATE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || typeof d!=='object') return;
    if(typeof d.loggedIn==='boolean') state.loggedIn = d.loggedIn;
    if(typeof d.isAdmin==='boolean') state.isAdmin = d.isAdmin;
    if(typeof d.userName==='string') state.userName = d.userName;
    if(typeof d.userEmail==='string') state.userEmail = d.userEmail;
    if(typeof d.shopName==='string') state.shopName = d.shopName;
    if(typeof d.photoURL==='string') state.photoURL = d.photoURL;
    if(typeof d.userPhone==='string') state.userPhone = d.userPhone;
    if(typeof d.verified==='boolean') state.verified = d.verified;
    if(typeof d.balance==='number' && !isNaN(d.balance)) state.balance = d.balance;
    if(Array.isArray(d.balanceHistory)) state.balanceHistory = d.balanceHistory;
    if(Array.isArray(d.orders)) state.orders = d.orders;
    if(Array.isArray(d.mySales)) state.mySales = d.mySales;
    if(Array.isArray(d.deals)) state.deals = d.deals;
    if(typeof d.successfulDealCount==='number' && !isNaN(d.successfulDealCount)) state.successfulDealCount = d.successfulDealCount;
    if(Array.isArray(d.myListings)) state.myListings = d.myListings;
    if(Array.isArray(d.notifications)) state.notifications = d.notifications;
    if(Array.isArray(d.favorites)) state.favorites = new Set(d.favorites);
    if(Array.isArray(d.cart)) state.cart = d.cart;
    if(typeof d.hasPass==='boolean') state.hasPass = d.hasPass;
    if(d.passExpiry!==undefined) state.passExpiry = d.passExpiry;
    if(Array.isArray(d.tickets)) state.tickets = d.tickets;
    if(Array.isArray(d.paymentRequests)) state.paymentRequests = d.paymentRequests;
    if(Array.isArray(d.withdrawalRequests)) state.withdrawalRequests = d.withdrawalRequests;
    if(Array.isArray(d.globalTransactions)) state.globalTransactions = d.globalTransactions;
    if(Array.isArray(d.listings) && d.listings.length){
      LISTINGS = d.listings.map(l=>makeListing(l));
    }
  }catch(e){ console.error('Yerel veri okunamadı:', e); }
}

/* ---------------- İLAN GÖRÜNÜRLÜĞÜ (satın alma sonrası kilit / yeniden yayınlama) ----------------
   Bir ilan satın alındığında (stok 0'a indiğinde) `active:false` olarak işaretlenir

   açık listeleme yerlerinde (anasayfa, pazaryeri, mağaza, arama, benzer ilanlar)
   kullanılmalıdır; ilan sahibi ve admin ise canViewListing() ile kendi kilitli

  return !!l && l.active !== false && ((l.stock===undefined || l.stock===null) || l.stock > 0);
}

   Yerel demo modunda (Firebase yok, state.uid=null) ise tek kaynak olan

function isMyListing(l){

  if(FIREBASE_ENABLED && state.uid) return !!(l.seller && l.seller.sellerUid === state.uid);
  return state.myListings.includes(l.id);
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Firestore, bir belgede 'undefined' değerli alanları KABUL ETMEZ (addDoc/setDoc
   hata fırlatır: "Unsupported field value: undefined"). Formlarda doldurulmamış
   opsiyonel alanlar (ör. eski fiyat, öne çıkarma bitiş tarihi, ilan türü) JS
   tarafında sıkça 'undefined' olarak kalabildiği için, Firestore'a gönderilecek
   her belge bu fonksiyondan geçirilerek 'undefined' değerli alanlar (iç içe
   nesneler dahil) güvenle temizlenir. Sunucu zaman damgası gibi Firestore
   FieldValue nesnelerine dokunmaz. */
function stripUndefinedDeep(obj){
  if(Array.isArray(obj)) return obj.map(stripUndefinedDeep);
  if(obj && typeof obj==='object' && obj.constructor===Object){
    const out = {};
    Object.keys(obj).forEach(k=>{
      const v = obj[k];
      if(v===undefined) return;
      out[k] = stripUndefinedDeep(v);
    });
    return out;
  }
  return obj;
}

   Bir mağazanın "kimliği" her zaman o kullanıcının Firebase uid'idir (seller.sellerUid).

function avatarHtml(photoURL, name, extraClass){

   "(Sen)" gibi bağlama özel etiketler yalnızca görüntüleme anında eklenir. */
function sellerDisplayName(seller){
  if(!seller) return '';
  const mine = seller.sellerUid && state.uid && seller.sellerUid===state.uid;
  return seller.name + (mine ? ' (Sen)' : '');
}
function validateImageFile(file){
  if(!file) return 'Dosya seçilmedi';
  if(!/^image\//.test(file.type)) return 'Lütfen bir resim dosyası seç';
  if(file.size > 8*1024*1024) return 'Fotoğraf 8MB\'tan küçük olmalı';
  return null;
}
/* Mağaza adı veya profil fotoğrafı değiştiğinde, aynı kullanıcıya (sellerUid) ait
   TÜM ilanlardaki gömülü satıcı bilgisini günceller. Yeni bir mağaza/ilan kaydı
   OLUŞTURMAZ; sadece mevcut kayıtların görünen alanlarını senkronize eder. */
async function syncSellerInfoAcrossListings(patch){
  if(!state.uid) return;
  // Bellekteki (görüntülenen) ilanları hemen güncelle
  LISTINGS.forEach(l=>{
    if(l.seller && l.seller.sellerUid===state.uid){ Object.assign(l.seller, patch); }
  });
  if(!FIREBASE_ENABLED || !fbDb) return;
  try{
    const snap = await fbDb.collection('listings').where('seller.sellerUid','==', state.uid).get();
    if(!snap.empty){
      const batch = fbDb.batch();
      const fsPatch = {};
      Object.keys(patch).forEach(k=>{ fsPatch['seller.'+k] = patch[k]; });
      snap.docs.forEach(d=>batch.update(d.ref, fsPatch));
      await batch.commit();
    }
  }catch(err){ console.error('Mağaza bilgisi ilanlara senkronize edilemedi:', err); }
  // Mağaza adı değiştiğinde, kullanıcının dahil olduğu tüm mesajlaşma
  // konuşmalarındaki görünen ad da güncellenir (yeni bir konuşma OLUŞTURULMAZ).
  if(typeof patch.name === 'string'){
    try{
      const convSnap = await fbDb.collection('conversations').where('participants','array-contains', state.uid).get();
      if(!convSnap.empty){
        const convBatch = fbDb.batch();
        convSnap.docs.forEach(d=>convBatch.update(d.ref, { ['names.'+state.uid]: patch.name }));
        await convBatch.commit();
      }
    }catch(err){ console.error('Mağaza adı sohbetlere senkronize edilemedi:', err); }
  }
}
/* ---------------- PROFİL FOTOĞRAFI SİSTEMİ ----------------
   Kullanıcı cihazının galerisinden bir fotoğraf seçer, imgbb'ye yüklenir ve dönen
   URL tekil kullanıcı kimliğine (uid) bağlı kalıcı profil fotoğrafı olarak kaydedilir.
   Bu fotoğraf kullanıcı profilinde VE mağaza profilinde (tüm ilanlarında) otomatik
   gösterilir; yeni fotoğraf eskisinin yerini alır. */
async function handleProfilePhotoSelect(inputEl){
  const file = inputEl.files && inputEl.files[0];
  inputEl.value='';
  const err = validateImageFile(file);
  if(err){ toast(err,'error'); return; }
  if(!state.loggedIn){ toast('Fotoğraf yüklemek için giriş yapmalısın','error'); return; }
  const btn = document.getElementById('profilePhotoBtn');
  if(btn){ btn.disabled=true; btn.textContent='Yükleniyor...'; }
  try{
    const url = await uploadToImgbb(file);
    if(FIREBASE_ENABLED && state.uid){
      await fbDb.collection('users').doc(state.uid).update({ photoURL: url });
    }
    state.photoURL = url;
    await syncSellerInfoAcrossListings({ photoURL: url });
    toast('Profil fotoğrafı güncellendi','success');
    render();
  }catch(e){ toast('Fotoğraf yüklenemedi: '+(e.message||''),'error'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Fotoğraf Seç'; } }
}

/* ================================================================
   OTOMATİK SAYFA YENİLEME & YÖNLENDİRME SİSTEMİ
   ================================================================
   Kategori değişimi, giriş ve çıkış işlemlerinde tarayıcı seviyesinde
   GERÇEK bir sayfa yenilemesi (tam reload) tetiklenir. Nereye
   gidileceği bilgisi, o an işlemi yapan sekmeye ÖZEL olan
   sessionStorage'da tutulur — bu yüzden:
     - Yenileme SADECE işlemi başlatan kullanıcının kendi ekranında
       olur; aynı siteyi açmış başka hiçbir kullanıcı bundan etkilenmez
       (sessionStorage sekmeler arası paylaşılmaz).
     - Firebase Authentication oturumu tarayıcıda kalıcı olarak
       (varsayılan "local" persistence) saklandığından, tam sayfa
       yenilemesi kullanıcının oturumunu/hesabını ASLA sonlandırmaz;
       reload sonrası watchAuthState() aynı kullanıcıyla anında devam
       eder.
     - Yenileme sadece kategori değişimi / giriş / çıkış gibi GEREKLİ
       işlemlerden SONRA tetiklenir; otomatik/periyodik veya gereksiz
       bir yenileme YOKTUR.
     - Reload sonrası "İlk yükleme" bloğu Firestore'dan ilanları,
       banner'ları ve (varsa) kullanıcı verisini yeniden çeker; böylece
       o an veritabanında güncel olan her şey (yeni ilan, yeni mağaza,
       güncel bakiye/üyelik durumu vb.) gecikmeden ekrana yansır.
------------------------------------------------------------------- */
const NADAS_NAV_KEY = 'nadas_pending_nav_v1';
/* Bir sonraki tam sayfa yüklemesinde hangi görünüme (view) gidileceğini
   sekmeye özel olarak kaydedip gerçek bir tarayıcı navigasyonu başlatır. */
function hardNavigate(view, params, opts){
  opts = opts || {};
  try{ sessionStorage.setItem(NADAS_NAV_KEY, JSON.stringify({view: view || 'home', params: params || {}})); }
  catch(e){ /* sessionStorage kapalıysa sorun değil, yine de ana sayfaya yönlendirir */ }
  if(opts.replace){
    // Çıkış (logout) sonrası: mevcut (giriş yapılmış) geçmiş kaydının ÜZERİNE yazar,
    // böylece geri (back) tuşuna basıldığında oturum açık ekrana dönülemez.
    location.replace('index.html');
  }else{
    location.href = 'index.html';
  }
}
/* Sayfa yeniden yüklendiğinde bekleyen bir hedef görünüm var mı diye bakar,
   varsa bir kereliğine tüketir (bir daha kullanılmasın diye siler). */
function consumePendingNav(){
  let pending = null;
  try{
    const raw = sessionStorage.getItem(NADAS_NAV_KEY);
    if(raw){ pending = JSON.parse(raw); sessionStorage.removeItem(NADAS_NAV_KEY); }
  }catch(e){}
  return pending;
}

/* ---------------- FIREBASE: AUTH & KULLANICI DOKÜMANI ---------------- */
function watchAuthState(){
  if(!FIREBASE_ENABLED) return;
  fbAuth.onAuthStateChanged(async function(user){
    if(user){
      resetPersonalState(); // önce demo/önceki kullanıcıdan kalma verileri temizle
      state.uid = user.uid;
      state.userEmail = user.email || '';
      state.loggedIn = true;
      try{
        const snap = await fbDb.collection('users').doc(user.uid).get();
        if(snap.exists){
          const d = snap.data();
          state.userName = d.name || state.userEmail;
          state.shopName = d.shopName || '';
          state.photoURL = d.photoURL || '';
          state.balance = typeof d.balance==='number' ? d.balance : 0;
          state.isAdmin = d.role === 'admin';
          state.userPhone = d.phone || '';
          state.verified = !!d.verified;
          state.hasPass = !!d.hasPass && (!d.passExpiry || d.passExpiry > Date.now());
          state.passExpiry = d.passExpiry || null;
          state.successfulDealCount = typeof d.successfulDealCount==='number' ? d.successfulDealCount : 0;
        }else{
          // Firestore'da kullanıcı dokümanı yoksa (ör. eski/eksik kayıt) sıfırdan başlat
          state.userName = state.userEmail;
          state.balance = 0;
          state.isAdmin = false;
        }
      }catch(err){ console.error('Kullanıcı verisi okunamadı:', err); }
      loadListingsFromFirestore();
      watchNotifications();
      watchWithdrawalRequests();
      watchOwnUserDoc();
      loadAnnouncementsForUser();
      loadMySalesFromFirestore();
      loadMyOrdersFromFirestore();
      attachDealsListener();
      listenConversations();
      listenGlobalChat();
      if(state.isAdmin){ loadPaymentRequestsFromFirestore(); loadGlobalTransactionsFromFirestore(); loadSupportTicketsFromFirestore(); loadAnnouncementsForAdmin(); }
      render();
    }else{
      if(_announceUnsub){ _announceUnsub(); _announceUnsub=null; }
      detachNotifListener();
      detachWithdrawalListener();
      detachUserDocListener();
      detachDealsListener();
      resetPersonalState();
      state.uid=null; state.loggedIn=false; state.isAdmin=false; state.userName=''; state.userEmail='';
      render();
      renderGlobalChatWidget();
    }
  });
}
async function registerUser(name, email, password){
  if(!FIREBASE_ENABLED){ toast('Firebase yapılandırılmadı — kayıt yerel demo modunda simüle edildi.', 'default'); state.loggedIn=true; state.userName=name||'Kullanıcı'; saveLocalAppState(); openShopSetupModal(1); return; }
  try{
    const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
    // Rol HER ZAMAN 'user' olarak yazılır — admin ataması yalnızca Firebase Console/Firestore üzerinden elle yapılabilir.
    await fbDb.collection('users').doc(cred.user.uid).set({
      name: name || email, email: email, role: 'user', balance: 0, verified: false, hasPass: false, passExpiry: null, shopName: '', photoURL: '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    openShopSetupModal(1);
  }catch(err){ toast(authErrorMessage(err), 'error'); }
}

  shopSetupPendingName = name;
  openShopSetupModal(2);
}
async function shopSetupConfirm(){

  if(FIREBASE_ENABLED && state.uid){
    try{ await fbDb.collection('users').doc(state.uid).update({shopName:name}); }

    'auth/weak-password':'Şifre en az 6 karakter olmalı.',

/* ---------------- FIREBASE: PARA ÇEKME TALEPLERİ ----------------

   kullanıcının "Para Çek" sekmesindeki Beklemede/Onaylandı/Reddedildi durumu,

let _wdUnsub = null;

function watchWithdrawalRequests(){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return;

/* ---------------- FIREBASE: DUYURULAR (ANNOUNCEMENTS) ----------------
   Admin panelden gönderilen duyurular 'announcements' koleksiyonunda saklanır.
   Her duyurunun 'audience' alanı 'all' (tüm kayıtlı kullanıcılar) veya 'sellers'
   (dükkan adı tanımlı mağaza sahipleri) olabilir. Her kullanıcı giriş yaptığında
   ve oturum açıkken canlı olarak, hedef kitlesine uyan ve henüz görmediği
   duyurular bildirim olarak eklenir. Bir duyurunun görüldüğü bilgisi tarayıcıda
   (localStorage) kullanıcıya özel olarak tutulur.
   Firestore Security Rules'a eklenmesi gereken kural:
     match /announcements/{id} {
       allow read: if isSignedIn();
       allow create, delete: if isAdmin();
     }
-------------------------------------------------------------------- */
/* ================= BİLDİRİM SİSTEMİ =================
   Tüm bildirimler `notifications` Firestore koleksiyonunda kalıcı olarak
   saklanır: {uid, type, title, text, link:{view,params}, read, createdAt}.
   watchNotifications() giriş yapan kullanıcı için bu koleksiyonu uid'e göre
   CANLI (onSnapshot) dinler ve state.notifications HER ZAMAN bu dinleyiciden
   gelen veriyle güncellenir — böylece sayfa yenilense de, başka bir cihazdan
   girilse de bildirim geçmişi kaybolmaz. pushNotification() hem MEVCUT
   kullanıcıya (ör. "siparişin oluşturuldu") hem BAŞKA bir kullanıcıya (ör.
   bir ilan satıldığında satıcıya) bildirim yazmak için kullanılır — Firestore
   yazımı yapıldığı an, o kullanıcının kendi dinleyicisi (açıksa/canlıysa)
   bunu anında yakalar ve hem panelde listeler hem anlık toast/tarayıcı
   bildirimi gösterir. Firebase yapılandırılmadığında (yerel demo modu),
   tek simüle edilmiş kullanıcı için doğrudan state.notifications'a yazılır
   ve localStorage ile kalıcı hale getirilir (bkz. saveLocalAppState).

   Bildirim türleri (NOTIF_TYPES): purchase (Satın Alma), listing (İlan),
   message (Mesaj), balance (Bakiye), system (Sistem), admin (Admin Duyurusu).

   Yönetim Paneli > "Bildirim & Duyuru Yönetimi" sekmesinden admin; tüm
   kayıtlı kullanıcılara, sadece mağaza sahiplerine veya e-posta ile
   belirlediği tek/çoklu kullanıcıya — türünü ve tıklanınca gideceği
   yönlendirme bağlantısını (ilan/sipariş/mesaj/hesap sayfası vb.) seçerek
   bildirim/duyuru gönderebilir (bkz. adminSendAnnouncement). Belirli
   kullanıcıya gönderim doğrudan pushNotification() ile o kullanıcının
   notifications kaydına yazılır (anlık + kalıcı); toplu duyurular ise
   announcements koleksiyonu üzerinden (bkz. aşağıdaki DUYURULAR bölümü)
   yayınlanır. */
const NOTIF_TYPES = {
  purchase:{icon:'bag', color:'var(--blue)', label:'Satın Alma'},
  listing:{icon:'clipboard', color:'var(--orange)', label:'İlan'},
  message:{icon:'mail', color:'var(--blue)', label:'Mesaj'},
  balance:{icon:'wallet', color:'var(--green)', label:'Bakiye'},
  system:{icon:'bell', color:'var(--mid)', label:'Sistem'},
  admin:{icon:'sparkle', color:'var(--orange)', label:'Admin Duyurusu'},
};
function notifMeta(type){ return NOTIF_TYPES[type] || NOTIF_TYPES.system; }
/* Yeni bir bildirim geldiğinde kullanıcıyı ANINDA bilgilendirir: uygulama
   içi toast + (izin verilmişse) tarayıcı düzeyinde (OS) bildirim. */
function notifyUser(n){
  toast((n.title?n.title+' — ':'')+n.text, 'default');
  try{
    if(typeof Notification!=='undefined' && Notification.permission==='granted'){
      const osNotif = new Notification(n.title||'NADAS HİZMETLERİ', {body:n.text, tag:String(n.id||'')});
      osNotif.onclick = function(){ window.focus(); if(n.id) openNotificationItem(n.id); };
    }
  }catch(e){}
}
function requestNotifPermission(){
  try{
    if(typeof Notification!=='undefined' && Notification.permission==='default'){
      Notification.requestPermission().then(()=>renderHeaderOnly());
    }
  }catch(e){}
}
/* Bir hedef kullanıcıya (targetUid) bildirim gönderir. Canlı modda Firestore'a
   yazılır (kalıcı + çapraz-kullanıcı); yerel demo modunda tek kullanıcı için
   doğrudan state'e eklenir. */
async function pushNotification(targetUid, data){
  const payload = { uid: targetUid, type: data.type||'system', title: data.title||'', text: data.text||'', link: data.link||null, read:false };
  // listingId, SADECE başka bir kullanıcıya (ör. satıcıya) yazılan bildirimlerde
  // gönderilir — Firestore kuralı, isAdmin() dışındaki çapraz-kullanıcı
  // yazımlarını yalnızca istek sahibinin o listingId'yi GERÇEKTEN satın aldığı
  // (hasPurchased) VE hedef uid'in o ilanın satıcısı olduğu durumda kabul eder.
  if(data.listingId) payload.listingId = data.listingId;
  if(FIREBASE_ENABLED && fbDb && targetUid){
    try{
      // Oluşan dokümanın referansı geri döndürülür — admin panelindeki
      // "kullanıcıya özel bildirim" akışı, gönderdiği bildirimi daha sonra
      // geçmiş listesinden tekil olarak geri çekebilmek (silebilmek) için bu
      // referansa ihtiyaç duyar. Geri dönüş değerini kullanmayan mevcut tüm
      // çağrılar (satış/sipariş/duyuru bildirimleri) etkilenmez.
      return await fbDb.collection('notifications').add(Object.assign({}, payload, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
    }catch(err){ console.error('Bildirim kaydedilemedi:', err); return null; }
  }
  if(!FIREBASE_ENABLED){
    const n = Object.assign({id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2), createdAt:Date.now()}, payload);
    state.notifications.unshift(n);
    state.notifications = state.notifications.slice(0,150);
    notifyUser(n);
    renderHeaderOnly();
    saveLocalAppState();
    return {id:n.id};
  }
  return null;
}
let _notifUnsub = null;
let _notifInitialLoadDone = false;
/* Giriş yapan kullanıcının bildirimlerini CANLI dinler. Firestore, eş zamanlı
   (henüz sunucu onayı gelmemiş) yazımları da anında yerel önbellekten
   yansıttığı için kullanıcının kendi eylemiyle oluşan bildirimler de
   "anlık" görünür. İlk anlık görüntüdeki (mevcut geçmiş) kayıtlar için
   toast/OS bildirimi gösterilmez — sadece bundan SONRA eklenen gerçek
   yeni bildirimler için gösterilir. */
function watchNotifications(){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return;
  if(_notifUnsub) _notifUnsub();
  _notifInitialLoadDone = false;
  _notifUnsub = fbDb.collection('notifications')
    .where('uid','==', state.uid)
    .orderBy('createdAt','desc')
    .limit(150)
    .onSnapshot(function(snap){
      const list = snap.docs.map(function(d){
        const n = d.data()||{};
        return {
          id: d.id, type: n.type||'system', title: n.title||'', text: n.text||'',
          link: n.link||null, read: !!n.read,
          createdAt: (n.createdAt && n.createdAt.toMillis) ? n.createdAt.toMillis() : Date.now(),
        };
      });
      if(_notifInitialLoadDone){
        snap.docChanges().forEach(function(change){
          if(change.type==='added'){
            const n = list.find(x=>x.id===change.doc.id);
            if(n && !n.read) notifyUser(n);
          }
        });
      }
      _notifInitialLoadDone = true;
      state.notifications = list;
      renderHeaderOnly();
    }, function(err){ console.error('Bildirimler dinlenemedi:', err); });
}
function detachNotifListener(){ if(_notifUnsub){ _notifUnsub(); _notifUnsub=null; } _notifInitialLoadDone=false; }
/* Tüm bildirimleri okundu olarak işaretler — hem ekranda hem (canlı modda) Firestore'da. */
function markAllRead(){
  const unreadIds = state.notifications.filter(n=>!n.read).map(n=>n.id);
  if(!unreadIds.length) return;
  state.notifications.forEach(n=>n.read=true);
  renderHeaderOnly();
  if(FIREBASE_ENABLED && fbDb && state.uid){
    const batch = fbDb.batch();
    unreadIds.forEach(function(id){ batch.update(fbDb.collection('notifications').doc(id), {read:true}); });
    batch.commit().catch(err=>console.error('Bildirimler okundu işaretlenemedi:', err));
  }else{
    saveLocalAppState();
  }
}
/* Bir bildirime tıklandığında: okundu işaretlenir, panel kapanır ve varsa
   ilişkili sayfaya/ilana/işleme (link) doğrudan yönlendirilir. */
function openNotificationItem(id){
  const n = state.notifications.find(x=>String(x.id)===String(id));
  state.panelsOpen.notif = false;
  if(!n){ renderHeaderOnly(); return; }
  if(!n.read){
    n.read = true;
    if(FIREBASE_ENABLED && fbDb && state.uid){
      fbDb.collection('notifications').doc(String(id)).update({read:true}).catch(()=>{});
    }else{
      saveLocalAppState();
    }
  }
  if(n.link && n.link.view) go(n.link.view, n.link.params||{});
  else renderHeaderOnly();
}

/* ---------------- DUYURULAR (bildirim sisteminin sistem bildirimi kaynağı) ---------------- */
let _announceUnsub = null;
function announceMatchesUser(a){
  if(!a) return false;
  if(a.delivered) return false; // gönderim anında herkese doğrudan bildirim olarak iletildi, tekrar işlenmez
  if(a.audience==='sellers') return !!(state.shopName && state.shopName.trim());
  return true; // 'all' -> tüm kayıtlı kullanıcılar
}
function seenAnnouncementIds(){
  try{ return JSON.parse(localStorage.getItem('duyuru_seen_'+state.uid)||'[]'); }catch(e){ return []; }
}
function markAnnouncementSeen(id){
  try{
    const seen = seenAnnouncementIds();
    if(!seen.includes(id)){ seen.push(id); localStorage.setItem('duyuru_seen_'+state.uid, JSON.stringify(seen.slice(-200))); }
  }catch(e){}
}
function pushAnnouncementNotification(a){
  markAnnouncementSeen(a.id);
  // a.type / a.link, admin panelindeki genişletilmiş duyuru formundan gelir
  // (bkz. adminSendAnnouncement). Eski (bu alanlar olmadan gönderilmiş)
  // duyurular için geriye dönük uyumlu varsayılanlar kullanılır: tür
  // 'admin' (Admin Duyurusu), bağlantı yoksa Destek sayfası.
  pushNotification(state.uid, { type: a.type||'admin', title: a.title||'Duyuru', text: a.text||'', link: a.link||{view:'support', params:{}} });
}
async function loadAnnouncementsForUser(){
  if(!FIREBASE_ENABLED || !state.uid) return;
  try{
    const snap = await fbDb.collection('announcements').orderBy('createdAt','desc').limit(20).get();
    const seen = seenAnnouncementIds();
    const docs = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    docs.slice().reverse().forEach(function(a){
      if(!seen.includes(a.id) && announceMatchesUser(a)) pushAnnouncementNotification(a);
    });
  }catch(err){ console.error('Duyurular yüklenemedi:', err); }
  watchAnnouncementsRealtime();
}
function watchAnnouncementsRealtime(){
  if(!FIREBASE_ENABLED || !state.uid) return;
  if(_announceUnsub) _announceUnsub();
  _announceUnsub = fbDb.collection('announcements').orderBy('createdAt','desc').limit(1)
    .onSnapshot(function(snap){
      snap.docChanges().forEach(function(change){
        if(change.type!=='added') return;
        const a = Object.assign({id:change.doc.id}, change.doc.data());
        const seen = seenAnnouncementIds();
        if(!seen.includes(a.id) && announceMatchesUser(a)) pushAnnouncementNotification(a);
      });
    }, function(err){ console.error('Duyuru dinleyici hatası:', err); });
}
async function loadAnnouncementsForAdmin(){
  if(!FIREBASE_ENABLED) return;
  try{
    const snap = await fbDb.collection('announcements').orderBy('createdAt','desc').limit(50).get();
    state.announcements = snap.docs.map(d=>Object.assign({id:d.id, createdAt: d.data().createdAt && d.data().createdAt.toMillis ? d.data().createdAt.toMillis() : Date.now()}, d.data()));
    if(state.view==='admin') render();
  }catch(err){ console.error('Duyurular (admin) yüklenemedi:', err); }
}

  type = type||'default';
  const id = Math.random().toString(36).slice(2);
  state.toasts.push({id,msg,type});

  setTimeout(()=>{ state.toasts = state.toasts.filter(t=>t.id!==id); renderToasts(); }, 3400);

function toggleFav(id){
  if(state.favorites.has(id)){ state.favorites.delete(id); toast('Favorilerden kaldırıldı'); }
  else { state.favorites.add(id); toast('Favorilere eklendi','success'); }
  render();
}
function addToCart(id){
  const l = findListing(id);
  if(!l) return;
  if(!isListingPublic(l)){ toast('Bu ürün stokta kalmadı.','error'); return; }
  if((l.stock||0) < 1){ toast('Bu ürün stokta kalmadı.','error'); return; }
  const item = state.cart.find(c=>c.id===id);
  const currentQty = item ? item.qty : 0;
  if(currentQty + 1 > l.stock){ toast(`Stokta en fazla ${l.stock} adet var.`,'error'); return; }
  if(item) item.qty++;
  else state.cart.push({id,qty:1});
  toast(l.title.slice(0,28)+'… sepete eklendi','success');
  render();
}

function aiAssistBubble(m){
  if(m.role==='bot'){
    return `<div class="ai-msg bot"><div class="ai-msg-avatar">${ic('bolt',13)}</div><div class="ai-msg-bubble">${m.html}</div></div>`;
  }
  return `<div class="ai-msg me"><div class="ai-msg-avatar">${ic('user',13)}</div><div class="ai-msg-bubble">${esc(m.text)}</div></div>`;
}

function aiAssistInnerHtml(){
  const msgs = state.aiAssist.messages;
  const thread = msgs.length
    ? msgs.map(aiAssistBubble).join('')
    : `<div class="ai-msg bot"><div class="ai-msg-avatar">${ic('bolt',13)}</div><div class="ai-msg-bubble"><p>${AI_ASSIST_GREETING}</p></div></div>`;
  const typingHtml = state.aiAssist.typing
    ? `<div class="ai-msg bot"><div class="ai-msg-avatar">${ic('bolt',13)}</div><div class="ai-msg-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div></div>`
    : '';
  return `
  <div class="ai-assist-body">
    <div class="ai-assist-thread">${thread}${typingHtml}</div>
  </div>
  <div class="ai-assist-suggest">
    ${AI_ASSIST_SUGGESTIONS.map(s=>`<button type="button" class="ai-chip" onclick="sendAIAssistMessage(${JSON.stringify(s)})">${esc(s)}</button>`).join('')}
  </div>
  <form class="ai-assist-compose" onsubmit="event.preventDefault(); sendAIAssistMessage(this.aimsg.value); this.reset();">
    <input name="aimsg" type="text" autocomplete="off" placeholder="Bir soru yaz... (ör. Bakiye çekmek istiyorum)" maxlength="200">
    <button class="btn btn-primary" type="submit" aria-label="Gönder">${ic('send',16)}</button>

}

/* Asistan iki yerde görünebilir: ana sayfadaki sabit kart (#aiAssistRoot) ve
   sitenin her yerinden erişilebilen floating buton/panel (#aiAssistFabBody).
   İkisi de aynı state.aiAssist.messages'ı paylaşır; hangisi DOM'daysa o
   güncellenir, olmayan sessizce atlanır. */
function renderAIAssistBox(){
  const inlineRoot = document.getElementById('aiAssistRoot');
  if(inlineRoot){
    inlineRoot.innerHTML = aiAssistInnerHtml();
    const t = inlineRoot.querySelector('.ai-assist-thread');
    if(t) t.scrollTop = t.scrollHeight;
  }
  const fabBody = document.getElementById('aiAssistFabBody');
  if(fabBody){
    fabBody.innerHTML = aiAssistInnerHtml();
    const t = fabBody.querySelector('.ai-assist-thread');
    if(t) t.scrollTop = t.scrollHeight;
    const sub = document.querySelector('#aiAssistFabRoot .ai-panel-head-txt span');
    if(sub) sub.textContent = state.aiAssist.messages.length ? `${state.aiAssist.messages.length} mesaj` : 'Site hakkında soru sor';
  }
}

function sendAIAssistMessage(raw){
  const text = String(raw||'').trim();
  if(!text) return;
  state.aiAssist.messages.push({role:'user', text});
  state.aiAssist.typing = true;
  renderAIAssistBox();
  setTimeout(()=>{
    const html = aiMatchIntent(text) || aiFallbackReply();
    state.aiAssist.typing = false;
    state.aiAssist.messages.push({role:'bot', html});
    renderAIAssistBox();
  }, 450);
}

/* ---- Floating buton + panel (Global Chat'in hemen üstünde, tüm sayfalarda) ---- */
function toggleAIAssistFab(){
  const opening = !state.aiAssist.open;
  state.aiAssist.open = opening;
  // Global Chat'teki gibi: panel ÖNCE anında (class toggle) açılır, içerik
  // hemen ardından bir sonraki frame'de, gerekirse "Yükleniyor..." ile
  // birlikte güncellenir — böylece buton geç açılıyormuş hissi vermez.
  const panel = document.getElementById('aiAssistPanel');
  const loading = document.getElementById('aiAssistLoading');
  const fab = document.querySelector('#aiAssistFabRoot .ai-fab');
  if(panel) panel.classList.toggle('is-open', opening);
  if(fab){
    fab.classList.toggle('is-open', opening);
    fab.setAttribute('aria-label', opening?'Yapay zeka asistanını kapat':'Yapay zeka asistanını aç');
    fab.innerHTML = `${ic(opening?'close':'bolt', 22)}${!opening?'<span class="ai-fab-badge">Beta</span>':''}`;
  }
  if(opening && loading) loading.style.display='flex';
  requestAnimationFrame(()=>{
    renderAIAssistFab();
    updateBodyScrollLock();
    const l2 = document.getElementById('aiAssistLoading');
    if(l2) l2.style.display='none';
  });
}
function closeAIAssistFab(){
  if(state.aiAssist.open){ state.aiAssist.open = false; renderAIAssistFab(); updateBodyScrollLock(); }
}
function renderAIAssistFab(){
  const root = document.getElementById('aiAssistFabRoot');
  if(!root) return;
  const open = state.aiAssist.open;
  const panel = document.getElementById('aiAssistPanel');
  if(panel){
    panel.classList.toggle('is-open', !!open);
    const fab = root.querySelector('.ai-fab');
    if(fab){
      fab.classList.toggle('is-open', !!open);
      fab.setAttribute('aria-label', open?'Yapay zeka asistanını kapat':'Yapay zeka asistanını aç');
      fab.innerHTML = `${ic(open?'close':'bolt', 22)}${!open?'<span class="ai-fab-badge">Beta</span>':''}`;
    }
    return;
  }
  root.innerHTML = `
    <button class="ai-fab ${open?'is-open':''}" onclick="toggleAIAssistFab()" aria-label="${open?'Yapay zeka asistanını kapat':'Yapay zeka asistanını aç'}">
      ${ic(open?'close':'bolt', 22)}
      ${!open?'<span class="ai-fab-badge">Beta</span>':''}
    </button>
    <div class="ai-panel ${open?'is-open':''}" id="aiAssistPanel" role="dialog" aria-label="Yapay Zeka Asistanı">
      <div class="ai-panel-head">
        <div class="ai-panel-head-ico">${ic('bolt',16)}</div>
        <div class="ai-panel-head-txt">
          <b>Yapay Zeka Asistanı <span class="beta-pill">Beta</span></b>
          <span>${state.aiAssist.messages.length ? `${state.aiAssist.messages.length} mesaj` : 'Site hakkında soru sor'}</span>
        </div>
        <button class="gchat-close" onclick="closeAIAssistFab()" aria-label="Kapat">${ic('close',18)}</button>
      </div>
      <div class="ai-panel-body" id="aiAssistFabBody">${aiAssistInnerHtml()}</div>
      <div class="fab-loading" id="aiAssistLoading"><div class="fab-spinner"></div><span>Yükleniyor...</span></div>
    </div>
  `;
}

function viewMarket(){
  if(state.params.cat){ state.filters.cats = new Set([state.params.cat]); state.params.cat=null; }
  if(state.params.type){ state.filters.types = new Set([state.params.type]); state.params.type=null; }
  if(state.params.deals){ state.filters.dealsOnly = true; state.params.deals=null; }
  if(state.params.sort){ state.filters.sort = state.params.sort; state.params.sort=null; }

  let results = publicListings();
  if(state.query) results = results.filter(l=>l.title.toLowerCase().includes(state.query.toLowerCase()) || catName(l.cat).toLowerCase().includes(state.query.toLowerCase()));
  if(state.filters.cats.size) results = results.filter(l=>state.filters.cats.has(l.cat));
  if(state.filters.types.size) results = results.filter(l=>state.filters.types.has(l.type));
  if(state.filters.trustedOnly) results = results.filter(l=>l.seller.verified);
  if(state.filters.dealsOnly) results = results.filter(l=>l.oldPrice);
  if(state.filters.minPrice) results = results.filter(l=>l.price>=Number(state.filters.minPrice));
  if(state.filters.maxPrice) results = results.filter(l=>l.price<=Number(state.filters.maxPrice));
  switch(state.filters.sort){
    case 'price_asc': results.sort((a,b)=>a.price-b.price); break;
    case 'price_desc': results.sort((a,b)=>b.price-a.price); break;
    case 'newest': results.sort((a,b)=>b.createdAt-a.createdAt); break;
    case 'rating': results.sort((a,b)=>b.seller.rating-a.seller.rating); break;
  }

  return `
  <div class="wrap">
    <div style="margin-top:20px;">
      <div class="disp section-title">İlan Pazarı</div>
      <div class="section-sub">${state.query?`"${esc(state.query)}" için sonuçlar`:'Tüm kategorilerdeki ilanları keşfet'}</div>
    </div>
    <div class="market-layout">
      <aside class="filter-panel hide-sm">
        <div class="filter-title">Oyun / Kategori</div>
        <div class="filter-group">
          ${CATEGORIES.map(c=>`
            <label class="check-row">
              <input type="checkbox" ${state.filters.cats.has(c.id)?'checked':''} onchange="toggleCatFilter('${c.id}')">
              ${ic(c.icon,15)} ${c.name}
            </label>
          `).join('')}
        </div>
        <div class="filter-title">İlan Türü</div>
        <div class="filter-group">
          ${TYPES.map(t=>`
            <label class="check-row">
              <input type="checkbox" ${state.filters.types.has(t.id)?'checked':''} onchange="toggleTypeFilter('${t.id}')">
              ${ic(t.icon,15)} ${t.name}
            </label>
          `).join('')}
        </div>
        <div class="filter-title">Fiyat Aralığı</div>
        <div class="filter-group range-row">
          <input type="number" placeholder="Min ₺" value="${state.filters.minPrice}" onchange="state.filters.minPrice=this.value;render();">
          <input type="number" placeholder="Max ₺" value="${state.filters.maxPrice}" onchange="state.filters.maxPrice=this.value;render();">
        </div>
        <div class="filter-title">Diğer</div>
        <div class="filter-group">
          <label class="check-row"><input type="checkbox" ${state.filters.trustedOnly?'checked':''} onchange="state.filters.trustedOnly=this.checked;render();"> Sadece güvenilir satıcı</label>
          <label class="check-row"><input type="checkbox" ${state.filters.dealsOnly?'checked':''} onchange="state.filters.dealsOnly=this.checked;render();"> Sadece fırsat ürünleri</label>
        </div>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="clearFilters()">Filtreleri Temizle</button>
      </aside>
      <div>
        <div class="market-toolbar">
          <div class="result-count">${results.length} sonuç bulundu</div>
          <select class="sortsel" onchange="state.filters.sort=this.value;render();">
            <option value="relevance" ${state.filters.sort==='relevance'?'selected':''}>İlgiye Göre</option>

/* ---------------- MAĞAZA ARA / MAĞAZA PROFİLİ ----------------
   Mağazalar LISTINGS içinden benzersiz mağaza kimliğine (seller.sellerUid) göre
   gruplanır. Bir kullanıcının tüm ilanları aynı uid'i taşıdığı ve mağaza adı/foto
   değişince syncSellerInfoAcrossListings ile TÜM ilanlarda güncellendiği için, her
   uid için listede daima TEK ve GÜNCEL bir mağaza kaydı görünür — eski isimle
   mükerrer kayıt oluşamaz. sellerUid'i olmayan (ör. yönetici) ilanlar isme göre
   ayrı ayrı gruplanır. */
function collectStores(){
  const groups = new Map();
  publicListings().forEach(l=>{
    const s = l.seller || {};
    const key = s.sellerUid ? ('uid:'+s.sellerUid) : ('name:'+(s.name||'Bilinmeyen'));
    if(!groups.has(key)){
      groups.set(key, { uid: s.sellerUid||null, name: s.name||'Bilinmeyen', photoURL: s.photoURL||'', verified:false, priority:false, ratingSum:0, ratingCount:0, sales:0, listingCount:0 });
    }
    const g = groups.get(key);
    g.name = s.name || g.name; // her zaman güncel (senkronize edilmiş) ad
    g.photoURL = s.photoURL || g.photoURL;
    g.verified = g.verified || !!s.verified;
    g.priority = g.priority || !!s.priority;
    g.ratingSum += (typeof s.rating==='number'?s.rating:5);
    g.ratingCount += 1;
    g.sales += (s.sales||0);
    g.listingCount += 1;
  });
  return Array.from(groups.values()).map(g=>Object.assign(g,{rating:(g.ratingSum/(g.ratingCount||1)).toFixed(1)}));
}
function viewStores(){
  const q = (state.storeQuery||'').trim().toLowerCase();
  let stores = collectStores();
  if(q) stores = stores.filter(s=>s.name.toLowerCase().includes(q));

  return `

        <div style="flex:1;min-width:0;">
          <b style="font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(s.name)} ${s.verified?'<span class="verified-badge">✓</span>':''} ${s.priority?`<span class="priority-badge">${ic('crown',11)}</span>`:''}</b>
          <div class="small text-mid">★ ${s.rating} · ${s.listingCount} ilan · ${s.sales} satış</div>
        </div>
      </div>`).join('')}</div>` : `<div class="empty-state"><div class="em-icon">${ic('store',30)}</div><b>Mağaza bulunamadı</b></div>`}

function renderMainOnly(){
  const main = document.querySelector('main');
  if(!main) return;
  // Firestore onSnapshot güncellemeleri (ör. başka bir kullanıcının yeni
  // mesajı) bu fonksiyonu tetikleyip mesajlar sayfasının tüm innerHTML'ini
  // yeniden oluşturabilir. Bu sırada kullanıcının henüz göndermediği,
  // yazmakta olduğu metnin kaybolmaması için input değeri + imleç konumu +
  // odak durumu yeniden çizimden önce alınır ve sonra geri yüklenir.
  // NOT: Bu, sadece bu fonksiyon doğrudan çağrıldığında (ör. sohbet
  // değiştirme, sayfa navigasyonu) geçerlidir. Canlı mesaj/sohbet listesi
  // güncellemeleri artık refreshMessagesLive() kullanır ve input'a HİÇ
  // dokunmaz — bkz. o fonksiyonun açıklaması.
  const msgInput = document.getElementById('msgComposeInput');
  const hadFocus = msgInput && document.activeElement===msgInput;
  const savedValue = msgInput ? msgInput.value : null;
  const savedStart = hadFocus ? msgInput.selectionStart : null;
  const savedEnd = hadFocus ? msgInput.selectionEnd : null;
  main.innerHTML = currentViewHtml();
  if(savedValue){
    const newInput = document.getElementById('msgComposeInput');
    if(newInput){
      newInput.value = savedValue;
      if(hadFocus){
        newInput.focus();
        if(savedStart!=null) newInput.setSelectionRange(savedStart, savedEnd);
      }
    }
  }
  scrollMsgThreadToBottom();
}
/* CANLI mesaj/sohbet listesi güncellemesi (onSnapshot tetiklendiğinde).
   renderMainOnly()'nin aksine, mesaj yazma kutusunu (input) İÇEREN formu
   DOM'dan HİÇ kaldırmaz — sadece sohbet listesini (.msgs-list-scroll),
   aktif sohbetin başlığını ve mesaj balonlarını (#msgThread) günceller.
   Neden önemli: bir input mobilde DOM'dan silinip yeniden oluşturulduğunda
   -native klavye kapanır ve bunu bir kullanıcı dokunuşu OLMADAN (yani bir
   ağ/onSnapshot callback'i içinde) programatik .focus() ile geri açmak
   mobil tarayıcılarda (özellikle iOS Safari) güvenilir çalışmaz. Input
   düğümüne hiç dokunulmayınca değeri, imleç konumu, odağı ve mobil
   klavyesi olduğu gibi korunur — kim yazıyorsa, ne yazdıysa aynen kalır. */
function refreshMessagesLive(){
  if(state.view!=='messages') return;
  const shell = document.getElementById('msgsShell');
  if(!shell){ renderMainOnly(); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = currentViewHtml();
  const newShell = tmp.querySelector('#msgsShell');
  if(!newShell){ renderMainOnly(); return; }
  shell.className = newShell.className;
  [
    ['.msgs-count','text'],
    ['.msgs-list-scroll','html'],
    ['.msgs-chat-name','text'],
    ['.msgs-chat-sub','text'],
    ['#msgThread','html'],
  ].forEach(function(pair){
    const sel = pair[0], mode = pair[1];
    const cur = shell.querySelector(sel);
    const neu = newShell.querySelector(sel);
    if(!cur || !neu) return;
    if(mode==='html') cur.innerHTML = neu.innerHTML; else cur.textContent = neu.textContent;
  });
  scrollMsgThreadToBottom();
}
/* Sohbet balonları listesi güncellendiğinde (yeni mesaj / sohbet değişimi)
   sohbet alanını otomatik olarak en alta kaydırır. Ayrıca mobilde tam ekran
   sohbet açıkken arka plandaki sayfanın kaymasını (double-scroll) engeller. */
function scrollMsgThreadToBottom(){
  if(state.view==='messages'){
    const el = document.getElementById('msgThread');
    if(el) el.scrollTop = el.scrollHeight;
  }
  updateBodyScrollLock();
}
/* Sayfanın arka planının kaymasını (double-scroll) engeller — hem mobilde
   tam ekran açılan özel mesaj sohbetinde HEM DE mobilde tam ekran açılan
   Global Sohbet panelinde geçerlidir; ikisi de bağımsız olarak kontrol
   edilir ki biri diğerinin kilidini yanlışlıkla açmasın. */
function updateBodyScrollLock(){
  const shell = document.getElementById('msgsShell');
  const msgsFullscreen = state.view==='messages' && !!shell && shell.classList.contains('chat-open') && window.innerWidth < 860;
  const gchatFullscreen = !!(state.gchat && state.gchat.open) && window.innerWidth < 860;
  const aiFullscreen = !!(state.aiAssist && state.aiAssist.open) && window.innerWidth < 860;
  document.body.style.overflow = (msgsFullscreen || gchatFullscreen || aiFullscreen) ? 'hidden' : '';
}
/* ---------------- MESAJLAŞMA: SOHBET BAŞLATMA ----------------
   Kullanıcı bir mağazaya (satıcıya) yazmak istediğinde çağrılır. Aynı iki
   kullanıcı arasında zaten bir sohbet varsa YENİ bir sohbet OLUŞTURULMAZ,
   mevcut sohbet açılır — böylece mesaj geçmişi hep aynı konuşmada birikir.
   Mesajlarda kullanıcıların ad-soyadı asla kullanılmaz; yalnızca mağaza adı
   (displayName/sellerDisplayName ile aynı kaynaktan) gösterilir. */
async function messageSeller(sellerUid, sellerName, listingId, listingTitle){
  if(!state.loggedIn){ toast('Mesaj göndermek için önce giriş yapmalısın','error'); openAuthModal('login'); return; }
  sellerName = (sellerName||'Mağaza').trim() || 'Mağaza';
  if(!FIREBASE_ENABLED || !fbDb){ openLocalConversation(sellerName, listingTitle); return; }
  if(!sellerUid){ toast('Bu mağazaya şu anda mesaj gönderilemiyor','error'); return; }
  if(sellerUid===state.uid){ toast('Kendi mağazana mesaj gönderemezsin','error'); return; }
  const convId = [state.uid, sellerUid].sort().join('_');
  state.activeConversation = convId;
  state.msgMobileOpen = true;
  go('messages',{});
  try{
    const ref = fbDb.collection('conversations').doc(convId);
    const snap = await ref.get();
    if(!snap.exists){
      const myName = displayName();
      await ref.set({
        participants: [state.uid, sellerUid],
        names: { [state.uid]: myName, [sellerUid]: sellerName },
        listingId: listingId||'', listingTitle: listingTitle||'',
        lastMessage:'', lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        messageCount:0, autoReplySent:false,
        unread: { [state.uid]:false, [sellerUid]:false },
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
  }catch(err){ console.error('Sohbet açılamadı:', err); toast('Sohbet açılamadı','error'); }
  attachMessagesListener(convId);
}
