<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="NADAS HİZMETLERİ — oyun hesapları, UC/elmas bakiye, popülerlik (boost), klan ve takas ilanları için güvenli, hızlı pazaryeri.">
<meta name="theme-color" content="#050810">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>NADAS HİZMETLERİ — Oyun & Dijital Ürün Pazaryeri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --void:#050810;
  --panel:#0B1224;
  --panel-2:#0E1730;
  --elevated:#121D3A;
  --border:#1C2947;
  --border-soft:#152038;
  --orange:#FF7A29;
  --orange-soft:rgba(255,122,41,.14);
  --orange-glow:rgba(255,122,41,.35);
  --blue:#3B8CFF;
  --blue-soft:rgba(59,140,255,.14);
  --blue-glow:rgba(59,140,255,.35);
  --green:#1FCF6E;
  --green-soft:rgba(31,207,110,.14);
  --green-glow:rgba(31,207,110,.38);
  --hi:#F2F5FC;
  --mid:#98A4C2;
  --low:#5B6789;
  --success:#33D68F;
  --danger:#F76B6B;
  --warning:#FBBF24;
  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(59,140,255,.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(255,122,41,.08), transparent 55%),
    var(--void);
  color:var(--hi);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:74px;
  overflow-x:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Space Grotesk',sans-serif;}
img,svg{display:block;max-width:100%;}
button,.card,.cat-card,.icon-btn,.subnav-item,.bn-item,.panel-nav-item{touch-action:manipulation;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;outline:none;font-size:16px;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px;}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px;}
.hide-sm{display:none;}
@media(min-width:860px){.hide-sm{display:initial;} .hide-lg{display:none !important;}}
@media(max-width:479px){.wrap{padding:0 14px;} .icon-btn{width:34px;height:34px;} .avatar{width:32px;height:32px;} .topbar-inner{gap:6px;padding:12px 12px;} .topbar-side{gap:5px;} .logo-text{font-size:14px;} .logo-text span{font-size:8.5px;} .logo-mark{width:32px;height:32px;font-size:14px;} .user-info-btn{padding:5px 8px 5px 5px;gap:6px;} .user-info-btn .ub-amount{font-size:11px;}}
@media(max-width:359px){.logo-text span{display:none;}}

/* ---------- HEADER ---------- */
header.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(5,8,16,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-inner{display:flex;align-items:center;gap:10px;padding:12px 18px;max-width:1240px;margin:0 auto;}
.topbar-side{display:flex;align-items:center;gap:8px;flex:1;}
.topbar-side.right{justify-content:flex-end;}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;cursor:pointer;}
.auth-bar{display:flex;gap:10px;padding:0 18px 12px;max-width:1240px;margin:0 auto;}
.auth-bar .btn{flex:1;justify-content:center;padding:11px 14px;font-size:13.5px;}
.user-bar{display:flex;align-items:center;gap:10px;padding:0 18px 12px;max-width:1240px;margin:0 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.user-bar::-webkit-scrollbar{display:none;}
.user-bar-left{display:flex;align-items:center;gap:10px;}
.user-bar-balance{display:flex;flex-direction:column;line-height:1.25;}
.user-bar-balance .ub-label{font-size:10px;color:var(--low);font-weight:600;letter-spacing:.3px;}
.user-bar-balance .ub-amount{font-family:'JetBrains Mono';font-size:15px;font-weight:700;color:var(--hi);}
.user-bar-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;flex-wrap:nowrap;}
.user-bar-group{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.topbar-divider{height:1px;background:var(--border);margin:0 18px;}
.user-bar-actions .btn{height:36px;padding:0 13px;font-size:12.5px;box-sizing:border-box;}
.user-bar-actions .icon-btn{width:36px;height:36px;}
.user-bar-actions .user-info-btn{height:36px;padding:0 8px 0 4px;gap:6px;box-sizing:border-box;}
.user-bar-actions .user-info-btn .avatar{width:28px;height:28px;font-size:11px;}
.user-bar-actions .user-info-btn .ub-amount{font-size:11px;}
.user-info-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);padding:6px 10px 6px 6px;border-radius:999px;transition:.15s;flex-shrink:0;}
.user-info-btn:hover{border-color:var(--orange);background:var(--elevated);}
.user-info-btn .avatar{width:28px;height:28px;border-radius:50%;font-size:11.5px;}
.user-info-btn .ub-amount{font-family:'JetBrains Mono';font-size:12.5px;color:var(--orange);font-weight:700;white-space:nowrap;}
.logo-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--orange),var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;font-size:16px;color:#050810;
  box-shadow:0 0 22px var(--orange-glow);
}
.logo-text{font-family:'Space Grotesk';font-weight:700;font-size:16.5px;letter-spacing:.2px;line-height:1.05;}
.logo-text span{display:block;font-family:'Inter';font-weight:500;font-size:10px;color:var(--mid);letter-spacing:1.5px;}
.icon-btn{
  position:relative;width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--border);color:var(--mid);
  transition:.15s;flex-shrink:0;
}
.icon-btn:hover{border-color:var(--blue);color:var(--hi);}
.badge-dot{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;
  background:var(--orange);border-radius:999px;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;color:#0a0e18;border:2px solid var(--void);
  animation:badgePulse 1.8s ease-in-out infinite;
}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 var(--orange-glow);}50%{box-shadow:0 0 0 4px rgba(255,122,41,0);}}
/* ---------- BİLDİRİM PANELİ ---------- */
.notif-panel{
  position:absolute;right:18px;top:64px;width:340px;max-width:90vw;
  background:var(--panel-2);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 24px 48px -16px rgba(0,0,0,.65);z-index:60;overflow:hidden;
  display:flex;flex-direction:column;max-height:min(480px,70vh);
  animation:notifIn .16s ease;
}
@keyframes notifIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.notif-panel-head{
  padding:14px 14px 12px;border-bottom:1px solid var(--border-soft);
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0;
}
.notif-panel-head b{font-size:13.5px;font-family:'Space Grotesk';}
.notif-panel-list{overflow-y:auto;flex:1;}
.notif-item{
  width:100%;text-align:left;display:flex;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--border-soft);transition:.12s;background:transparent;
}
.notif-item:hover{background:var(--elevated);}
.notif-item.unread{background:rgba(59,140,255,.06);}
.notif-item.unread:hover{background:rgba(59,140,255,.11);}
.notif-item-ico{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.notif-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.notif-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.notif-item-title{font-size:12.5px;font-weight:700;color:var(--hi);}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.notif-item-text{font-size:12px;line-height:1.5;color:var(--mid);word-break:break-word;}
.notif-item-time{font-size:10.5px;color:var(--low);margin-top:1px;}
.notif-empty{padding:38px 20px;text-align:center;color:var(--low);}
.notif-empty svg{margin:0 auto 10px;opacity:.5;}
.notif-empty p{font-size:12.5px;}
.btn{
  border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s;
}
.btn-primary{background:linear-gradient(135deg,var(--orange),#ff9354);color:#170a02;box-shadow:0 4px 18px -4px var(--orange-glow);}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-outline{background:var(--panel);border:1px solid var(--border);color:var(--hi);}
.btn-outline:hover{border-color:var(--blue);}
.btn-success{background:linear-gradient(135deg,var(--green),#4ee08a);color:#04170c;box-shadow:0 4px 18px -4px var(--green-glow);}
.btn-success:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--mid);}
.btn-ghost:hover{color:var(--hi);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}
.avatar{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),#6aa8ff);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#04101f;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-picker{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.photo-picker .avatar{width:64px;height:64px;border-radius:16px;font-size:22px;}
/* ---------- CATEGORY MENU (fullscreen) ---------- */
.catmenu-overlay{
  position:fixed;inset:0;z-index:200;display:flex;
  background:var(--void);
  animation:catmenuIn .16s ease;
}
@keyframes catmenuIn{from{opacity:0;}to{opacity:1;}}
.catmenu-rail{
  width:78px;flex-shrink:0;height:100%;overflow-y:auto;scrollbar-width:none;
  background:var(--panel);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;align-items:stretch;
}
.catmenu-rail::-webkit-scrollbar{display:none;}
.catmenu-rail-close{
  width:100%;aspect-ratio:1/1;flex-shrink:0;
  background:var(--danger);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.catmenu-rail-item{
  width:100%;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;flex-shrink:0;border-bottom:1px solid var(--border-soft);
}
.catmenu-rail-item span:last-child{font-size:10px;font-weight:600;color:var(--mid);line-height:1.2;}
.catmenu-rail-item.active span:last-child{color:var(--blue);}
.catmenu-rail-item.active{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--blue);}
.catmenu-rail-ico{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--elevated);color:var(--mid);flex-shrink:0;
}
.catmenu-main{flex:1;min-width:0;height:100%;overflow-y:auto;display:flex;flex-direction:column;}
.catmenu-topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px;
  border-bottom:1px solid var(--border-soft);background:var(--panel);
}
.catmenu-brand{display:flex;align-items:center;gap:9px;}
.catmenu-search{
  display:flex;align-items:center;gap:10px;margin:16px;padding:13px 16px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--low);
}
.catmenu-search input{background:transparent;border:none;color:var(--hi);flex:1;font-size:14px;}
.catmenu-search input::placeholder{color:var(--low);}
.catmenu-list{display:flex;flex-direction:column;gap:10px;padding:0 16px;}
.catmenu-row{
  display:flex;align-items:center;gap:13px;padding:14px 16px;
  background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--accent);
  border-radius:12px;width:100%;text-align:left;
}
.catmenu-row-ico{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.catmenu-row-name{flex:1;font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.catmenu-row-chevron{color:var(--low);}
.catmenu-quicklinks{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:20px 0 0;
  background:var(--border-soft);border-top:1px solid var(--border-soft);
}
.catmenu-quicklinks button{
  background:var(--panel);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;
  color:var(--mid);font-size:11px;font-weight:600;
}
@media(min-width:640px){
  .catmenu-rail{width:96px;}
  .catmenu-main{max-width:640px;}
}
.subnav{border-bottom:1px solid var(--border-soft);overflow-x:auto;scrollbar-width:none;}
.subnav::-webkit-scrollbar{display:none;}
.subnav-inner{display:flex;gap:4px;padding:9px 18px;max-width:1240px;margin:0 auto;}
.subnav-item{
  padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mid);
  white-space:nowrap;border:1px solid transparent;transition:.15s;
}
.subnav-item:hover{color:var(--hi);}
.subnav-item.active{background:var(--orange-soft);color:var(--orange);border-color:rgba(255,122,41,.3);}

/* ---------- LAYOUT ---------- */
main{min-height:60vh;}
.section{padding:34px 0 6px;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:10px;}
.section-title{font-family:'Space Grotesk';font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px;}
.section-sub{color:var(--mid);font-size:12.5px;margin-top:3px;}
.link-more{font-size:12.5px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:4px;flex-shrink:0;}
.link-more:hover{color:#6aa8ff;}
.feed-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;}
.feed-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.feed-icon{width:52px;height:52px;border-radius:16px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.feed-title{font-family:'Space Grotesk';font-size:20px;font-weight:700;}
.feed-tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:16px;padding:5px;}
.feed-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;border-radius:12px;font-size:13px;font-weight:700;color:var(--low);transition:.15s ease;}
.feed-tab.active{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(59,140,255,.35);}
.feed-body{margin-top:18px;}

/* ---------- HERO ---------- */
.hero{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  background:
    radial-gradient(600px 260px at 85% 0%, rgba(255,122,41,.20), transparent 60%),
    radial-gradient(500px 300px at 0% 100%, rgba(59,140,255,.22), transparent 60%),
    linear-gradient(160deg,#0C1530,#080D1C 70%);
  border:1px solid var(--border-soft);
  padding:40px 26px;margin-top:20px;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);
  padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;color:var(--orange);margin-bottom:16px;
}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(51,214,143,.6);animation:pulse 1.8s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(51,214,143,.55);}70%{box-shadow:0 0 0 8px rgba(51,214,143,0);}100%{box-shadow:0 0 0 0 rgba(51,214,143,0);}}
.hero h1{font-family:'Space Grotesk';font-size:clamp(26px,5vw,42px);font-weight:700;line-height:1.08;max-width:640px;letter-spacing:-.5px;}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--orange),#ffb066);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{color:var(--mid);font-size:14.5px;max-width:520px;margin-top:14px;line-height:1.6;}
.hero-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}
.hero-stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:'JetBrains Mono';font-size:19px;color:var(--hi);}
.hero-stat span{font-size:11px;color:var(--low);}

/* ---------- TICKER (signature element) ---------- */
.ticker-wrap{
  margin-top:18px;border:1px solid var(--border-soft);border-radius:12px;background:var(--panel);
  overflow:hidden;position:relative;
}
.ticker-label{
  position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;gap:6px;
  padding:0 14px;background:linear-gradient(90deg,var(--panel) 70%,transparent);
  font-size:10.5px;font-weight:700;color:var(--success);letter-spacing:.5px;
}
.ticker-track{display:flex;gap:26px;white-space:nowrap;padding:11px 0 11px 140px;animation:scroll-left 32s linear infinite;width:max-content;}
.ticker-wrap:hover .ticker-track{animation-play-state:paused;}
@keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.ticker-item{font-size:12px;color:var(--mid);display:flex;align-items:center;gap:7px;}
.ticker-item b{color:var(--hi);font-weight:600;}
.ticker-item .t-price{color:var(--orange);font-family:'JetBrains Mono';font-weight:600;}
@media(prefers-reduced-motion:reduce){.ticker-track{animation:none;}}

/* ---------- BANNERS ---------- */
.banner-row{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px;}
@media(min-width:720px){.banner-row{grid-template-columns:1.4fr 1fr;}}
.banner{
  border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden;min-height:120px;
  display:flex;flex-direction:column;justify-content:center;border:1px solid var(--border-soft);
}
.banner.b1{background:linear-gradient(120deg,#2a1104,#150a1f 60%,#081226);}
.banner.b2{background:linear-gradient(120deg,#04182a,#0a1230);}
.banner-tag{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--orange);text-transform:uppercase;margin-bottom:6px;}
.banner h3{font-family:'Space Grotesk';font-size:19px;margin-bottom:4px;}
.banner p{font-size:12.5px;color:var(--mid);max-width:280px;}

/* ---------- HESAP PASS ---------- */
.pass-card{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:24px;
  background:linear-gradient(120deg,#151038,#0a1230 55%,#0a1c30);
  border:1px solid rgba(139,92,246,.35);
  display:flex;flex-direction:column;gap:14px;
}
.pass-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(360px 200px at 90% 0%, rgba(139,92,246,.30), transparent 60%),
    radial-gradient(320px 220px at 0% 100%, rgba(59,140,255,.24), transparent 60%);
}
.pass-badge{
  position:relative;display:inline-flex;align-items:center;gap:6px;width:fit-content;
  background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.4);color:#c4b0ff;
  padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px;
}
.pass-card h3{position:relative;font-family:'Space Grotesk';font-size:19px;}
.pass-card p{position:relative;font-size:12.5px;color:var(--mid);max-width:440px;line-height:1.55;}
.pass-perks{position:relative;display:flex;gap:8px;flex-wrap:wrap;}
.pass-perk{
  display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--hi);
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:999px;padding:6px 12px;
}
.pass-perk svg{color:#a78bfa;}
.pass-card-actions{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;}
.pass-price{font-family:'JetBrains Mono';font-size:13px;color:var(--mid);}
.pass-price b{color:var(--hi);font-size:16px;}

/* ---------- TOP PROMO STRIP ---------- */
.promo-strip{
  display:flex;align-items:center;gap:14px;border-radius:var(--r-md);padding:14px 18px;margin-top:8px;
  background:linear-gradient(90deg,rgba(59,140,255,.22),rgba(59,140,255,.08));
  border:1px solid rgba(59,140,255,.35);
}
.promo-strip-icon{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);color:#c9deff;
}
.promo-strip-text{flex:1;min-width:0;}
.promo-strip-text b{display:block;font-size:14px;font-weight:700;}
.promo-strip-text span{font-size:11.5px;color:var(--mid);}

/* ---------- VALORANT-STYLE HERO BANNER ---------- */
.game-banner{
  position:relative;border-radius:var(--r-lg);overflow:hidden;padding:26px 22px;min-height:150px;
  display:flex;flex-direction:column;justify-content:center;margin-top:14px;
  background:linear-gradient(120deg,#2a0a12,#150a1f 55%,#081226);
  border:1px solid rgba(255,70,85,.3);
}
.game-banner::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 240px at 85% 15%, rgba(255,50,70,.30), transparent 60%);
}
.game-banner .gb-logo{position:relative;font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:1px;color:#fff;margin-bottom:10px;}
.game-banner h3{position:relative;font-family:'Space Grotesk';font-size:24px;font-weight:700;line-height:1.15;max-width:280px;}

/* ---------- BIG PASS PROMO CARD ---------- */
.pass-hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:26px 22px;margin-top:14px;
  background:linear-gradient(135deg,#0a1230,#0a1c30 60%,#0e1730);
  border:1px solid rgba(59,140,255,.35);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.pass-hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(360px 220px at 90% 10%, rgba(59,140,255,.28), transparent 60%);
}
.pass-hero-text{position:relative;}
.pass-hero-text .ph-eyebrow{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--blue);text-transform:uppercase;}
.pass-hero-text h3{font-family:'Space Grotesk';font-size:22px;font-weight:700;margin-top:4px;}
.pass-hero-text p{font-size:12.5px;color:var(--mid);margin-top:6px;}
.pass-hero-text .pass-price{display:block;margin-top:10px;}

/* ---------- GAME PILL ROW ---------- */
.pill-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin-top:16px;}
.pill-row::-webkit-scrollbar{display:none;}
.game-pill{
  flex-shrink:0;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:var(--r-md);
  background:var(--panel);border:1px solid var(--border);font-size:12.5px;font-weight:700;white-space:nowrap;
}
.game-pill.active{border-color:var(--orange);background:var(--orange-soft);color:var(--orange);}
.game-pill svg{flex-shrink:0;}

/* ---------- DEAL GRID (game currency cards) ---------- */
.deal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.deal-card{
  position:relative;overflow:hidden;border-radius:var(--r-md);padding:16px;min-height:96px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:2px;border:1px solid var(--border-soft);
}
.deal-card b{font-family:'Space Grotesk';font-size:14px;position:relative;}
.deal-card span{font-size:11px;font-weight:700;color:var(--success);position:relative;}
.deal-card .deal-icon{position:absolute;top:12px;left:12px;opacity:.9;}
.deal-card.d1{background:linear-gradient(135deg,#1a1408,#241005);}
.deal-card.d2{background:linear-gradient(135deg,#1a0a14,#150a1f);}
.deal-card.d3{background:linear-gradient(135deg,#0a1420,#0a1230);}
.deal-card.d4{background:linear-gradient(135deg,#0a1a14,#081a2a);}

/* ---------- GIFT CARD PLATFORM ROW ---------- */
.platform-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
.platform-card{
  border-radius:var(--r-md);padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;
  border:1px solid var(--border-soft);text-align:center;
}
.platform-card .p-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;}
.platform-card b{font-family:'Space Grotesk';font-size:13px;}
.platform-card span{font-size:10px;color:var(--mid);font-weight:600;letter-spacing:.3px;}
.platform-card.steam{background:var(--panel);}
.platform-card.psn{background:linear-gradient(135deg,#0d4fd1,#08306e);}
.platform-card.xbox{background:linear-gradient(135deg,#1c9c3c,#0e5c22);}

/* ---------- CATEGORY GRID ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(min-width:640px){.cat-grid{grid-template-columns:repeat(5,1fr);}}
@media(min-width:980px){.cat-grid{grid-template-columns:repeat(7,1fr);}}
.cat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  transition:.15s;
}
.cat-card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 8px 22px -10px rgba(0,0,0,.5);}
.cat-icon{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;
  background:var(--elevated);border:1px solid var(--border);
}
.cat-card b{font-size:11.5px;font-weight:600;line-height:1.25;}
.cat-card span{font-size:10px;color:var(--low);}

/* ---------- CATEGORY LANDING PAGE (PUBG Mobile vb.) ---------- */
.catpage-hero{
  position:relative;overflow:hidden;margin-top:18px;
  background:
    radial-gradient(650px 320px at 50% -20%, rgba(255,122,41,.16), transparent 60%),
    radial-gradient(500px 280px at 90% 100%, rgba(59,140,255,.14), transparent 60%),
    linear-gradient(180deg,#0A0F20,#050810 75%);
  border-bottom:1px solid var(--border-soft);
  padding:38px 0 34px;
}
.catpage-hero-inner{display:flex;flex-direction:column;align-items:center;text-align:center;}
.catpage-hero-badge{
  display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);
  padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;color:var(--orange);margin-bottom:16px;
}
.catpage-title{
  font-family:'Space Grotesk';font-weight:700;font-size:clamp(28px,7vw,44px);
  letter-spacing:-.5px;line-height:1.08;
  background:linear-gradient(90deg,#fff,#c7d1ea);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.catpage-desc{
  color:var(--mid);font-size:13.5px;line-height:1.65;max-width:560px;margin-top:14px;
}
.catpage-search{
  display:flex;align-items:center;gap:10px;width:100%;max-width:520px;margin-top:26px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:13px 16px;color:var(--low);box-shadow:0 14px 30px -16px rgba(0,0,0,.55);
}
.catpage-search input{background:transparent;border:none;color:var(--hi);flex:1;font-size:14px;min-width:0;}
.catpage-search input::placeholder{color:var(--low);}
.catpage-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  margin:28px 0 40px;
}
@media(min-width:640px){.catpage-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:980px){.catpage-grid{grid-template-columns:repeat(5,1fr);}}
.catpage-card{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;
  padding:22px 18px 20px;border-radius:var(--r-lg);text-align:left;
  background:linear-gradient(155deg,rgba(255,193,89,.14),rgba(255,122,41,.05) 55%,rgba(11,18,36,.4)), var(--panel);
  border:1px solid rgba(245,191,88,.28);
  box-shadow:0 16px 34px -18px rgba(0,0,0,.65);
  overflow:hidden;
  opacity:0;animation:catCardIn .38s ease forwards;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
@keyframes catCardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.catpage-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(140px 90px at 85% -10%, rgba(255,215,130,.22), transparent 70%);
  pointer-events:none;
}
.catpage-card:hover{
  transform:translateY(-4px);
  border-color:rgba(245,191,88,.55);
  box-shadow:0 20px 40px -16px rgba(0,0,0,.7), 0 0 0 1px rgba(245,191,88,.15) inset;
}
.catpage-card:active{transform:translateY(-1px) scale(.98);}
.catpage-card-icon{
  width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#F5BF58,#FF7A29);color:#1a0e02;
  box-shadow:0 8px 18px -8px rgba(245,191,88,.55);
}
.catpage-card-label{
  font-family:'Space Grotesk';font-weight:700;font-size:14px;line-height:1.3;color:var(--hi);
}
.catpage-card-arrow{
  position:absolute;right:14px;bottom:14px;color:#F5BF58;opacity:.85;
}

/* ---------- PRODUCT CARD ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:640px){.grid-cards{grid-template-columns:repeat(3,1fr);}}
@media(min-width:980px){.grid-cards{grid-template-columns:repeat(4,1fr);}}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
  display:flex;flex-direction:column;transition:.18s;position:relative;
}
.card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(0,0,0,.6);}
.card-media{
  aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;
  overflow:hidden;
}
.card-tags{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:2;}
.tag{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.3px;}
.tag-new{background:rgba(59,140,255,.18);color:#7db2ff;border:1px solid rgba(59,140,255,.35);}
.tag-deal{background:rgba(255,122,41,.18);color:var(--orange);border:1px solid rgba(255,122,41,.35);}
.tag-hot{background:rgba(247,107,107,.18);color:#ff9a9a;border:1px solid rgba(247,107,107,.35);}
.fav-btn{
  position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:8px;
  background:rgba(5,8,16,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.08);color:#cfd8ee;transition:.15s;
}
.fav-btn:hover{color:var(--orange);}
.fav-btn.active{color:var(--orange);background:rgba(255,122,41,.18);}
.card-body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-cat{font-size:10px;color:var(--low);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.card-title{font-size:13px;font-weight:600;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-seller{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mid);}
.verified-badge{display:inline-flex;align-items:center;gap:2px;color:var(--success);font-size:10px;font-weight:700;}
.priority-badge{display:inline-flex;align-items:center;gap:2px;color:var(--orange);font-size:10px;font-weight:700;}
.stars{color:var(--warning);font-size:10.5px;}
.card-price-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto;padding-top:6px;}
.price{font-family:'JetBrains Mono';font-weight:700;font-size:16px;color:var(--hi);}
.price-old{font-family:'JetBrains Mono';font-size:11px;color:var(--low);text-decoration:line-through;margin-right:6px;}
.discount-pct{font-size:10px;color:var(--success);font-weight:700;}
.card-actions{display:flex;gap:6px;padding:0 12px 12px;}
.card-actions .btn{flex:1;justify-content:center;padding:8px 6px;font-size:11.5px;}

/* skeleton */
.skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--elevated) 37%,var(--panel) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
@keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}
.sk-card{border-radius:var(--r-md);height:230px;}

/* ---------- MARKET PAGE ---------- */
.market-layout{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px;}
@media(min-width:900px){.market-layout{grid-template-columns:250px 1fr;}}
.filter-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;align-self:start;position:sticky;top:78px;}
.filter-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mid);margin-bottom:10px;}
.filter-group{margin-bottom:18px;}
.check-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;color:var(--mid);cursor:pointer;}
.check-row:hover{color:var(--hi);}
.check-row input{accent-color:var(--orange);width:15px;height:15px;}
.range-row{display:flex;gap:8px;}
.range-row input{width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--hi);font-size:12px;}
.market-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.result-count{font-size:12.5px;color:var(--mid);}
select.sortsel{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--hi);font-size:12.5px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--mid);}
.empty-state .em-icon{font-size:38px;margin-bottom:10px;}

/* ---------- DETAIL PAGE ---------- */
.detail-grid{display:grid;grid-template-columns:1fr;gap:26px;margin-top:20px;}
@media(min-width:900px){.detail-grid{grid-template-columns:1.15fr .85fr;}}
.gallery-main{aspect-ratio:4/3;border-radius:var(--r-lg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden;}
.gallery-thumbs{display:flex;gap:8px;margin-top:9px;}
.gallery-thumb{width:58px;height:58px;border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
.gallery-thumb.active{border-color:var(--orange);}
.detail-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;height:fit-content;}
.breadcrumb{font-size:11.5px;color:var(--low);margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap;}
.breadcrumb b{color:var(--mid);}
.detail-title{font-family:'Space Grotesk';font-size:21px;font-weight:700;line-height:1.25;margin-bottom:10px;}
.detail-price{font-family:'JetBrains Mono';font-size:30px;font-weight:700;color:var(--orange);}
.seller-card{display:flex;align-items:center;gap:11px;background:var(--elevated);border:1px solid var(--border);border-radius:12px;padding:12px;margin:16px 0;}
.seller-info b{font-size:13px;display:flex;align-items:center;gap:5px;}
.seller-info div{font-size:11px;color:var(--mid);margin-top:2px;}
.spec-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;}
.spec-table tr{border-bottom:1px solid var(--border-soft);}
.spec-table td{padding:8px 4px;color:var(--mid);}
.spec-table td:last-child{color:var(--hi);text-align:right;font-weight:600;}
.desc-text{font-size:13px;color:var(--mid);line-height:1.7;margin-top:8px;}
.detail-actions{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
.trust-row{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;}
.trust-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mid);}

/* ---------- BADGES / MISC ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;}
.pill-success{background:rgba(51,214,143,.14);color:var(--success);}
.pill-warning{background:rgba(251,191,36,.14);color:var(--warning);}
.pill-danger{background:rgba(247,107,107,.14);color:var(--danger);}
.pill-blue{background:var(--blue-soft);color:#7db2ff;}
.pill-orange{background:var(--orange-soft);color:var(--orange);}

/* ---------- WIZARD (İlan Ver) ---------- */
.wizard{max-width:760px;margin:20px auto 0;}
.steps-bar{display:flex;gap:4px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px;}
.step-chip{flex:1;min-width:84px;text-align:center;padding:9px 4px;border-radius:9px;background:var(--panel);border:1px solid var(--border);font-size:10.5px;font-weight:600;color:var(--low);position:relative;}
.step-chip.active{border-color:var(--orange);color:var(--orange);background:var(--orange-soft);}
.step-chip.done{color:var(--success);border-color:rgba(51,214,143,.3);}
.wiz-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;}
.wiz-card h2{font-family:'Space Grotesk';font-size:18px;margin-bottom:5px;}
.wiz-card>p.hint{font-size:12.5px;color:var(--mid);margin-bottom:20px;}
.field{margin-bottom:16px;}
.bank-info-card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;}
.bank-info-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--border-soft);}
.bank-info-row:last-of-type{border-bottom:none;}
.bank-info-row span{font-size:11.5px;color:var(--low);min-width:70px;flex-shrink:0;}
.bank-info-row b{font-size:13px;color:var(--hi);flex:1;}
.bank-info-row .btn{margin-left:auto;}
.topup-method-fixed{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;font-weight:600;color:var(--hi);}
.field label{display:block;font-size:12px;font-weight:600;color:var(--mid);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;color:var(--hi);font-size:13.5px;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
.field textarea{min-height:100px;resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.field-row{grid-template-columns:1fr;}}
.switch-row{display:flex;align-items:center;gap:10px;cursor:pointer;}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--elevated);border:1px solid var(--border);border-radius:999px;transition:.18s;}
.switch .slider:before{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;background:var(--low);border-radius:50%;transition:.18s;}
.switch input:checked+.slider{background:var(--orange-soft);border-color:var(--orange);}
.switch input:checked+.slider:before{transform:translateX(17px);background:var(--orange);box-shadow:0 0 8px var(--orange-glow);}
.modal.modal-lg{max-width:540px;}
.cat-pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:560px){.cat-pick-grid{grid-template-columns:repeat(3,1fr);}}
.cat-pick{border:1px solid var(--border);background:var(--elevated);border-radius:11px;padding:14px 8px;text-align:center;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:7px;}
.cat-pick.selected{border-color:var(--orange);background:var(--orange-soft);color:var(--orange);}
.upload-zone{border:1.5px dashed var(--border);border-radius:12px;padding:28px 14px;text-align:center;color:var(--mid);font-size:12.5px;background:var(--elevated);}
.upload-zone b{color:var(--blue);}
.upload-thumbs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.upload-thumb{width:56px;height:56px;border-radius:9px;background:linear-gradient(135deg,var(--blue-soft),var(--orange-soft));display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border);}
.wiz-nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px;}
.preview-box{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--elevated);}

/* ---------- CART / CHECKOUT ---------- */
.cart-item{display:flex;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;align-items:center;}
.cart-media{width:64px;height:64px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-info b{font-size:13px;display:block;}
.cart-item-info span{font-size:11px;color:var(--mid);}
.summary-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;height:fit-content;}
.summary-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mid);padding:6px 0;}
.summary-row.total{border-top:1px solid var(--border-soft);margin-top:8px;padding-top:12px;font-size:15px;font-weight:700;color:var(--hi);}
.summary-row.total .val{color:var(--orange);font-family:'JetBrains Mono';}

/* ---------- ACCOUNT / ADMIN PANELS ---------- */
.panel-layout{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px;min-width:0;}
@media(min-width:860px){.panel-layout{grid-template-columns:230px 1fr;align-items:start;}}
.panel-nav{display:flex;gap:4px;overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.panel-nav::-webkit-scrollbar{display:none;}
@media(min-width:860px){.panel-nav{flex-direction:column;position:sticky;top:78px;height:fit-content;}}
.panel-nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--mid);white-space:nowrap;flex-shrink:0;border-left:2px solid transparent;transition:.15s;}
.panel-nav-item:hover{background:var(--elevated);color:var(--hi);}
.panel-nav-item.active{background:var(--orange-soft);color:var(--orange);border-left-color:var(--orange);}
@media(max-width:859px){.panel-nav-item.active{border-left-color:transparent;box-shadow:inset 0 -2px 0 var(--orange);}}
.panel-content{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;min-height:340px;min-width:0;overflow:hidden;}
@media(max-width:600px){.panel-content{padding:14px;border-radius:12px;}}
.panel-content-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border-soft);}
.panel-content-head h2{font-family:'Space Grotesk';font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.panel-content-head .count-tag{background:var(--elevated);border:1px solid var(--border);color:var(--mid);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;}
.admin-head-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 4px;}
.admin-head-bar .disp.section-title{margin:0;}
.admin-live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--success);background:rgba(51,214,143,.12);border:1px solid rgba(51,214,143,.3);padding:6px 11px;border-radius:999px;flex-shrink:0;}
.admin-live-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);}
.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.profile-head .avatar{width:58px;height:58px;border-radius:14px;font-size:20px;}
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
@media(min-width:600px){.stat-cards{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--elevated);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:0;}
.stat-card b{font-family:'JetBrains Mono';font-size:19px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-card span{font-size:10.5px;color:var(--low);}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table th{text-align:left;color:var(--low);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel-2);}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tbody tr:hover td,.data-table tr:not(:first-child):hover td{background:var(--elevated);}
.data-table-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:12px;-webkit-overflow-scrolling:touch;}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}
.pill-featured{background:linear-gradient(135deg,var(--orange-soft),rgba(255,122,41,.24));color:var(--orange);border:1px solid var(--orange-glow);}
.icon-toggle-star{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--elevated);border:1px solid var(--border);color:var(--low);flex-shrink:0;transition:.15s;}
.icon-toggle-star.on{color:var(--orange);border-color:var(--orange-glow);background:var(--orange-soft);}
.icon-toggle-star:hover{color:var(--orange);border-color:var(--orange);}
.admin-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.list-row:last-child{border-bottom:none;}
.list-row-media{width:46px;height:46px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}

/* ---------- İLANLARIM (Üyelik Paneli — profesyonel ilan yönetim ekranı) ---------- */
.mylist-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin-bottom:16px;}
.mylist-stat{position:relative;overflow:hidden;background:var(--elevated);border:1px solid var(--border);border-radius:12px;padding:13px 14px 12px 16px;}
.mylist-stat::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent,var(--blue));}
.mylist-stat b{font-family:'JetBrains Mono';font-size:21px;display:block;color:var(--hi);line-height:1.15;}
.mylist-stat span{font-size:10px;color:var(--low);font-weight:700;letter-spacing:.4px;}
.mylist-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.mylist-filters{display:flex;gap:8px;flex-wrap:wrap;}
.mylist-chip{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--border);color:var(--mid);transition:.15s;white-space:nowrap;}
.mylist-chip.active{background:var(--orange-soft);border-color:var(--orange-glow);color:var(--orange);}
.mylist-chip:hover{border-color:var(--blue);color:var(--hi);}
.mylist-sort select{background:var(--panel);border:1px solid var(--border);color:var(--hi);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.mylist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.mylist-card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:.18s;}
.mylist-card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 16px 30px -16px rgba(0,0,0,.65);}
.mylist-card.locked{opacity:.88;}
.mylist-card-media{height:126px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--low);cursor:pointer;}
.mylist-card-tags{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:2;}
.mylist-card-stock{position:absolute;top:8px;right:8px;background:rgba(5,8,16,.72);backdrop-filter:blur(6px);border-radius:8px;padding:3px 8px;font-size:9.5px;font-weight:700;color:var(--hi);}
.mylist-card-body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1;}
.mylist-card-cat{font-size:9.5px;color:var(--low);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:4px;}
.mylist-card-title{font-size:13px;font-weight:700;line-height:1.35;min-height:35px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mylist-card-price-row{display:flex;align-items:baseline;gap:8px;}
.mylist-card-price{font-family:'JetBrains Mono';font-weight:700;font-size:15.5px;color:var(--hi);}
.mylist-card-oldprice{font-family:'JetBrains Mono';font-size:11px;color:var(--low);text-decoration:line-through;}
.mylist-card-metrics{display:flex;align-items:center;gap:11px;font-size:10.5px;color:var(--mid);border-top:1px solid var(--border-soft);margin-top:1px;padding-top:8px;}
.mylist-card-metrics span{display:flex;align-items:center;gap:4px;}
.mylist-card-actions{display:flex;gap:6px;padding:0 13px 13px;}
.mylist-card-actions .btn{flex:1;justify-content:center;padding:8px 5px;font-size:11px;white-space:nowrap;}
.msg-thread{display:flex;flex-direction:column;gap:9px;max-height:360px;overflow-y:auto;padding:6px 2px;}
.msg-bubble{max-width:74%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;}
.msg-bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--orange),#ff9354);color:#170a02;border-bottom-right-radius:3px;}
.msg-bubble.them{align-self:flex-start;background:var(--elevated);border:1px solid var(--border);border-bottom-left-radius:3px;}
.msg-time{font-size:9.5px;color:var(--low);margin-top:3px;}
.msg-bubble.me .msg-time{color:rgba(23,10,2,.55);}
.msg-compose{display:flex;gap:8px;margin-top:12px;}
.msg-compose input{flex:1;}

/* ================= MESAJLAR — ULTRA RESPONSIVE SOHBET ARAYÜZÜ ================= */
.msgs-shell{
  display:flex;flex-direction:column;
  margin-top:18px;
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;min-width:0;isolation:isolate;
}
@media(min-width:860px){
  .msgs-shell{
    flex-direction:row;
    height:calc(100vh - 176px);height:calc(100dvh - 176px);
    min-height:480px;max-height:740px;
  }
}
/* --- sol: konuşma listesi --- */
.msgs-list{display:flex;flex-direction:column;min-width:0;background:var(--panel);}
@media(min-width:860px){
  .msgs-list{width:300px;flex-shrink:0;border-right:1px solid var(--border-soft);}
}
.msgs-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 16px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.msgs-list-head b{font-family:'Space Grotesk';font-size:14px;}
.msgs-count{background:var(--elevated);border:1px solid var(--border);color:var(--mid);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;flex-shrink:0;}
.msgs-list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px;min-height:0;}
.msgs-row{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border-radius:12px;text-align:left;border:1px solid transparent;background:transparent;transition:background .15s,border-color .15s;min-width:0;cursor:pointer;}
.msgs-row:hover{background:var(--elevated);}
.msgs-row.active{background:var(--orange-soft);border-color:rgba(255,122,41,.25);}
.msgs-avatar{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue),#6aa8ff);color:#04101f;font-weight:700;font-size:14.5px;font-family:'Space Grotesk';}
.msgs-row-body{min-width:0;flex:1;}
.msgs-row-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.msgs-row-name{font-size:12.8px;font-weight:700;color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msgs-row-time{font-size:9.5px;color:var(--low);flex-shrink:0;}
.msgs-row-preview{display:flex;align-items:center;gap:6px;margin-top:3px;}
.msgs-row-preview span{font-size:11.3px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.msgs-unread-dot{width:8px;height:8px;border-radius:999px;background:var(--orange);flex-shrink:0;box-shadow:0 0 0 3px var(--orange-soft);}
/* --- sağ: sohbet alanı --- */
.msgs-chat{display:flex;flex-direction:column;min-width:0;flex:1;background:var(--panel-2);}
.msgs-chat-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.msgs-back-btn{display:none;width:34px;height:34px;flex-shrink:0;border-radius:10px;align-items:center;justify-content:center;background:var(--elevated);border:1px solid var(--border);color:var(--hi);}
.msgs-chat-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.msgs-chat-id .msgs-avatar{width:36px;height:36px;font-size:13px;border-radius:10px;}
.msgs-chat-name{font-size:13.2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msgs-chat-sub{font-size:10.8px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msgs-online{flex-shrink:0;}
.msgs-thread{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;overscroll-behavior:contain;}
.msgs-thread .msg-bubble{max-width:78%;}
.msgs-empty-thread{margin:auto;text-align:center;color:var(--mid);font-size:12px;padding:20px;}
.msgs-compose{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border-soft);flex-shrink:0;background:var(--panel-2);}
.msgs-compose input{flex:1;min-width:0;background:var(--elevated);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--hi);font-size:13.5px;}
.msgs-compose input:focus{outline:none;border-color:var(--orange);}
.msgs-compose .btn{flex-shrink:0;width:44px;height:44px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.msgs-page-empty{padding:0;}

/* ---- 859px altı: liste <-> tam ekran sohbet geçişi ---- */
@media(max-width:859px){
  .msgs-shell{border-radius:12px;}
  .msgs-list{display:flex;}
  .msgs-chat{display:none;}
  .msgs-back-btn{display:flex;}
  .msgs-shell.chat-open{
    position:fixed;inset:0;z-index:180;
    border-radius:0;border:none;
    display:flex;
  }
  .msgs-shell.chat-open .msgs-list{display:none;}
  .msgs-shell.chat-open .msgs-chat{
    display:flex;width:100%;
    height:100vh;height:100dvh;
  }
  .msgs-shell.chat-open .msgs-chat-head{padding-top:calc(13px + env(safe-area-inset-top));background:var(--panel-2);position:sticky;top:0;z-index:2;}
  .msgs-shell.chat-open .msgs-compose{padding-bottom:calc(12px + env(safe-area-inset-bottom));}
}
@media(min-width:860px){.msgs-back-btn{display:none !important;}}
@media(max-width:380px){
  .msgs-avatar{width:38px;height:38px;font-size:13px;}
  .msgs-row-name{font-size:12.2px;}
  .msgs-thread .msg-bubble{max-width:86%;font-size:12.2px;}
}

/* ================= GLOBAL SOHBET — FAB + YAN PANEL ================= */
/* Tüm kayıtlı kullanıcıların birlikte yazdığı tek ortak oda. Sayfanın
   normal akışına dokunmadan sağ altta yüzen bir buton olarak durur;
   uygulamanın hiçbir mevcut görünümünü/düzenini etkilemez. */
.gchat-fab{
  position:fixed;right:18px;
  bottom:calc(84px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--orange));
  color:#04101f;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px -6px rgba(59,140,255,.5),0 6px 18px -4px var(--orange-glow);
  z-index:190;transition:transform .15s ease;
}
.gchat-fab:hover{transform:scale(1.06);}
.gchat-fab:active{transform:scale(.96);}
.gchat-fab-badge{
  position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 4px;
  background:var(--orange);border:2px solid var(--void);border-radius:999px;
  font-size:10px;font-weight:800;color:#0a0e18;display:flex;align-items:center;justify-content:center;
  animation:badgePulse 1.8s ease-in-out infinite;
}
@media(min-width:860px){.gchat-fab{bottom:22px;}}
.gchat-panel{
  position:fixed;right:18px;
  bottom:calc(146px + env(safe-area-inset-bottom));
  width:368px;max-width:calc(100vw - 36px);height:min(560px,70vh);
  background:var(--panel);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  display:flex;flex-direction:column;overflow:hidden;z-index:190;
  opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;
}
.gchat-panel.is-open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
@media(min-width:860px){.gchat-panel{bottom:84px;}}
.gchat-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--border-soft);flex-shrink:0;background:var(--panel-2);}
.gchat-head-ico{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gchat-head-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;}
.gchat-head-txt b{font-family:'Space Grotesk';font-size:13.5px;}
.gchat-head-txt span{font-size:10.5px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gchat-close{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--elevated);border:1px solid var(--border);color:var(--mid);}
.gchat-close:hover{color:var(--hi);border-color:var(--blue);}
.gchat-thread{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;}
.gchat-empty{margin:auto;text-align:center;color:var(--mid);font-size:12px;padding:20px;}
.gchat-msg{display:flex;gap:8px;align-items:flex-end;max-width:100%;}
.gchat-msg.me{flex-direction:row-reverse;}
.gchat-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue),#6aa8ff);color:#04101f;font-weight:700;font-size:10px;font-family:'Space Grotesk';}
.gchat-bubble{max-width:100%;}
.gchat-name{font-size:10.5px;font-weight:700;color:var(--blue);margin-bottom:2px;}
.gchat-msg.me .gchat-bubble{margin-left:34px;}
.gchat-compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border-soft);flex-shrink:0;background:var(--panel-2);}
.gchat-compose input{flex:1;min-width:0;background:var(--elevated);border:1px solid var(--border);border-radius:12px;padding:10px 13px;color:var(--hi);font-size:13px;}
.gchat-compose input:focus{outline:none;border-color:var(--blue);}
.gchat-compose .btn{flex-shrink:0;width:40px;height:40px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.gchat-login-cta{padding:24px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin:auto;}
.gchat-login-cta p{font-size:12.5px;color:var(--mid);}
.gchat-login-cta .btn{padding:9px 22px;}
/* Panel açılırken (özellikle ilk karede) içerik yetişene kadar gösterilen
   kısa "Yükleniyor" katmanı — buton geç açılıyormuş hissi vermesin diye. */
.fab-loading{
  position:absolute;inset:0;z-index:5;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--panel);
}
.fab-loading .fab-spinner{
  width:26px;height:26px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--orange);
  animation:fabSpin .7s linear infinite;
}
.fab-loading span{font-size:11.5px;color:var(--mid);}
@keyframes fabSpin{to{transform:rotate(360deg);}}
@media(max-width:859px){
  .gchat-panel{
    position:fixed;inset:0;width:100%;height:100%;height:100dvh;max-width:none;
    border-radius:0;border:none;bottom:0;right:0;
    transform:translateY(100%);opacity:1;z-index:210;
  }
  .gchat-panel.is-open{transform:translateY(0);}
  .gchat-fab.is-open{display:none;}

/* ---------- AUTH MODAL (Giriş / Kayıt) ---------- */
.auth-overlay{align-items:center;padding:24px 14px;}
.auth-modal{
  position:relative;max-width:400px;padding:0;overflow:hidden;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--border-soft);
  border-radius:22px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.02) inset;
  animation:authIn .28s cubic-bezier(.16,1,.3,1);
}
@keyframes authIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.auth-modal::before{
  content:'';position:absolute;top:-70px;left:50%;transform:translateX(-50%);
  width:280px;height:170px;pointer-events:none;
  background:radial-gradient(closest-side, var(--orange-glow), transparent);
  opacity:.3;filter:blur(14px);
}
.auth-modal-body{position:relative;padding:28px 24px 24px;}
.auth-modal-close{position:absolute;top:14px;right:14px;z-index:1;}
.auth-header{text-align:center;margin-bottom:22px;}
.auth-header .auth-mark{
  width:48px;height:48px;border-radius:14px;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--orange),var(--blue));

}

.auth-tab.active{background:var(--elevated);color:var(--hi);box-shadow:0 2px 10px -2px rgba(0,0,0,.4);}
.auth-tab:hover:not(.active){color:var(--mid);}
.auth-field{position:relative;margin-bottom:14px;}

  width:100%;background:var(--void);border:1px solid var(--border);border-radius:11px;

.auth-submit{width:100%;justify-content:center;padding:13px;font-size:13.5px;border-radius:12px;margin-top:2px;}
