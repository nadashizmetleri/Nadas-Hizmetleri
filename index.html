/* Stok sayısı değiştikçe Gmail+Şifre giriş alanlarını canlı olarak
   ekler/kaldırır; o ana kadar girilmiş değerler korunur. */
function wizStockCountChanged(val){
  const d = state.wizard.data;
  d.stock = Math.max(1, Math.min(MAX_RANDOM_STOCK, Number(val)||1));
  // Mevcut inputlardaki değerleri oku (kaybolmasınlar), sonra yeni sayıya göre yeniden çiz
  const current = [];
  for(let i=0;i<MAX_RANDOM_STOCK;i++){
    const g = document.getElementById('wiz_stockacc_gmail_'+i);
    const p = document.getElementById('wiz_stockacc_pass_'+i);
    if(!g && !p) break;
    current.push({gmail: g?g.value:'', password: p?p.value:''});
  }
  d.stockAccounts = current;
  const wrap = document.getElementById('wizStockAccWrap');
  if(wrap) wrap.innerHTML = renderStockAccountFields(d.stockAccounts, d.stock, 'wiz');
}
function wizSetCat(id){ state.wizard.data.cat=id; delete state.wizard.data.type; delete state.wizard.data.fields; delete state.wizard.data.randomAccount; delete state.wizard.data.stockAccounts; render(); }
function wizSetType(id){ state.wizard.data.type=id; state.wizard.data.fields=state.wizard.data.fields||{}; if(id!=='hesap'){ delete state.wizard.data.randomAccount; delete state.wizard.data.stockAccounts; } render(); }
function wizSetAccountKind(isRandom){ state.wizard.data.randomAccount = isRandom; if(!isRandom) delete state.wizard.data.stockAccounts; render(); }
function wizSetFeatured(id){ state.wizard.data.featuredPkg=id; render(); }
async function wizHandleImageFiles(fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return;
  const d = state.wizard.data;
  d.images = d.images || [];
  if(d.images.length>=6){ toast('En fazla 6 görsel ekleyebilirsin','error'); return; }
  const toUpload = files.slice(0, 6-d.images.length);
  d.imagesUploading = (d.imagesUploading||0) + toUpload.length;
  render();
  for(const file of toUpload){
    try{
      const url = await uploadToImgbb(file);
      d.images.push(url);
    }catch(err){ toast('Görsel yüklenemedi: '+err.message,'error'); }
    finally{ d.imagesUploading = Math.max(0,(d.imagesUploading||1)-1); render(); }
  }
}
function wizRemoveImage(i){ state.wizard.data.images.splice(i,1); render(); }
function collectWizStep(){
  const d = state.wizard.data;
  const g = id => document.getElementById(id);
  if(state.wizard.step===2){
    if(g('f_title')) d.title=g('f_title').value;
    if(g('f_stock')) d.stock=Number(g('f_stock').value)||1;
    if(CATEGORY_TYPE_FIELDS[d.cat] && d.type){
      d.fields = d.fields || {};
      getCatTypeFields(d.cat, d.type).forEach(f=>{
        if(f.kind==='multiselect'){
          const container = g('f_field_'+f.id);
          if(container){
            const vals = Array.from(container.querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.value);
            d.fields[f.id] = vals.join(', ');
          }
        } else {
          const el = g('f_field_'+f.id);
          if(el) d.fields[f.id] = el.value;
        }
      });
    } else if(g('f_spec1')) d.spec1=g('f_spec1').value;
    if(isRandomAccountListing({type:d.type, randomAccount:d.randomAccount})){
      d.stockAccounts = collectStockAccountFields(d.stock||1, 'wiz');
    }
  }
  if(state.wizard.step===3){ if(g('f_desc')) d.desc=g('f_desc').value; }
  if(state.wizard.step===4){ if(g('f_price')) d.price=Number(g('f_price').value)||0; if(g('f_oldprice')) d.oldPrice=Number(g('f_oldprice').value)||0; }
  if(state.wizard.step===6){ if(g('f_delivery')) d.delivery=g('f_delivery').value; if(g('f_deliverytime')) d.deliveryTime=g('f_deliverytime').value; }
}
function wizNext(){
  collectWizStep();
  const d = state.wizard.data;
  if(state.wizard.step===1 && !d.cat){ toast('Lütfen bir kategori seç','error'); return; }
  if(state.wizard.step===2 && CATEGORY_TYPE_FIELDS[d.cat] && !d.type){ toast('Lütfen ilan türünü seç','error'); return; }
  if(state.wizard.step===2 && !d.title){ toast('Lütfen ilan başlığı gir','error'); return; }
  if(state.wizard.step===2 && isRandomAccountListing({type:d.type, randomAccount:d.randomAccount})){
    const err = validateStockAccounts(d.stock, d.stockAccounts);
    if(err){ toast(err,'error'); return; }
  }
  if(state.wizard.step===4 && !d.price){ toast('Lütfen fiyat gir','error'); return; }
  state.wizard.step = Math.min(7, state.wizard.step+1);
  render();
}
function wizPrev(){ collectWizStep(); state.wizard.step=Math.max(1,state.wizard.step-1); render(); }
async function publishListing(){
  collectWizStep();
  const d = state.wizard.data;
  const pkg = featuredPkg(d.featuredPkg);
  const isRandomAcc = d.type==='hesap' && !!d.randomAccount;
  const randomFee = isRandomAcc ? (isPassActive() ? 0 : RANDOM_ACCOUNT_FEE) : 0;
  const totalFee = randomFee + pkg.price;
  if(isRandomAcc){
    const stockErr = validateStockAccounts(d.stock, d.stockAccounts);
    if(stockErr){ toast(stockErr,'error'); state.wizard.step=2; render(); return; }
  }
  if(state.balance < totalFee){
    toast(`Toplam ücret (${fmt(totalFee)}) için yetersiz bakiye. Bakiye yükle ya da Hesap Pass ile Random Hesap oluşturma ücretinden muaf ol.`,'error');
    openTopupModal();
    return;
  }
  if(d.imagesUploading){ toast('Görseller yükleniyor, lütfen bekle...','error'); return; }
  const btn = document.getElementById('publishListingBtn');
  if(btn){ btn.disabled=true; btn.textContent='Yayınlanıyor...'; }
  const badges = pkg.price>0 ? ['new','hot'] : ['new'];
  const base = { cat:d.cat||'other', title:d.title||'Yeni İlan', price:d.price||0, oldPrice:d.oldPrice||undefined,
    seller:{name:displayName(), sellerUid: state.uid||undefined, photoURL: state.photoURL||'', rating:5.0, sales:0, verified:!!state.verified, priority:isPassActive()}, badges,
    type:d.type||undefined, specs:buildListingSpecs(d), images:(d.images&&d.images.length)?d.images:3,
    stock:d.stock||1,
    active:true,
    randomAccount: isRandomAcc || undefined,
    featuredUntil: pkg.price>0 ? (Date.now()+pkg.days*24*60*60*1000) : undefined };
  if(d.desc) base.desc = d.desc;
  if(d.delivery) base.delivery = d.delivery;
  if(d.deliveryTime) base.deliveryTime = d.deliveryTime;
  let id;
  try{
    if(FIREBASE_ENABLED){
      const fsData = stripUndefinedDeep(Object.assign({}, base, {specs: specsToFirestore(base.specs)}));
      const ref = await fbDb.collection('listings').add(fsData);
      id = ref.id;
    }else{
      id = 'L'+(2000+LISTINGS.length);
    }
  }catch(err){ toast('İlan yayınlanamadı: '+authErrorMessage(err),'error'); if(btn){ btn.disabled=false; btn.textContent='Yayınla'; } return; }
  const newListing = makeListing(Object.assign({id}, base));
  LISTINGS.unshift(newListing);
  state.myListings.unshift(id);
  if(isRandomAcc && d.stockAccounts && d.stockAccounts.length){
    try{ await saveRandomAccountStock(id, d.stockAccounts, newListing); }
    catch(err){ console.error('Stok hesapları kaydedilemedi:', err); toast('İlan yayınlandı ancak stok hesapları kaydedilirken bir sorun oluştu. Lütfen ilanı düzenleyip stokları kontrol et.','error'); }
  }
  if(randomFee>0){
    state.balance -= randomFee;
    state.balanceHistory.unshift({id:Date.now(), type:'Random Hesap Oluşturma Ücreti', amount:-randomFee, date:'Bugün', status:'Tamamlandı'});
  }
  if(pkg.price>0){
    state.balance -= pkg.price;
    state.balanceHistory.unshift({id:Date.now()+1, type:`Öne Çıkan İlan Paketi (${pkg.label})`, amount:-pkg.price, date:'Bugün', status:'Tamamlandı'});
  }
  // Random Hesap ücreti + Öne Çıkan İlan Paketi ücreti, canlı modda kalıcı
  // olarak Firestore'daki bakiyeden de düşülür (önceden yalnızca yerel
  // state.balance güncelleniyordu, bu da Firebase'de gerçek bakiyenin hiç
  // düşmemesine yol açıyordu).
  if(FIREBASE_ENABLED && fbDb && state.uid && totalFee>0){
    try{
      await fbDb.collection('users').doc(state.uid).update({
        balance: firebase.firestore.FieldValue.increment(-totalFee)
      });
    }catch(err){ console.error('İlan ücreti Firestore’a kaydedilemedi:', err); }
  }
  state.wizard = {step:1,data:{}};
  toast(pkg.price>0?'İlanın öne çıkan olarak yayınlandı!':(isRandomAcc?(isPassActive()?'Random Hesap ilanın Hesap Pass ile ücretsiz yayınlandı!':'Random Hesap ilanın başarıyla yayınlandı!'):'İlanın tamamen ücretsiz olarak yayınlandı!'),'success');
  go('listing',{id});
}

                  <span>${esc(sellerDisplayName(c.l.seller))} ${c.l.seller.verified?'· ✓ Güvenilir':''} ${c.l.seller.priority?`· ${ic('crown',10)} Öncelikli`:''}</span>

}
function changeQty(id, delta){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  const l = findListing(id);
  const maxQty = l ? Math.max(1, l.stock||0) : 999;
  if(delta>0 && item.qty+1 > maxQty){ toast(`Stokta en fazla ${maxQty} adet var.`,'error'); return; }
  item.qty = Math.max(1, Math.min(maxQty, item.qty+delta));
  render();
}
function removeFromCart(id){ state.cart = state.cart.filter(c=>c.id!==id); toast('Ürün sepetten kaldırıldı'); render(); }

let lastOrderId = null;
function viewCheckout(){

        <div class="summary-row"><span>Hizmet Bedeli</span><span>${fmt(fee)}</span></div>
        <div class="summary-row total"><span>Toplam</span><span class="val">${fmt(total)}</span></div>

let _orderProcessing = false;
async function completeOrder(total){
  // Çift tıklama / aynı siparişin iki kez işlenmesini engelle
  if(_orderProcessing) return;
  const items = state.cart.map(c=>({...c, l:findListing(c.id)})).filter(c=>c.l);
  if(!items.length) return;
  // Stok kontrolü: sepete eklendiğinden beri stok değişmiş olabilir (ör. aynı
  // ürün başka bir işlemde tükenmiş olabilir). Yetersiz stoklu ürün varsa
  // ödeme hiç başlatılmaz.
  const insufficientStock = items.find(c => (c.l.stock||0) < c.qty);
  if(insufficientStock){
    toast(`"${insufficientStock.l.title}" için yeterli stok kalmadı.`,'error');
    state.cart = state.cart.filter(c=>c.id!==insufficientStock.l.id);
    render();
    return;
  }
  // Bakiye kontrolü: buton zaten yetersiz bakiyede devre dışı bırakılır, ama
  // bu fonksiyon başka bir yoldan çağrılırsa diye burada da kesinlikle kontrol edilir.
  if(state.balance < total){
    toast('Yetersiz bakiye. İşlem gerçekleştirilemedi.','error');
    return;
  }
  _orderProcessing = true;
  try{
    // Bakiye düş
    state.balance -= total;
    lastOrderId = 'SIP-'+(2300+Math.floor(Math.random()*699));
    state.orders.unshift({id:lastOrderId, item: items.map(c=>c.l.title).join(', ').slice(0,60), price: total, date:'Bugün', status:'Ödeme Alındı / Hazırlanıyor'});
    state.balanceHistory.unshift({id:Date.now(), type:'Satın Alma', amount:-total, date:'Bugün', status:'Tamamlandı'});
    pushNotification(state.uid, {
      type:'purchase', title:'Sipariş Oluşturuldu',
      text:`Siparişin oluşturuldu: ${lastOrderId}`,
      link:{view:'account', params:{tab:'siparisler'}},
    });

    // Stok düş: her ürünün stoğu satın alınan adet kadar azaltılır. Stok 0'a
    // inen ilan SİLİNMEZ / "İlanlarım"dan kaldırılmaz — sadece pasif/kilitli
    // (active:false) olarak işaretlenir. Böylece ilan sahibi "İlanlarım"
    // bölümünde ilanını kilitli olarak görmeye devam eder ve dilediğinde
    // yeniden yayınlayabilir; diğer kullanıcılar ise isListingPublic() /
    // publicListings() filtrelemesi sayesinde bu ilanı hiçbir yerde göremez.
    const soldOutIds = [];
    items.forEach(c=>{
      c.l.stock = Math.max(0, (c.l.stock||0) - c.qty);
      if(c.l.stock <= 0){ c.l.active = false; soldOutIds.push(c.l.id); }
    });
    if(soldOutIds.length){
      // Sadece ALICININ kendi favori listesinden gizle (satın aldığı/artık
      // herkese kapalı olan ürün) — satıcının kendi ilanı ve myListings
      // kaydı olduğu gibi korunur.
      soldOutIds.forEach(fid=>state.favorites.delete(fid));
    }

    state.cart = [];

    // Firebase (canlı mod): bakiyeyi kalıcı olarak veritabanına yaz.
    // Stok düşümü ise recordSalesForOrder() içinde, satın alma kanıtı
    // (purchases/{uid}_{listingId}) yazıldıktan SONRA yapılır — çünkü
    // güvenlik kuralları stok güncellemesine yalnızca bu kanıt varsa izin verir.
    // Yerel demo modunda tüm bu değişiklikler render() içinden localStorage'a
    // otomatik kaydedilir.
    if(FIREBASE_ENABLED && fbDb && state.uid){
      try{
        await fbDb.collection('users').doc(state.uid).update({
          balance: firebase.firestore.FieldValue.increment(-total)
        });
      }catch(err){ console.error('Bakiye Firestore’a kaydedilemedi:', err); }
      try{
        // Sipariş geçmişi kalıcı olarak Firestore'a yazılır ki başka bir
        // cihazdan / oturumdan giriş yapıldığında da görünsün. Doküman ID'si
        // BİLEREK lastOrderId ("SIP-XXXX") ile aynı seçiliyor (add() yerine
        // doc(id).set() kullanılıyor) — böylece bu sipariş daha sonra
        // recordSalesForOrder() içinden durum/teslimat güncellemesi
        // yapılırken doğru dokümana yazılabiliyor. add() kullanılsaydı
        // Firestore kendi rastgele ID'sini üretirdi ve o zaman uygulamanın
        // gösterdiği sipariş numarasıyla eşleşmezdi.
        await fbDb.collection('orders').doc(lastOrderId).set({
          id: lastOrderId, buyerUid: state.uid,
          item: items.map(c=>c.l.title).join(', ').slice(0,60), price: total,
          date: 'Bugün', status: 'Ödeme Alındı / Hazırlanıyor',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }catch(err){ console.error('Sipariş Firestore’a kaydedilemedi:', err); }
    }

    toast('Ödeme başarılı! Siparişin oluşturuldu.','success');
    go('checkout',{done:true});
    // İptal edilmemiş / başarısız olmayan, GERÇEKTEN tamamlanmış her satın alma için
    // otomatik mağaza/satış istatistiği güncellemesi. Sipariş iptal olursa veya
    // tamamlanmazsa bu kod hiç çalışmaz, dolayısıyla satış sayısı artırılmaz.
    recordSalesForOrder(items, lastOrderId).catch(err=>console.error('Satış istatistiği kaydedilemedi:', err));
  } finally {
    _orderProcessing = false;
  }
}
/* Her başarılı satın alma TEK bir satış olarak işlenir (aynı sipariş tekrar
   sayılmaz — bu fonksiyon completeOrder içinden yalnızca bir kez çağrılır).
   Satış sayısı doğrudan bu gerçek satın alma kayıtlarından hesaplanır; kullanıcı
   bu sayıyı elle değiştiremez. */
async function recordSalesForOrder(items, orderId){
  for(const c of items){
    const l = c.l;
    const sellerUid = l.seller && l.seller.sellerUid;
    // Bellekteki ilanı hemen güncelle ki arayüzde satış sayısı anında yansısın
    if(l.seller) l.seller.sales = (l.seller.sales||0) + c.qty;
    // ÖNEMLİ: Satın alma kanıtı (purchases/{uid}_{listingId}) her zaman EN
    // BAŞTA yazılır. Firestore güvenlik kuralları — accountStock güncelleme,
    // deliveries oluşturma ve stok düşürme dahil — hasPurchased(listingId)
    // şartını arıyor; bu kanıt yoksa random hesap teslimatı "izin yok"
    // hatasıyla başarısız olur. Bu yüzden claimRandomAccountStock'tan ÖNCE
    // çalışmalı, sonra değil.
    if(FIREBASE_ENABLED && fbDb && state.uid){
      try{
        const purchaseId = state.uid + '_' + l.id;
        await fbDb.collection('purchases').doc(purchaseId).set({
          buyerUid: state.uid, listingId: l.id, sellerUid: sellerUid||null, orderId,
          qty: c.qty,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, {merge:true});
      }catch(err){ console.error('Satın alma kanıtı yazılamadı:', err); }
    }
    // KARŞILIKLI ONAY/RET SİSTEMİ: ödenen tutar satıcıya hemen aktarılmaz —
    // "deals" dokümanında beklemede (escrow) tutulur; para yalnızca hem alıcı
    // hem satıcı onayladığında satıcıya geçer (bkz. approveDeal/claimDealPayout).
    if(sellerUid){
      await createDealForItem(orderId, l, c, sellerUid).catch(err=>console.error('Onay/Ret kaydı oluşturulamadı:', err));
    }
    // Random Hesap otomatik teslimatı hem canlı (Firestore) hem yerel demo
    // modunda çalışır — claimRandomAccountStock() her iki modu da destekler.
    if(isRandomAccountListing(l)){
      const delivered = [];
      // Teslimat sırasında (izin hatası, ağ hatası, stok tükenmesi vb.) bir
      // istisna oluşursa artık tüm fonksiyonu sessizce çökertip kullanıcıyı
      // hiçbir bilgi vermeden karanlıkta bırakmıyoruz — hatayı burada
      // yakalayıp aşağıda kullanıcıya açıkça bildiriyoruz.
      try{
        for(let i=0;i<c.qty;i++){
          const acc = await claimRandomAccountStock(l, orderId);
          if(acc) delivered.push(acc);
        }
      }catch(err){
        console.error(`"${l.title}" için random hesap teslimatı sırasında hata:`, err);
      }
      const order = state.orders.find(o=>o.id===orderId);
      if(delivered.length){
        if(order){ order.deliveries = (order.deliveries||[]).concat(delivered.map(a=>Object.assign({listingTitle:l.title}, a))); }
        if(sellerUid) sendAutoDeliveryMessage(sellerUid, l.seller.name, orderId, l.id, l.title).catch(()=>{});
        else sendAutoDeliveryMessage(null, l.seller.name, orderId, l.id, l.title).catch(()=>{});
      }
      let newOrderStatus = null;
      if(delivered.length < c.qty){
        console.error(`"${l.title}" için stoktaki hesap sayısı yetersiz kaldı (istenen: ${c.qty}, teslim edilen: ${delivered.length}).`);
        // Kısmi/başarısız teslimatı sipariş durumuna yansıt ve kullanıcıyı
        // hem toast hem bildirim ile açıkça uyar — artık sessiz kalmıyor.
        newOrderStatus = 'Teslimat Bekleniyor / Destek Gerekli';
        if(order){ order.status = newOrderStatus; }
        toast(`"${l.title}" için hesap teslimatında bir sorun oluştu. Sipariş numaranı not al (${orderId}) ve destek ile iletişime geç.`,'error');
        pushNotification(state.uid, {
          type:'purchase', title:'Teslimat Sorunu',
          text:`"${l.title}" siparişinde (${orderId}) teslimat sorunu oluştu — destek ile iletişime geç.`,
          link:{view:'support', params:{}},
        });
      } else if(order){
        newOrderStatus = 'Teslim Edildi';
        order.status = newOrderStatus;
      }
      // Durumu ve teslimat bilgisini Firestore'daki sipariş dokümanına da
      // yaz — böylece sayfa yenilense/başka cihazdan girilse bile kaybolmaz.
      // Kurallar buyerUid == auth.uid ise yalnızca 'status' ve 'deliveries'
      // alanlarının değiştirilmesine izin veriyor.
      if(FIREBASE_ENABLED && fbDb && state.uid && order){
        const patch = {};
        if(newOrderStatus) patch.status = newOrderStatus;
        if(order.deliveries) patch.deliveries = order.deliveries;
        if(Object.keys(patch).length){
          fbDb.collection('orders').doc(orderId).update(patch).catch(err=>console.error('Sipariş durumu Firestore’a kaydedilemedi:', err));
        }
      }
      // Başarılı da olsa başarısız da olsa ekranı MUTLAKA güncelle — bu
      // olmadan alıcı ödeme yapıp hiçbir şey görmeden ekranda kalıyordu.
      render();
    } else {
      // RANDOM HESAP DIŞINDAKİ normal bir ilan/hesap satın alındığında, sistem
      // otomatik olarak site içi mesajlaşma bölümünden alıcıya satıcı adına
      // otomatik bir bilgilendirme mesajı gönderir (bkz. sendAutoPurchaseInfoMessage).
      // Random Hesap ilanları KESİNLİKLE bu akışa dahil değildir — onlar için
      // yalnızca yukarıdaki isRandomAccountListing dalındaki sendAutoDeliveryMessage
      // çalışır. Hem canlı (Firestore) hem yerel demo modunda çalışsın diye bu
      // çağrı, aşağıdaki "sadece Firestore" kısayolundan (continue) ÖNCE yapılır.
      sendAutoPurchaseInfoMessage(sellerUid, l.seller && l.seller.name, orderId, l, c.qty)
        .catch(err=>console.error('Otomatik satın alma bilgilendirme mesajı gönderilemedi:', err));
    }
    if(!FIREBASE_ENABLED || !fbDb) continue;
    try{
      // (Satın alma kanıtı artık döngünün en başında yazılıyor — yukarı bakınız.)
      // İlanın satış sayacını artır — satın alma kanıtı sayesinde kurallara uygun
      if(String(l.id).length && !String(l.id).startsWith('L')){
        await fbDb.collection('listings').doc(l.id).update({
          'seller.sales': firebase.firestore.FieldValue.increment(c.qty)
        });
        // 2b) Stok düşümü — Random Hesap ilanlarında stok, aşağıdaki (2c) otomatik
        //     teslimat sürecinde claimRandomAccountStock() içindeki transaction
        //     tarafından ZATEN atomik olarak düşürülüyor; burada tekrar düşürülürse
        //     stok çift düşer. Bu yüzden yalnızca random-hesap OLMAYAN ilanlarda
        //     ayrı bir update çağrısı olarak yapılır (kurallar "seller" ve
        //     "stock/active" alanlarının aynı yazımda karışmasına izin vermiyor).
        if(!isRandomAccountListing(l)){
          try{
            await fbDb.collection('listings').doc(l.id).update({
              stock: firebase.firestore.FieldValue.increment(-c.qty),
              active: l.stock > 0
            });
          }catch(err){ console.error('Stok Firestore’a kaydedilemedi:', err); }
        }
      }
      // 3) Kalıcı, geriye dönük değiştirilemeyen satış kaydı — istatistiklerin asıl kaynağı
      if(sellerUid){
        await fbDb.collection('sales').add({
          orderId, listingId: l.id, listingTitle: l.title, sellerUid,
          sellerName: l.seller.name||'', buyerUid: state.uid||null, buyerName: displayName(),
          qty: c.qty, price: l.price*c.qty,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        await fbDb.collection('users').doc(sellerUid).update({
          totalSales: firebase.firestore.FieldValue.increment(c.qty)
        }).catch(()=>{}); // kullanıcı dokümanında alan yoksa sorun değil, sales koleksiyonu asıl kaynaktır
        // Satıcıya otomatik bildirim: ilanı satıldı. Stok tükendiyse (ilan
        // pasife alındıysa) ayrıca ayrı bir bilgilendirme daha gönderilir.
        pushNotification(sellerUid, {
          type:'listing', title:'İlanın Satıldı',
          text:`"${l.title}" ilanından ${c.qty} adet satıldı (${fmt(l.price*c.qty)}).`,
          link:{view:'account', params:{tab:'sattiklarim'}},
          listingId: l.id,
        });
        if(l.stock<=0){
          pushNotification(sellerUid, {
            type:'listing', title:'İlan Stok Tükendi',
            text:`"${l.title}" ilanı stok tükendiği için pasife alındı. Dilediğinde yeniden yayınlayabilirsin.`,
            link:{view:'account', params:{tab:'ilanlarim'}},
            listingId: l.id,
          });
        }
      }
    }catch(err){ console.error('Satış kaydı yazılamadı:', err); }
  }
}
/* =================================================================
   İLAN SATIN ALMA — KARŞILIKLI ONAY/RET (ESCROW) SİSTEMİ
   =================================================================
   Her satın alınan ilan kalemi için bir "deals/{orderId}__{listingId}"
   dokümanı oluşturulur. Ödenen tutar bu doküman üzerinden BEKLEMEDE
   (escrow) tutulur:
     - İKİ TARAF da onaylarsa  -> status:'completed', tutar SATICIYA geçer,
       satıcının "Başarılı İlan Sayısı" (successfulDealCount) +1 olur.
     - İKİ TARAF da reddederse -> status:'refunded', tutar ALICIYA iade edilir.
     - TEK taraf reddederse    -> 3 günlük geri sayım (rejectDeadline) başlar;
       süre dolana kadar karşı taraf onaylar/reddederse normal akış işler,
       süre dolarsa (checkDealDeadline) otomatik olarak reddedilmiş sayılır
       ve tutar alıcıya iade edilir.
   GÜVENLİK NOTU: para hareketleri (ödeme/iade) HİÇBİR ZAMAN başka bir
   kullanıcının bakiyesine doğrudan yazılarak yapılmaz — her kullanıcı SADECE
   KENDİ bakiyesini, ilgili deal dokümanı buna izin veren bir duruma
   geçtiğinde (ve daha önce "claim" edilmemişse) artırabilir. Böylece
   users/{userId} güvenlik kuralında ekstra bir izin GEREKMEZ (bkz. dosya
   başındaki Firestore Security Rules — "match /deals/{dealId}" bölümü).
   Çift ödeme/iadeyi engelleyen alanlar: payoutClaimed / refundClaimed.
   GERÇEK ZAMANLI 3 GÜN OTOMATİK RET NOTU: bu, sunucusuz (Cloud Function'sız)
   bir istemci-taraflı uygulamadır; süre dolduğunda otomatik ret, ilgili
   deal'e taraf olan (alıcı ya da satıcı) herhangi bir kullanıcının istemcisi
   uygulamayı açtığında işlenir (bkz. processDealsWatchdog + 30sn'lik
   periyodik kontrol). Kesin/garantili zamanlamalı otomasyon için ileride bir
   Cloud Function (deals/{dealId} üzerinde zamanlanmış tetikleyici) eklenmesi
   önerilir; mevcut istemci-taraflı kontrol, uygulama pratikte kullanıldığı
   sürece aynı sonucu (3 gün sonunda otomatik ret + iade) üretir. */
const DEAL_AUTO_REJECT_MS = 3*24*60*60*1000; // 3 gün

function dealDocId(orderId, listingId){ return orderId+'__'+listingId; }
function findDeal(id){ return (state.deals||[]).find(d=>d.id===id); }
/* Bir sohbetteki iki katılımcıya (buyerUid/sellerUid fark etmeksizin) ait
   tüm işlemleri döndürür — Mesajlar > Satıcı sohbeti panelinde kullanılır. */
function dealsBetween(uidA, uidB){
  return (state.deals||[]).filter(d=>
    (d.buyerUid===uidA && d.sellerUid===uidB) || (d.buyerUid===uidB && d.sellerUid===uidA)
  ).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
function dealsForListing(listingId){
  return (state.deals||[]).filter(d=>d.listingId===listingId).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
function dealsForOrder(orderId){
  return (state.deals||[]).filter(d=>d.orderId===orderId);
}

/* Satın alma anında (recordSalesForOrder içinden) her ilan kalemi için bir
   escrow kaydı oluşturur. sellerUid yoksa (ör. eski/elle eklenmiş veri)
   hiçbir şey yapılmaz — mevcut davranış etkilenmez. */
async function createDealForItem(orderId, l, c, sellerUid){
  const id = dealDocId(orderId, l.id);
  const amount = l.price * c.qty;
  const base = {
    id, orderId, listingId: l.id, listingTitle: l.title,
    buyerUid: state.uid, sellerUid,
    buyerName: displayName(), sellerName: (l.seller&&l.seller.name)||'Satıcı',
    amount,
    buyerApproval:'pending', sellerApproval:'pending', status:'pending',
    rejectDeadline: null, firstRejectBy: null, autoRejected:false,
    payoutClaimed:false, refundClaimed:false,
  };
  if(FIREBASE_ENABLED && fbDb && state.uid){
    try{
      await fbDb.collection('deals').doc(id).set(Object.assign({}, base, {
        participants:[state.uid, sellerUid],
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }));
    }catch(err){ console.error('Onay/Ret kaydı Firestore’a yazılamadı:', err); }
  }else if(!FIREBASE_ENABLED){
    if(!state.deals.find(d=>d.id===id)){
      state.deals.unshift(Object.assign({}, base, { createdAt: Date.now(), updatedAt: Date.now() }));
      saveLocalAppState();
    }
  }
}

let _dealsUnsub = null;
function detachDealsListener(){ if(_dealsUnsub){ _dealsUnsub(); _dealsUnsub=null; } }
/* Kullanıcının taraf olduğu (alıcı ya da satıcı) tüm işlemleri gerçek
   zamanlı dinler; İlanlarım, Satın Aldıklarım, Sattıklarım ve Mesajlar
   bölümleri hep AYNI state.deals kaynağından okuduğu için otomatik olarak
   senkron kalır. */
function attachDealsListener(){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return;
  detachDealsListener();
  _dealsUnsub = fbDb.collection('deals').where('participants','array-contains', state.uid)
    .onSnapshot(function(snap){
      state.deals = snap.docs.map(function(d){
        const v = d.data();
        return Object.assign({}, v, { id:d.id,
          rejectDeadline: (v.rejectDeadline && v.rejectDeadline.toMillis) ? v.rejectDeadline.toMillis() : (v.rejectDeadline||null),
          createdAt: (v.createdAt && v.createdAt.toMillis) ? v.createdAt.toMillis() : (v.createdAt||0),
        });
      });
      processDealsWatchdog();
      render();
    }, function(err){ console.error('Onay/Ret kayıtları dinlenemedi:', err); });
}
/* Her yeni veri geldiğinde (ve periyodik olarak) çalışır: (1) süresi dolmuş
   tek taraflı retleri otomatik sonuçlandırır, (2) bana ait, sonuçlanmış ama
   henüz "claim" edilmemiş ödeme/iadeleri kendi bakiyeme geçirir. */
function processDealsWatchdog(){
  (state.deals||[]).forEach(function(d){
    checkDealDeadline(d);
    if(d.status==='completed' && d.sellerUid===state.uid && !d.payoutClaimed) claimDealPayout(d);
    if(d.status==='refunded' && d.buyerUid===state.uid && !d.refundClaimed) claimDealRefund(d);
  });
}
setInterval(function(){ if(state.loggedIn) processDealsWatchdog(); }, 30000);

const _dealActionInFlight = new Set();
async function approveDeal(id){ await respondToDeal(id, 'approved'); }
async function rejectDeal(id){
  if(!confirm('Bu işlemi reddetmek istediğine emin misin? Karşı taraf onaylamaz/reddetmezse tutar 3 gün içinde otomatik olarak alıcıya iade edilir.')) return;
  await respondToDeal(id, 'rejected');
}
/* Alıcı/satıcı kendi Onayla/Reddet kararını bildirir. Çift tıklama/çift
   işlem, hem istemci tarafında (_dealActionInFlight) hem de Firestore
   transaction içindeki "hâlâ pending mi" kontrolüyle engellenir. */
async function respondToDeal(id, decision){
  if(_dealActionInFlight.has(id)) return;
  const d = findDeal(id);
  if(!d){ toast('İşlem bulunamadı','error'); return; }
  if(d.status!=='pending'){ toast('Bu işlem artık sonuçlanmış.','error'); return; }
  const isBuyer = d.buyerUid===state.uid, isSeller = d.sellerUid===state.uid;
  if(!isBuyer && !isSeller) return;
  const myField = isBuyer?'buyerApproval':'sellerApproval';
  const otherField = isBuyer?'sellerApproval':'buyerApproval';
  if(d[myField]!=='pending'){ toast('Bu işlem için zaten bir karar verdin.','error'); return; }
  _dealActionInFlight.add(id);
  try{
    let finalDeal = null;
    if(FIREBASE_ENABLED && fbDb){
      try{
        await fbDb.runTransaction(async (tx)=>{
          const ref = fbDb.collection('deals').doc(id);
          const snap = await tx.get(ref);
          if(!snap.exists) throw new Error('İşlem bulunamadı.');
          const data = snap.data();
          if(data.status!=='pending') throw new Error('Bu işlem artık sonuçlanmış.');
          if(data[myField]!=='pending') throw new Error('Bu işlem için zaten bir karar verdin.');
          const patch = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
          patch[myField] = decision;
          const otherVal = data[otherField];
          if(decision==='approved' && otherVal==='approved'){
            patch.status='completed'; patch.completedAt = firebase.firestore.FieldValue.serverTimestamp();
          }else if(decision==='rejected' && otherVal==='rejected'){
            patch.status='refunded'; patch.completedAt = firebase.firestore.FieldValue.serverTimestamp();
          }else if(decision==='rejected' && otherVal==='pending'){
            patch.rejectDeadline = firebase.firestore.Timestamp.fromMillis(Date.now()+DEAL_AUTO_REJECT_MS);
            patch.firstRejectBy = isBuyer?'buyer':'seller';
          }
          tx.update(ref, patch);
          finalDeal = Object.assign({}, data, patch, {id,
            rejectDeadline: patch.rejectDeadline ? patch.rejectDeadline.toMillis() : (data.rejectDeadline||null)});
        });
      }catch(err){ toast('İşlem gerçekleştirilemedi: '+(err.message||''),'error'); return; }
    }else{
      d[myField] = decision; d.updatedAt = Date.now();
      const otherVal = d[otherField];
      if(decision==='approved' && otherVal==='approved'){ d.status='completed'; d.completedAt=Date.now(); }
      else if(decision==='rejected' && otherVal==='rejected'){ d.status='refunded'; d.completedAt=Date.now(); }
      else if(decision==='rejected' && otherVal==='pending'){ d.rejectDeadline=Date.now()+DEAL_AUTO_REJECT_MS; d.firstRejectBy=isBuyer?'buyer':'seller'; }
      finalDeal = d;
      saveLocalAppState();
    }
    toast(decision==='approved' ? 'İşlemi onayladın.' : 'İşlemi reddettin.', decision==='approved'?'success':'default');
    notifyCounterpartyOfDealDecision(finalDeal, isBuyer?'buyer':'seller', decision);
    processDealsWatchdog();
    render();
  } finally {
    _dealActionInFlight.delete(id);
  }
}
function notifyCounterpartyOfDealDecision(d, role, decision){
  if(!d) return;
  const targetUid = role==='buyer' ? d.sellerUid : d.buyerUid;
  if(!targetUid || targetUid===state.uid) return;
  let title, text;
  if(d.status==='completed'){ title='İşlem Onaylandı — Ödeme Yapıldı'; text=`"${d.listingTitle}" için her iki taraf da onayladı, tutar satıcıya aktarıldı.`; }
  else if(d.status==='refunded'){ title='İşlem Reddedildi — İade Yapıldı'; text=`"${d.listingTitle}" işlemi reddedildi, tutar alıcıya iade edildi.`; }
  else if(decision==='rejected'){ title='İşlem Reddedildi'; text=`"${d.listingTitle}" işlemini karşı taraf reddetti. Onaylamaz/reddetmezsen 3 gün içinde otomatik olarak reddedilip tutar iade edilecek.`; }
  else{ title='İşlem Onaylandı'; text=`"${d.listingTitle}" işlemini karşı taraf onayladı — sıra sende!`; }
  pushNotification(targetUid, { type:'purchase', title, text, link:{view:'messages', params:{}}, listingId: d.listingId });
}
/* 3 günlük süre dolduğunda tek taraflı reddi otomatik olarak "her iki taraf
   da reddetti" durumuna çevirir ve alıcıya iade akışını tetikler. */
const _dealDeadlineInFlight = new Set();
async function checkDealDeadline(d){
  if(!d || d.status!=='pending' || !d.rejectDeadline) return;
  if(Date.now() < d.rejectDeadline) return;
  if(!(d.buyerApproval==='rejected' || d.sellerApproval==='rejected')) return;
  if(_dealDeadlineInFlight.has(d.id)) return;
  _dealDeadlineInFlight.add(d.id);
  try{
    if(FIREBASE_ENABLED && fbDb){
      try{
        await fbDb.runTransaction(async (tx)=>{
          const ref = fbDb.collection('deals').doc(d.id);
          const snap = await tx.get(ref);
          if(!snap.exists) return;
          const data = snap.data();
          if(data.status!=='pending') return;
          const rd = (data.rejectDeadline && data.rejectDeadline.toMillis) ? data.rejectDeadline.toMillis() : data.rejectDeadline;
          if(!rd || Date.now() < rd) return;
          if(!(data.buyerApproval==='rejected' || data.sellerApproval==='rejected')) return;
          tx.update(ref, {
            buyerApproval:'rejected', sellerApproval:'rejected', status:'refunded', autoRejected:true,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(), completedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        });
      }catch(err){ /* başka bir istemci zaten işlemiş olabilir — sorun değil */ }
    }else{
      d.buyerApproval='rejected'; d.sellerApproval='rejected'; d.status='refunded'; d.autoRejected=true; d.completedAt=Date.now();
      saveLocalAppState();
    }
  } finally {
    _dealDeadlineInFlight.delete(d.id);
  }
}
/* Tamamlanan (onaylanan) bir işlemin tutarını SATICI kendi bakiyesine
   geçirir. Yalnızca kendi dokümanını güncellediği için mevcut Firestore
   kurallarında ekstra bir izne gerek kalmaz (bkz. dosya başı rules notu). */
const _dealClaimInFlight = new Set();
async function claimDealPayout(d){
  if(!d || d.status!=='completed' || d.payoutClaimed || d.sellerUid!==state.uid) return;
  if(_dealClaimInFlight.has(d.id)) return;
  _dealClaimInFlight.add(d.id);
  try{
    if(FIREBASE_ENABLED && fbDb){
      try{
        await fbDb.runTransaction(async (tx)=>{
          const dealRef = fbDb.collection('deals').doc(d.id);
          const dealSnap = await tx.get(dealRef);
          if(!dealSnap.exists) return;
          const data = dealSnap.data();
          if(data.status!=='completed' || data.payoutClaimed || data.sellerUid!==state.uid) return;
          const userRef = fbDb.collection('users').doc(state.uid);
          tx.update(dealRef, { payoutClaimed:true });
          tx.update(userRef, {
            balance: firebase.firestore.FieldValue.increment(data.amount),
            successfulDealCount: firebase.firestore.FieldValue.increment(1),
            // Güvenlik kuralı bu alanı okuyup ilgili deal dokümanından
            // (miktar + durum + payoutClaimed) doğrulama yapar — bkz. Firestore Rules.
            lastClaimedDealId: d.id,
          });
        });
      }catch(err){ console.error('Ödeme talebi işlenemedi:', err); return; }
    }else{
      d.payoutClaimed = true;
      state.balance += d.amount;
      state.successfulDealCount = (state.successfulDealCount||0)+1;
      saveLocalAppState();
    }
    state.balanceHistory.unshift({id:Date.now(), type:'Onaylanan İşlem — Ödeme Alındı', amount:d.amount, date:'Bugün', status:'Tamamlandı'});
    toast(`"${d.listingTitle}" için ${fmt(d.amount)} bakiyene aktarıldı.`,'success');
    render();
  } finally {
    _dealClaimInFlight.delete(d.id);
  }
}
/* Reddedilen bir işlemin tutarını ALICI kendi bakiyesine geri alır — aynı
   "sadece kendi dokümanı" prensibiyle çalışır. */
async function claimDealRefund(d){
  if(!d || d.status!=='refunded' || d.refundClaimed || d.buyerUid!==state.uid) return;
  if(_dealClaimInFlight.has(d.id)) return;
  _dealClaimInFlight.add(d.id);
  try{
    if(FIREBASE_ENABLED && fbDb){
      try{
        await fbDb.runTransaction(async (tx)=>{
          const dealRef = fbDb.collection('deals').doc(d.id);
          const dealSnap = await tx.get(dealRef);
          if(!dealSnap.exists) return;
          const data = dealSnap.data();
          if(data.status!=='refunded' || data.refundClaimed || data.buyerUid!==state.uid) return;
          const userRef = fbDb.collection('users').doc(state.uid);
          tx.update(dealRef, { refundClaimed:true });
          tx.update(userRef, {
            balance: firebase.firestore.FieldValue.increment(data.amount),
            // Güvenlik kuralı bu alanı okuyup ilgili deal dokümanından
            // (miktar + durum + refundClaimed) doğrulama yapar — bkz. Firestore Rules.
            lastClaimedDealId: d.id,
          });
        });
      }catch(err){ console.error('İade talebi işlenemedi:', err); return; }
    }else{
      d.refundClaimed = true;
      state.balance += d.amount;
      saveLocalAppState();
    }
    state.balanceHistory.unshift({id:Date.now(), type:'Reddedilen İşlem — İade Alındı', amount:d.amount, date:'Bugün', status:'Tamamlandı'});
    toast(`"${d.listingTitle}" reddedildi — ${fmt(d.amount)} bakiyene iade edildi.`,'default');
    render();
  } finally {
    _dealClaimInFlight.delete(d.id);
  }
}

/* ---------------- ONAY/RET: ORTAK ARAYÜZ YARDIMCILARI ---------------- */
function dealPartyLabel(v){ return v==='approved'?'Onayladı':v==='rejected'?'Reddetti':'Bekliyor'; }
function dealPartyPillClass(v){ return v==='approved'?'pill-success':v==='rejected'?'pill-danger':'pill-warning'; }
function dealCountdownLabel(d){
  if(!d.rejectDeadline) return '';
  const ms = d.rejectDeadline - Date.now();
  if(ms<=0) return 'Otomatik ret işleniyor…';
  const days = Math.floor(ms/86400000), hours = Math.floor((ms%86400000)/3600000);
  return days>0 ? `${days} gün ${hours} saat sonra otomatik reddedilip iade edilecek` : `${Math.max(hours,1)} saat sonra otomatik reddedilip iade edilecek`;
}
/* Tek bir işlem kartını (ilan adı, iki tarafın onay durumu, gerekiyorsa
   Onayla/Reddet butonları) HTML olarak üretir. Mesajlar > Satıcı sohbeti,
   İlanlarım, Satın Aldıklarım ve Sattıklarım bölümlerinin HEPSİ bu tek
   fonksiyonu kullanır — böylece durum gösterimi her yerde senkron ve tutarlı
   kalır. */
function renderDealCard(d){
  const isBuyer = d.buyerUid===state.uid, isSeller = d.sellerUid===state.uid;
  const myField = isBuyer?'buyerApproval':(isSeller?'sellerApproval':null);
  const canAct = d.status==='pending' && myField && d[myField]==='pending';
  let statusLine = '';
  if(d.status==='completed') statusLine = `<div class="hint" style="color:var(--success);margin-top:6px;">${ic('checkCircle',13)} Tamamlandı — tutar satıcıya aktarıldı.</div>`;
  else if(d.status==='refunded') statusLine = `<div class="hint" style="color:var(--danger);margin-top:6px;">${ic('close',13)} ${d.autoRejected?'3 günlük süre doldu, otomatik reddedildi':'Reddedildi'} — tutar alıcıya iade edildi.</div>`;
  else if(d.rejectDeadline) statusLine = `<div class="hint" style="color:var(--warning);margin-top:6px;">${ic('clock',13)} ${esc(dealCountdownLabel(d))}</div>`;
  return `
  <div class="deal-card" style="border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px;background:var(--elevated);">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;">
      <div style="min-width:0;">
        <b style="font-size:12.5px;display:block;">${esc(d.listingTitle||'İlan')}</b>
        <span class="small text-mid">${fmt(d.amount)} · Sipariş ${esc(d.orderId||'')}</span>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <span class="pill ${dealPartyPillClass(d.buyerApproval)}" title="Alıcı onay durumu">Alıcı: ${dealPartyLabel(d.buyerApproval)}</span>
        <span class="pill ${dealPartyPillClass(d.sellerApproval)}" title="Satıcı onay durumu">Satıcı: ${dealPartyLabel(d.sellerApproval)}</span>
      </div>
    </div>
    ${statusLine}
    ${canAct ? `
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-success btn-sm" onclick="approveDeal('${d.id}')">${ic('checkCircle',13)} Onayla</button>
      <button class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="rejectDeal('${d.id}')">${ic('close',13)} Reddet</button>
    </div>` : ''}
  </div>`;
}
/* İlanlarım/Satın Aldıklarım/Sattıklarım gibi dar alanlarda kullanılan,
   tek satırlık kompakt durum rozeti — tıklanınca ilgili sohbete götürür. */
function renderDealStatusPill(d){
  const otherUid = d.buyerUid===state.uid ? d.sellerUid : d.buyerUid;
  const convId = [state.uid, otherUid].filter(Boolean).sort().join('_');
  let label, cls;
  if(d.status==='completed'){ label='Tamamlandı'; cls='pill-success'; }
  else if(d.status==='refunded'){ label='Reddedildi/İade Edildi'; cls='pill-danger'; }
  else if(d.rejectDeadline){ label='Ret Bekliyor · '+dealCountdownLabel(d); cls='pill-warning'; }
  else{ label='Onay Bekliyor'; cls='pill-warning'; }
  return `<button class="pill ${cls}" style="border:none;cursor:pointer;" title="Sohbete git" onclick="event.stopPropagation();state.activeConversation='${convId}';state.msgMobileOpen=true;go('messages',{})">${esc(label)}</button>`;
}

/* Satıcının kendi "Sattıklarım" listesini ve toplam satış sayısını, manuel olarak
   değiştirilemeyen gerçek satış kayıtlarından (sales koleksiyonu) otomatik yükler. */
async function loadMySalesFromFirestore(){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return;
  try{
    const snap = await fbDb.collection('sales').where('sellerUid','==', state.uid).get();
    const rows = snap.docs.map(d=>{
      const s = d.data();
      return { item: s.listingTitle||'İlan', date: (s.createdAt && s.createdAt.toMillis) ? timeAgo(s.createdAt.toMillis()) : 'Bugün', buyer: s.buyerName||'Alıcı', status:'Tamamlandı', price: s.price||0, orderId: s.orderId||'', listingId: s.listingId||'' };
    });
    rows.sort((a,b)=> (b.price - a.price)); // en güncel Firestore sırasında zaten gelir; ek bir sıralama gerekmez
    state.mySales = rows;
    render();
  }catch(err){ console.error('Satış geçmişi yüklenemedi:', err); }
}
/* Kullanıcının sipariş geçmişini (satın aldıkları) Firestore'dan yükler ki
   farklı bir cihazdan/oturumdan giriş yapıldığında da görünür olsun. */
async function loadMyOrdersFromFirestore(){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return;
  try{
    const snap = await fbDb.collection('orders').where('buyerUid','==', state.uid).get();
    const rows = snap.docs.map(d=>{
      const o = d.data();
      return { id: o.id||d.id, item: o.item||'Sipariş', price: o.price||0, date: (o.createdAt && o.createdAt.toMillis) ? timeAgo(o.createdAt.toMillis()) : (o.date||'Bugün'), status: o.status||'Ödeme Alındı / Hazırlanıyor', _sortTs: (o.createdAt && o.createdAt.toMillis) ? o.createdAt.toMillis() : 0 };
    });
    rows.sort((a,b)=> b._sortTs - a._sortTs);
    state.orders = rows.map(({_sortTs, ...rest})=>rest);
    render();
    loadMyDeliveriesFromFirestore();
  }catch(err){ console.error('Sipariş geçmişi yüklenemedi:', err); }
}
/* Sayfa yenilendiğinde veya tekrar giriş yapıldığında, önceden teslim edilmiş
   Random Hesap bilgilerini (Gmail+Şifre) "deliveries" koleksiyonundan tekrar
   çeker ve ilgili siparişe bağlar. Firestore güvenlik kuralları burada
   buyerUid==auth.uid dışındaki dokümanları zaten reddetmelidir; sorgu ayrıca
   istemci tarafında da yalnızca kendi uid'imizle filtrelenir. */
async function loadMyDeliveriesFromFirestore(){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return;
  try{
    const snap = await fbDb.collection('deliveries').where('buyerUid','==', state.uid).get();
    const byOrder = {};
    snap.docs.forEach(d=>{
      const v = d.data();
      if(v.buyerUid !== state.uid) return; // ekstra güvenlik kontrolü
      (byOrder[v.orderId] = byOrder[v.orderId]||[]).push({ gmail:v.gmail, password:v.password, listingTitle:v.listingTitle });
    });
    state.orders.forEach(o=>{ if(byOrder[o.id]) o.deliveries = byOrder[o.id]; });
    render();
  }catch(err){ console.error('Teslimat bilgileri yüklenemedi:', err); }
}

/* ---------------- HESAP PASS ---------------- */
const PASS_PRICE = 149.99;
const PASS_DAYS = 30;
const LISTING_FEE = 0; // Normal ilan oluşturmak tüm kullanıcılar için tamamen ücretsizdir.
const RANDOM_ACCOUNT_FEE = 50; // Sadece "Random Hesap Oluştur" özelliği için alınan ücret.

/* =================================================================
   RANDOM HESAP — STOK BAZLI OTOMATİK TESLİMAT SİSTEMİ
   =================================================================
   ÖNEMLİ GÜVENLİK NOTU: Gmail + Şifre bilgileri KESİNLİKLE bu dosyanın
   içine sabit (hardcoded) yazılmaz ve KESİNLİKLE herkese açık "listings"
   dokümanının/alanlarının içine konmaz — çünkü ilan listeleme ekranı TÜM
   kullanıcılar için "listings" koleksiyonunun tamamını çeker
   (bkz. loadListingsFromFirestore). Bunun yerine her hesap, ilana bağlı
   ayrı bir alt koleksiyonda ("listings/{id}/accountStock") saklanır ve
   yalnızca satın alan kullanıcıya ait "deliveries" dokümanı üzerinden,
   Firestore güvenlik kurallarıyla korunarak okunur. Bu dosyanın sonunda
   (RANDOM_ACCOUNT_STOCK_SECURITY_RULES) önerilen kuralları Firebase
   Console > Firestore > Rules bölümüne eklemen GEREKİR; aksi halde bu
   istemci tarafı ayrım tek başına yeterli güvenliği sağlamaz. */
const MAX_RANDOM_STOCK = 50;
function isRandomAccountListing(l){ return !!l && l.type==='hesap' && !!l.randomAccount; }
/* Stok adedine göre Gmail+Şifre giriş alanlarını üretir/günceller. `list`
   önceden girilmiş değerleri korumak için kullanılır (stok sayısı
   değiştiğinde var olan girişler kaybolmaz, sadece eksik/fazla alan eklenir
   ya da kaldırılır). */
function renderStockAccountFields(list, count, prefix){
  const n = Math.max(1, Math.min(MAX_RANDOM_STOCK, Number(count)||1));

/* Stok adedi == girilen hesap sayısı olmalı ve hiçbiri boş/eksik bırakılamaz
   (eksik veya fazla hesap eklenmesine izin verilmez). */
function validateStockAccounts(stock, accounts){
  const n = Math.max(1, Math.min(MAX_RANDOM_STOCK, Number(stock)||1));
  if(!accounts || accounts.length !== n) return `Lütfen tam olarak ${n} adet Gmail + Şifre bilgisi gir.`;
  for(let i=0;i<accounts.length;i++){
    const a = accounts[i];
    if(!a.gmail || !a.password) return `${i+1}. hesap için Gmail ve Şifre alanlarının ikisi de doldurulmalı.`;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.gmail)) return `${i+1}. hesaptaki Gmail adresi geçerli görünmüyor.`;
  }
  return null;
}
/* Gmail+Şifre stoğunu, herkese açık ilan dokümanının DIŞINDA ayrı bir alt
   koleksiyona (listings/{id}/accountStock) yazar. Yerel demo modunda ise
   (Firebase yok) aynı bilgi, sadece bu tarayıcıda tutulan ilan nesnesinin
   üzerinde `_localStock` alanı olarak saklanır. */
async function saveRandomAccountStock(listingId, stockAccounts, localListingRef){
  if(!stockAccounts || !stockAccounts.length) return;
  if(FIREBASE_ENABLED && fbDb){
    const batch = fbDb.batch();
    const col = fbDb.collection('listings').doc(listingId).collection('accountStock');
    stockAccounts.forEach(acc=>{
      const ref = col.doc();
      batch.set(ref, {
        gmail: acc.gmail, password: acc.password, status: 'available',
        buyerUid: null, orderId: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });
    await batch.commit();
  }else if(localListingRef){
    localListingRef._localStock = stockAccounts.map(a=>({gmail:a.gmail, password:a.password, status:'available'}));
  }
}
/* Satın alma anında, ilgili ilanın stoğundan TEK bir hesabı atomik şekilde
   alıcıya ayırır: aynı anda gelen iki satın alma isteğinde bile aynı hesabın
   iki kez teslim edilmesini önlemek için Firestore transaction kullanılır
   (bir hesap 'sold' olarak işaretlenene kadar başka biri onu alamaz; çakışma
   olursa otomatik olarak başka bir müsait hesapla yeniden denenir). Stok
   sayacı ve "active" durumu da AYNI transaction içinde güncellenir. Sonuç,
   yalnızca çağıran (satın alan) kullanıcıya döndürülür; hiçbir yerde herkese
   açık şekilde saklanmaz. */
async function claimRandomAccountStock(listing, orderId){
  if(!FIREBASE_ENABLED || !fbDb){
    // Yerel demo modu: tek kullanıcı olduğundan basitçe bellekteki diziden bir
    // müsait hesap işaretlenip döndürülür.
    const stock = listing._localStock || [];
    const item = stock.find(a=>a.status==='available');
    if(!item) return null;
    item.status='sold'; item.buyerUid = state.uid||'demo-user'; item.orderId = orderId;
    return { gmail:item.gmail, password:item.password };
  }
  const listingRef = fbDb.collection('listings').doc(listing.id);
  const stockCol = listingRef.collection('accountStock');
  for(let attempt=0; attempt<6; attempt++){
    try{
      const availSnap = await stockCol.where('status','==','available').limit(1).get();
      if(availSnap.empty) return null;
      const candidateRef = availSnap.docs[0].ref;
      const result = await fbDb.runTransaction(async (tx)=>{
        const [itemDoc, listingDoc] = await Promise.all([tx.get(candidateRef), tx.get(listingRef)]);
        if(!itemDoc.exists || itemDoc.data().status!=='available'){
          const e = new Error('RETRY'); e.retry = true; throw e;
        }
        const curStock = (listingDoc.exists ? listingDoc.data().stock : 0) || 0;
        const nextStock = Math.max(0, curStock-1);
        const deliveryRef = fbDb.collection('deliveries').doc(orderId+'_'+listing.id);
        const data = itemDoc.data();
        tx.update(candidateRef, {
          status:'sold', buyerUid: state.uid, orderId,
          deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        tx.update(listingRef, { stock: nextStock, active: nextStock>0 });
        tx.set(deliveryRef, {
          buyerUid: state.uid, sellerUid: (listing.seller&&listing.seller.sellerUid)||null,
          listingId: listing.id, listingTitle: listing.title, orderId,
          gmail: data.gmail, password: data.password,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        return { gmail: data.gmail, password: data.password };
      });
      return result;
    }catch(err){
      if(err && err.retry) continue; // başka biri bu hesabı az önce aldı, tekrar dene
      console.error('Random hesap teslimatı başarısız:', err);
      return null;
    }
  }
  return null;
}
/* Yalnızca giriş yapmış alıcı kendi teslimatını, güvenlik kurallarıyla
   korunan "deliveries" dokümanından tekrar okuyabilir (sayfa yenilense veya
   tekrar giriş yapılsa bile). */
async function loadDeliveryForOrder(orderId, listingId){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return null;
  try{
    const doc = await fbDb.collection('deliveries').doc(orderId+'_'+listingId).get();
    if(!doc.exists) return null;
    const d = doc.data();
    if(d.buyerUid !== state.uid) return null; // güvenlik: sahibi değilsek gösterme
    return { gmail: d.gmail, password: d.password, listingTitle: d.listingTitle };
  }catch(err){ console.error('Teslimat bilgisi okunamadı:', err); return null; }
}
/* Teslimat tamamlandığında satıcının mağazasından alıcıya, mevcut mesajlaşma
   sistemi üzerinden otomatik bir bilgilendirme mesajı gönderir. Gmail/şifre
   gibi hassas bilgiler bu mesaja KESİNLİKLE yazılmaz — sadece "Siparişlerim"
   sayfasından güvenli görüntüleme yönlendirmesi yapılır.
   NOT: "listingId" parametresi, Firestore Rules'daki isAutoPurchaseSystemMessage
   kontrolünün alıcının bu ilanı gerçekten satın aldığını (hasPurchased)
   doğrulayabilmesi için mesaja/konuşmaya yazılır — bkz. dosya başındaki
   Firestore Security Rules yorumu. */
async function sendAutoDeliveryMessage(sellerUid, sellerName, orderId, listingId, listingTitle){
  sellerName = (sellerName||'Mağaza').trim() || 'Mağaza';
  if(!FIREBASE_ENABLED || !fbDb){
    openLocalConversationSystemMsg(sellerName, listingTitle, `✓ Siparişin (${orderId}) için "${listingTitle}" hesabının teslimatı tamamlandı! Giriş bilgilerini "Hesabım → Siparişlerim" sayfasından güvenli şekilde görüntüleyebilirsin.`);
    return;
  }
  if(!state.uid || !sellerUid || sellerUid===state.uid) return;
  try{
    const convId = [state.uid, sellerUid].sort().join('_');
    const convRef = fbDb.collection('conversations').doc(convId);
    const text = `✓ Siparişin (${orderId}) için "${listingTitle}" hesabının teslimatı tamamlandı! Giriş bilgilerini "Hesabım → Siparişlerim" sayfasından güvenli şekilde görüntüleyebilirsin.`;
    await fbDb.runTransaction(async (tx)=>{
      const snap = await tx.get(convRef);
      const conv = snap.exists ? (snap.data()||{}) : {};
      if(!snap.exists){
        tx.set(convRef, {
          participants:[state.uid, sellerUid], names:{[state.uid]:displayName(), [sellerUid]:sellerName},
          listingId: listingId||'', listingTitle, lastMessage:text, lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
          messageCount:1, autoReplySent:true, unread:{[state.uid]:true, [sellerUid]:false},
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }else{
        tx.update(convRef, {
          lastMessage:text, lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
          messageCount: (conv.messageCount||0)+1, ['unread.'+state.uid]:true,
        });
      }
      const msgRef = convRef.collection('messages').doc();
      tx.set(msgRef, { from: sellerUid, text, system:true, kind:'auto_delivery', listingId: listingId||'', participants:[state.uid, sellerUid], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
  }catch(err){ console.error('Otomatik teslimat mesajı gönderilemedi:', err); }
}
/* ---------------- NORMAL İLAN SATIN ALMA — OTOMATİK BİLGİLENDİRME MESAJI ----------------

/* Kullanıcının "Para Çek" sekmesinden yeni bir para çekme talebi oluşturmasını
   sağlar. İstemci tarafında: ad soyad, IBAN formatı ve tutarın (beklemedeki
   talepler düşüldükten sonraki) kullanılabilir bakiyeyi aşmadığı kontrol
   edilir. Sunucu tarafında da aynı bakiye kontrolü Firestore güvenlik
   kuralında (match /withdrawalRequests) tekrar doğrulanır — istemci
   doğrulaması atlatılsa bile yetersiz bakiyeyle talep oluşturulamaz. */
function submitWithdrawRequest(){
  const fullName = (document.getElementById('wdFullName')||{}).value?.trim() || '';
  let iban = (document.getElementById('wdIban')||{}).value?.trim().toUpperCase().replace(/\s+/g,'') || '';
  const amount = Number((document.getElementById('wdAmount')||{}).value);
  if(!fullName){ toast('Lütfen ad soyad gir','error'); return; }
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(iban)){ toast('Lütfen geçerli bir IBAN gir (Örn: TR ile başlayan 26 haneli IBAN)','error'); return; }
  if(!amount || amount<=0){ toast('Lütfen geçerli bir tutar gir','error'); return; }
  const myReqs = (state.withdrawalRequests||[]).filter(r=>r.uid===(state.uid||'demo-user'));
  const pendingTotal = myReqs.filter(r=>r.status==='Bekliyor').reduce((s,r)=>s+(r.amount||0),0);
  const withdrawableNow = Math.max(0, state.balance - pendingTotal);
  if(amount > withdrawableNow){ toast('Yetersiz bakiye — bu tutarda talep oluşturamazsın.','error'); return; }
  createWithdrawRequest({fullName, iban, amount});
}
async function createWithdrawRequest({fullName, iban, amount}){
  const reqData = {
    uid: state.uid||'demo-user', userName: state.userName||'Kullanıcı',
    fullName: fullName, iban: iban, amount: amount, status: 'Bekliyor', note: '', date: 'Bugün',
  };
  if(FIREBASE_ENABLED && state.uid){
    try{
      reqData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await fbDb.collection('withdrawalRequests').add(reqData);
    }catch(err){ toast('Talep gönderilemedi: '+authErrorMessage(err), 'error'); return; }
  }else{
    state.withdrawalRequests = state.withdrawalRequests || [];
    state.withdrawalRequests.unshift(Object.assign({id:'WD-'+Date.now()}, reqData));
  }
  const fn=document.getElementById('wdFullName'), ib=document.getElementById('wdIban'), am=document.getElementById('wdAmount');
  if(ib) ib.value=''; if(am) am.value='';
  toast('Para çekme talebin alındı, admin onayı sonrası bakiyenden düşülüp IBAN\'ına gönderilecek.','success');
  render();
}

/* ---------------- MESAJLAR ----------------
   İki çalışma modu:
   1) FIREBASE_ENABLED true  -> tüm sohbetler ve mesajlar Firestore'da
      "conversations/{buyerUid_sellerUid}" ve alt koleksiyonu
      "conversations/{id}/messages" içinde, sunucu zaman damgasıyla, kalıcı
      olarak tutulur ve canlı (onSnapshot) güncellenir.
   2) FIREBASE_ENABLED false -> yerel demo modu; aynı veri yapısı tarayıcının
      localStorage'ında (LOCAL_CONV_KEY) tutulur, sayfa yenilendiğinde kaybolmaz.
   Her iki modda da: gösterilen isim HER ZAMAN mağaza adıdır (ad-soyad asla
   kullanılmaz) ve otomatik karşılama mesajı bir konuşmada yalnızca BİR kez
   gönderilir. */
let _convListUnsub = null;
let _convMsgUnsub = null;
let _attachedConvId = null;
function detachConversationListeners(){
  if(_convListUnsub){ _convListUnsub(); _convListUnsub=null; }
  if(_convMsgUnsub){ _convMsgUnsub(); _convMsgUnsub=null; }
  _attachedConvId = null;
}
/* Kullanıcının dahil olduğu TÜM sohbetleri (hem alıcı hem mağaza sahibi olarak)
   canlı dinler. participants dizisi her iki tarafı da içerdiği için tek bir
   sorgu, gelen kutusu + gönderilen kutusunu birlikte kapsar. */
let _convUnreadPrev = {};
let _convListInitialDone = false;
/* Bir sohbet "okunmadı" (unread) durumuna İLK kez geçtiğinde (yani karşı taraf
   yeni bir mesaj gönderdiğinde) otomatik olarak "Yeni Mesaj" bildirimi
   oluşturur. Dinleyici ilk kez bağlandığında (halihazırda okunmamış eski
   sohbetler için) bildirim SPAM'ini önlemek amacıyla yalnızca ilk anlık
   görüntüden SONRAKİ değişikliklerde tetiklenir. */
function listenConversations(){
  if(!FIREBASE_ENABLED || !fbDb || !state.uid) return;
  if(_convListUnsub) _convListUnsub();
  _convUnreadPrev = {};
  _convListInitialDone = false;
  _convListUnsub = fbDb.collection('conversations')
    .where('participants','array-contains', state.uid)
    .onSnapshot(function(snap){
      const list = snap.docs.map(function(d){
        const c = d.data()||{};
        const parts = c.participants||[];
        const otherUid = parts.find(p=>p!==state.uid) || null;
        const names = c.names||{};
        const unreadMap = c.unread||{};
        const lastAt = c.lastMessageAt && c.lastMessageAt.toMillis ? c.lastMessageAt.toMillis() : 0;
        return {
          id: d.id, otherUid: otherUid, otherName: names[otherUid] || 'Mağaza',
          listingTitle: c.listingTitle||'', lastMessage: c.lastMessage||'',
          lastMessageAt: lastAt, unread: !!unreadMap[state.uid],
        };
      });
      list.sort(function(a,b){ return b.lastMessageAt - a.lastMessageAt; });
      if(_convListInitialDone){
        list.forEach(function(c){
          if(c.unread && !_convUnreadPrev[c.id]){
            pushNotification(state.uid, {
              type:'message', title:'Yeni Mesaj',
              text:`${c.otherName||'Bir mağaza'} sana mesaj gönderdi${c.listingTitle?` ("${c.listingTitle}")`:''}.`,
              link:{view:'messages', params:{conv:c.id}},
            });
          }
        });
      }
      list.forEach(function(c){ _convUnreadPrev[c.id] = c.unread; });
      _convListInitialDone = true;
      state.conversations = list;
      if(!state.activeConversation && list.length){ state.activeConversation = list[0].id; attachMessagesListener(list[0].id); }
      refreshMessagesLive();
      renderHeaderOnly();
    }, function(err){ console.error('Sohbetler dinlenemedi:', err); });
}
/* Aktif sohbetin mesajlarını (alt koleksiyon) canlı dinler ve o sohbeti
   kullanıcı için "okundu" olarak işaretler. */
function attachMessagesListener(convId){
  if(!FIREBASE_ENABLED || !fbDb || !convId || !state.uid) return;
  if(_convMsgUnsub) _convMsgUnsub();
  _attachedConvId = convId;
  state.activeMessages = [];
  _convMsgUnsub = fbDb.collection('conversations').doc(convId).collection('messages')
    .orderBy('createdAt','asc')
    .onSnapshot(function(snap){
      state.activeMessages = snap.docs.map(function(d){
        const m = d.data()||{};
        const ts = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : null;
        return { id:d.id, mine: m.from===state.uid, text: m.text||'', system: !!m.system,
          time: ts ? ts.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) : 'Şimdi' };
      });
      refreshMessagesLive();
    }, function(err){ console.error('Mesajlar dinlenemedi:', err); if(state.view==='messages') toast('Mesajlar yüklenemedi: '+(err&&err.message||err),'error'); });
  fbDb.collection('conversations').doc(convId).update({ ['unread.'+state.uid]: false }).catch(function(){});
}
function selectConversation(id){
  state.activeConversation = id;
  state.msgMobileOpen = true;
  if(FIREBASE_ENABLED && fbDb) attachMessagesListener(id);
  renderMainOnly();
}
/* Mobilde tam ekran açılan sohbetten konuşma listesine geri döner.
   Aktif konuşma bilgisini kaybetmez, sadece görünümü değiştirir. */
function backToConversationList(){
  state.msgMobileOpen = false;
  renderMainOnly();
}
/* ---- Yerel demo modu (Firebase yapılandırılmadığında) ---- */
function loadLocalConversations(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_CONV_KEY)||'[]'); }catch(e){ return []; }
}
function saveLocalConversations(list){
  try{ localStorage.setItem(LOCAL_CONV_KEY, JSON.stringify(list)); }catch(e){}
}
function openLocalConversation(sellerName, listingTitle){
  const list = loadLocalConversations();
  let conv = list.find(c=>c.withName===sellerName);
  if(!conv){
    conv = {id:'local-'+Date.now(), withName:sellerName, listing:listingTitle||'', autoReplySent:false, messages:[]};
    list.push(conv);
    saveLocalConversations(list);
  }
  state.activeConversation = conv.id;
  state.msgMobileOpen = true;
  go('messages',{});
}
function sendLocalMessage(convId, text){
  const list = loadLocalConversations();
  const conv = list.find(c=>c.id===convId);
  if(!conv) return;
  conv.messages.push({from:'me', text, time:'Şimdi'});
  if(!conv.autoReplySent){
    conv.messages.push({from:'them', text:AUTO_REPLY_TEXT, time:'Şimdi', system:true});
    conv.autoReplySent = true;
  }
  saveLocalConversations(list);
  render();
}
function convLastPreview(c, isFb){
  if(isFb) return (c.lastMessage||'').trim() || 'Henüz mesaj yok, ilk mesajı sen gönder.';
  const msgs = c.messages||[];
  return msgs.length ? msgs[msgs.length-1].text : 'Henüz mesaj yok, ilk mesajı sen gönder.';
}
function convTimeLabel(c, isFb){
  if(isFb) return c.lastMessageAt ? timeAgo(c.lastMessageAt) : '';
  const msgs = c.messages||[];
  return msgs.length ? (msgs[msgs.length-1].time||'') : '';
}
function viewMessages(){
  const isFb = FIREBASE_ENABLED && !!fbDb;
  // Bir bildirimden ("Yeni Mesaj") gelindiyse ilgili sohbeti doğrudan açar.
  if(state.params.conv){
    state.activeConversation = state.params.conv;
    state.msgMobileOpen = true;
    if(isFb) attachMessagesListener(state.activeConversation);

    return `
    <div class="wrap">
      <div class="disp section-title" style="margin:20px 0 16px;">Mesajlar</div>
      <div class="empty-state"><div class="em-icon">${ic('mail',30)}</div><b>Henüz mesajın yok</b><div class="small text-mid" style="margin-top:6px;">Bir mağazaya yazdığında sohbetlerin burada görünecek.</div></div>
    </div>`;
  }
  // ÖNEMLİ: activeConversation, kullanıcı bilinçli olarak bir sohbet açtığında
  // (messageSeller/selectConversation) set edilir. Firestore'un canlı liste
  // güncellemesi (state.conversations) henüz bu sohbeti içermiyor olsa bile
  // (kısa süreli senkron gecikmesi) ASLA başka bir sohbete zorla geçilmez —
  // aksi hâlde kullanıcı yazdığı mesaj yanlış/eski bir sohbete gidebilir.
  // Sadece hiç aktif sohbet YOKSA listedeki ilk sohbete düşülür.
  if(!state.activeConversation && list.length){
    state.activeConversation = list[0].id;
  }
  if(isFb && state.activeConversation && _attachedConvId !== state.activeConversation){
    attachMessagesListener(state.activeConversation);
  }
  const conv = list.find(c=>c.id===state.activeConversation);
  if(!conv){
    // Sohbet oluşturuldu ama Firestore'un canlı listesi henüz senkronize
    // olmadı — bir sonraki onSnapshot tetiklendiğinde otomatik olarak
    // gerçek içerikle yeniden render edilecek.
    return `
    <div class="wrap">
      <div class="disp section-title" style="margin:20px 0 16px;">Mesajlar</div>
      <div class="empty-state"><div class="em-icon">${ic('mail',30)}</div><b>Sohbet açılıyor...</b></div>
    </div>`;
  }
  const convName = isFb ? conv.otherName : conv.withName;

  return `

            return `
            <button class="msgs-row ${conv.id===c.id?'active':''}" onclick="selectConversation('${c.id}')">
              <div class="msgs-avatar">${esc(initials(cName))}</div>
              <div class="msgs-row-body">

                  ${unread?`<span class="msgs-unread-dot"></span>`:''}
                </div>
              </div>
            </button>`;
          }).join('')}
        </div>

          <button class="msgs-back-btn" onclick="backToConversationList()" aria-label="Sohbetlere dön">${ic('arrowLeft',18)}</button>

              <div class="msgs-chat-name">${esc(convName)}</div>

            </div>
          </div>

        </div>
        ${(function(){
          if(!isFb) return ''; // yerel demo modunda gerçek karşı taraf olmadığından panel gösterilmez
          const otherUid = conv.otherUid || (conv.participants||[]).find(function(p){ return p!==state.uid; });

          ${(messages||[]).length ? (messages||[]).map(m=>{
            const mine = isFb ? m.mine : m.from==='me';
            return `<div class="msg-bubble ${mine?'me':'them'}">${esc(m.text)}<div class="msg-time">${m.time||'Şimdi'}</div></div>`;
          }).join('') : `<div class="msgs-empty-thread">Henüz mesaj yok, ilk mesajı sen gönder.</div>`}
        </div>
        <form class="msgs-compose" onsubmit="event.preventDefault(); sendMessage(this.msg.value); this.reset();">
          <input id="msgComposeInput" name="msg" placeholder="Mesajını yaz..." required autocomplete="off">
          <button class="btn btn-primary" type="submit" aria-label="Gönder">${ic('send',17)}</button>
        </form>
      </section>
    </div>
  </div>`;
}
/* Mesaj gönderir. Bir konuşmadaki İLK mesajsa, resmi otomatik karşılama
   cevabı aynı anda (tek seferlik) konuşmaya eklenir — bkz. AUTO_REPLY_TEXT. */
async function sendMessage(text){
  text = (text||'').trim();
  if(!text) return;
  const convId = state.activeConversation;
  if(!convId){ toast('Önce bir sohbet seçmelisin, tekrar dene.','error'); return; }
  if(!FIREBASE_ENABLED || !fbDb){ sendLocalMessage(convId, text); return; }
  if(!state.uid){ toast('Mesaj göndermek için giriş yapmalısın.','error'); return; }
  const convRef = fbDb.collection('conversations').doc(convId);
  try{
    await fbDb.runTransaction(async function(tx){
      const snap = await tx.get(convRef);
      const conv = snap.exists ? (snap.data()||{}) : {};
      const isFirstEver = !(conv.messageCount>0);
      const willAutoReply = isFirstEver && !conv.autoReplySent;
      const otherUid = (conv.participants||[]).find(p=>p!==state.uid) || null;
      const msgParticipants = conv.participants || (otherUid ? [state.uid, otherUid] : [state.uid]);
      const msgRef = convRef.collection('messages').doc();
      tx.set(msgRef, { from: state.uid, text: text, participants: msgParticipants, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      let newCount = (conv.messageCount||0) + 1;
      let lastMessage = text;
      const patch = {
        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
        autoReplySent: conv.autoReplySent || willAutoReply,
        ['unread.'+state.uid]: false,
      };
      if(otherUid) patch['unread.'+otherUid] = true;
      if(willAutoReply && otherUid){
        const autoRef = convRef.collection('messages').doc();
        tx.set(autoRef, { from: otherUid, text: AUTO_REPLY_TEXT, system:true, participants: msgParticipants, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        newCount += 1;
        lastMessage = AUTO_REPLY_TEXT;
        patch['unread.'+state.uid] = true; // otomatik cevap kullanıcı için okunmadı
      }
      patch.messageCount = newCount;
      patch.lastMessage = lastMessage;
      tx.update(convRef, patch);
    });
  }catch(err){ console.error('Mesaj gönderilemedi:', err); toast('Mesaj gönderilemedi','error'); }
}

/* ================= GLOBAL SOHBET ================= */
/* Tüm kayıtlı kullanıcıların birlikte yazabildiği tek ortak oda. Sağ altta
   yüzen bir buton (FAB) ile her sayfadan erişilebilir; herhangi bir mevcut
   görünümü/özelliği değiştirmez, tamamen bağımsız bir katman olarak çalışır.
   Firebase etkinse Firestore'daki 'globalChatMessages' koleksiyonunu canlı
   dinler (bkz. güvenlik kuralları yorumu); değilse (yerel demo modu) aynı
   sohbeti tarayıcıda saklar ve açık diğer sekmelerle "storage" olayıyla
   senkronize eder. */
let _gchatUnsub = null, _gchatStorageBound = false;
function loadLocalGlobalChat(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_GCHAT_KEY)||'[]'); }catch(e){ return []; }
}
function saveLocalGlobalChat(list){
  try{ localStorage.setItem(LOCAL_GCHAT_KEY, JSON.stringify(list.slice(-200))); }catch(e){}
}
function mapLocalGchatMsg(m){
  const d = m.createdAt ? new Date(m.createdAt) : new Date();
  return { id:m.id, uid:m.uid||'', name:m.name||'Mağaza', text:m.text||'',
    time: d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) };
}
function listenGlobalChat(){
  if(!FIREBASE_ENABLED || !fbDb){
    state.gchat.messages = loadLocalGlobalChat().map(mapLocalGchatMsg);
    state.gchat.readCount = state.gchat.open ? state.gchat.messages.length : state.gchat.readCount;
    if(!_gchatStorageBound){
      _gchatStorageBound = true;
      // Aynı tarayıcıda açık başka bir sekmede mesaj gönderildiğinde, bu
      // sekmedeki demo sohbeti de anlık olarak günceller (çoklu kullanıcı
      // hissi veren yerel demo simülasyonu).
      window.addEventListener('storage', function(e){
        if(e.key !== LOCAL_GCHAT_KEY) return;
        const list = loadLocalGlobalChat().map(mapLocalGchatMsg);
        state.gchat.messages = list;
        if(state.gchat.open){ state.gchat.readCount = list.length; }
        else{ state.gchat.unread = Math.max(0, list.length - state.gchat.readCount); }
        renderGlobalChatWidget();
      });
    }
    renderGlobalChatWidget();
    return;
  }
  if(!state.uid) return;
  if(_gchatUnsub) _gchatUnsub();
  _gchatUnsub = fbDb.collection('globalChatMessages')
    .orderBy('createdAt','desc').limit(150)
    .onSnapshot(function(snap){
      const list = snap.docs.map(function(d){
        const m = d.data()||{};
        const ts = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : null;
        return { id:d.id, uid:m.uid||'', name:m.name||'Mağaza', text:m.text||'',
          time: ts ? ts.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) : 'Şimdi' };
      }).reverse();
      state.gchat.messages = list;
      if(state.gchat.open){ state.gchat.readCount = list.length; state.gchat.unread = 0; }
      else{ state.gchat.unread = Math.max(0, list.length - state.gchat.readCount); }
      renderGlobalChatWidget();
    }, function(err){ console.error('Global sohbet dinlenemedi:', err); });
}
function detachGlobalChatListener(){
  if(_gchatUnsub){ _gchatUnsub(); _gchatUnsub=null; }
}
function toggleGlobalChat(){
  const opening = !state.gchat.open;
  state.gchat.open = opening;
  if(opening){ state.gchat.unread = 0; state.gchat.readCount = state.gchat.messages.length; }
  // Panel'i ÖNCE anında (class toggle ile) aç — geç açılıyormuş hissi
  // vermesin; içerik güncellemesi hemen ardından, gerekirse kısa bir
  // "Yükleniyor..." katmanıyla birlikte yapılır.
  const panel = document.getElementById('gchatPanel');
  const loading = document.getElementById('gchatLoading');
  if(panel) panel.classList.toggle('is-open', opening);
  if(opening && loading) loading.style.display='flex';
  requestAnimationFrame(()=>{
    renderGlobalChatWidget();
    updateBodyScrollLock();
    const l2 = document.getElementById('gchatLoading');
    if(l2) l2.style.display='none';
  });
}
function closeGlobalChat(){
  if(state.gchat.open){ state.gchat.open = false; renderGlobalChatWidget(); updateBodyScrollLock(); }
}
async function sendGlobalChatMessage(text){
  text = (text||'').trim().slice(0, GCHAT_TEXT_MAX);
  if(!text) return;
  if(!state.loggedIn){ toast('Global sohbete yazmak için giriş yapmalısın.','error'); openAuthModal('login'); return; }
  const name = displayName();
  if(!FIREBASE_ENABLED || !fbDb){
    const list = loadLocalGlobalChat();
    list.push({ id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), uid: state.uid||'demo-user', name, text, createdAt: Date.now() });
    saveLocalGlobalChat(list);
    state.gchat.messages = loadLocalGlobalChat().map(mapLocalGchatMsg);
    state.gchat.readCount = state.gchat.messages.length;
    renderGlobalChatWidget();
    return;
  }
  if(!state.uid) return;
  try{
    await fbDb.collection('globalChatMessages').add({
      uid: state.uid, name: name, text: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(err){ console.error('Global mesaj gönderilemedi:', err); toast('Mesaj gönderilemedi','error'); }
}
function scrollGlobalChatToBottom(){
  const el = document.getElementById('gchatThread');
  if(el) el.scrollTop = el.scrollHeight;
}
function renderGchatBubble(m){
  const mine = !!(state.uid && m.uid===state.uid) || (!FIREBASE_ENABLED && m.uid==='demo-user' && !state.uid);
  return `
  <div class="gchat-msg ${mine?'me':'them'}">
    ${!mine ? `<div class="gchat-avatar">${esc(initials(m.name))}</div>` : ''}
    <div class="msg-bubble ${mine?'me':'them'} gchat-bubble">
      ${!mine ? `<div class="gchat-name">${esc(m.name)}</div>` : ''}
      ${esc(m.text)}<div class="msg-time">${esc(m.time||'Şimdi')}</div>
    </div>
  </div>`;
}
function gchatComposeHtml(){
  if(!state.loggedIn){
    return `
    <div class="gchat-login-cta">
      <p>Global sohbete katılmak ve tüm kullanıcılarla konuşmak için giriş yapmalısın.</p>
      <button class="btn btn-primary" onclick="openAuthModal('login')">Giriş Yap</button>
    </div>`;
  }
  return `
  <form class="gchat-compose" onsubmit="event.preventDefault(); sendGlobalChatMessage(this.gmsg.value); this.reset();">
    <input id="gchatComposeInput" name="gmsg" placeholder="Herkese bir şeyler yaz..." maxlength="${GCHAT_TEXT_MAX}" required autocomplete="off">
    <button class="btn btn-primary" type="submit" aria-label="Gönder">${ic('send',17)}</button>
  </form>`;
}
let _gchatComposeLoggedIn = null; // en son compose formunun çizildiği andaki giriş durumu
function renderGlobalChatWidget(){
  const root = document.getElementById('globalChatRoot');
  if(!root) return;
  const g = state.gchat;
  const panel = document.getElementById('gchatPanel');
  // Panel zaten DOM'daysa ve giriş durumu (dolayısıyla compose formunun
  // türü: input mu, "giriş yap" CTA'sı mı) değişmediyse, SADECE mesaj
  // balonlarını, üst bilgi sayısını ve FAB rozetini güncelle. Compose
  // formu/input DOM'dan HİÇ kaldırılıp yeniden oluşturulmaz. Nedeni: bir
  // input mobilde DOM'dan silinip yeniden eklendiğinde native klavye
  // kapanır ve bunu bir kullanıcı dokunuşu OLMADAN (yani bir ağ/onSnapshot
  // callback'i içinde) programatik .focus() ile geri açmak mobil
  // tarayıcılarda güvenilir çalışmaz. Input'a dokunulmayınca her
  // kullanıcının o an yazmakta olduğu metin, imleç konumu, odağı ve
  // mobildeki açık klavyesi kendi ekranında olduğu gibi kalır — başka bir
  // kullanıcının mesaj göndermesi bunu asla etkilemez.
  if(panel && _gchatComposeLoggedIn === state.loggedIn){
    const thread = document.getElementById('gchatThread');
    if(thread){
      thread.innerHTML = g.messages.length ? g.messages.map(renderGchatBubble).join('') : `<div class="gchat-empty">Henüz mesaj yok, ilk mesajı sen gönder!</div>`;
    }
    const sub = root.querySelector('.gchat-head-txt span');
    if(sub) sub.textContent = `Tüm üyeler burada${g.messages.length?` · ${g.messages.length} mesaj`:''}`;
    panel.classList.toggle('is-open', !!g.open);
    const fab = root.querySelector('.gchat-fab');
    if(fab){
      fab.classList.toggle('is-open', !!g.open);
      fab.setAttribute('aria-label', g.open?'Global sohbeti kapat':'Global sohbeti aç');
      fab.innerHTML = `${ic(g.open?'close':'chat', 22)}${(!g.open && g.unread>0) ? `<span class="gchat-fab-badge">${g.unread>99?'99+':g.unread}</span>` : ''}`;
    }
    scrollGlobalChatToBottom();
    return;
  }
  // İlk çizim ya da giriş durumu değişti (compose formu tipi değişecek) ->
  // tam yeniden çizim gerekli. Yine de kullanıcı tam o anda yazıyor
  // olabileceğinden (ör. giriş yaparken input başka bir yerdeydi), değer/
  // imleç/odak korunmaya çalışılır — ama asıl güvenlik ağı yukarıdaki
  // dokunmama stratejisidir.
  _gchatComposeLoggedIn = state.loggedIn;
  const gInput = document.getElementById('gchatComposeInput');
  const hadFocus = gInput && document.activeElement===gInput;
  const savedValue = gInput ? gInput.value : null;
  const savedStart = hadFocus ? gInput.selectionStart : null;
  const savedEnd = hadFocus ? gInput.selectionEnd : null;
  root.innerHTML = `
    <button class="gchat-fab ${g.open?'is-open':''}" onclick="toggleGlobalChat()" aria-label="${g.open?'Global sohbeti kapat':'Global sohbeti aç'}">
      ${ic(g.open?'close':'chat', 22)}
      ${(!g.open && g.unread>0) ? `<span class="gchat-fab-badge">${g.unread>99?'99+':g.unread}</span>` : ''}
    </button>
    <div class="gchat-panel ${g.open?'is-open':''}" id="gchatPanel" role="dialog" aria-label="Global Sohbet">
      <div class="gchat-head">
        <div class="gchat-head-ico">${ic('users',16)}</div>
        <div class="gchat-head-txt">
          <b>Global Sohbet</b>
          <span>Tüm üyeler burada${g.messages.length?` · ${g.messages.length} mesaj`:''}</span>
        </div>
        <button class="gchat-close" onclick="toggleGlobalChat()" aria-label="Kapat">${ic('close',18)}</button>
      </div>
      <div class="gchat-thread" id="gchatThread">
        ${g.messages.length ? g.messages.map(renderGchatBubble).join('') : `<div class="gchat-empty">Henüz mesaj yok, ilk mesajı sen gönder!</div>`}
      </div>
      ${gchatComposeHtml()}
      <div class="fab-loading" id="gchatLoading"><div class="fab-spinner"></div><span>Yükleniyor...</span></div>
    </div>
  `;
  if(savedValue){
    const newGInput = document.getElementById('gchatComposeInput');
    if(newGInput){
      newGInput.value = savedValue;
      if(hadFocus){
        newGInput.focus();
        if(savedStart!=null) newGInput.setSelectionRange(savedStart, savedEnd);
      }
    }
  }
  scrollGlobalChatToBottom();
}
