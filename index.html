/* Kullanıcının kendi ilanını kalıcı olarak kaldırır. Sadece yerel state'ten
   değil, Firestore'daki gerçek dokümandan da silinir — aksi halde ilan
   "kaldırıldı" görünse de sayfa yenilendiğinde/veriler yeniden yüklendiğinde
   geri gelir ve "aktif ilan" sayısı hiç azalmaz. */
async function removeMyListing(id){
  if(!confirm('Bu ilanı kalıcı olarak kaldırmak istediğine emin misin?')) return;
  if(FIREBASE_ENABLED && fbDb){
    try{ await fbDb.collection('listings').doc(id).delete(); }
    catch(err){ toast('İlan silinemedi: '+authErrorMessage(err),'error'); return; }
  }
  state.myListings = state.myListings.filter(x=>x!==id);
  LISTINGS = LISTINGS.filter(l=>l.id!==id);
  toast('İlan kaldırıldı','success');
  render();
}

/* Satılıp kilitlenmiş (active:false / stok tükenmiş) bir ilanı, sahibi tekrar
   satışa çıkarmak istediğinde yeniden aktif eder. Stok 0'sa satıcıdan yeni
   stok adedi istenir (ör. yeni bir hesap/ürün tedarik ettiğini onaylar) —
   aksi halde ilan "aktif" görünse de stok filtresi yüzünden yine hiç kimseye
   görünmez. Değişiklik hem yerel state'e hem (canlı modda) Firestore'daki
   gerçek dokümana kalıcı olarak yazılır. */
async function republishMyListing(id){
  const l = findListing(id);
  if(!l) return;
  if(!isMyListing(l) && !state.isAdmin){ toast('Bu ilan sana ait değil.','error'); return; }
  let newStock = l.stock;
  if(!newStock || newStock < 1){
    const input = prompt('Bu ilan stokta tükenmişti. Yeniden yayınlamak için yeni stok adedini gir:', '1');
    if(input===null) return; // vazgeçildi
    newStock = Math.max(1, Math.floor(Number(input))||1);
  }
  const btn = document.getElementById('republishBtn-'+id);
  if(btn){ btn.disabled = true; btn.textContent = 'Yayınlanıyor...'; }
  try{
    if(FIREBASE_ENABLED && fbDb){
      await fbDb.collection('listings').doc(id).update({ active:true, stock:newStock });
    }
    l.active = true;
    l.stock = newStock;
    toast('İlanın yeniden yayınlandı ve artık herkes tarafından görülebiliyor!','success');
    render();
  }catch(err){
    toast('İlan yeniden yayınlanamadı: '+authErrorMessage(err),'error');
    if(btn){ btn.disabled = false; btn.textContent = 'Yeniden Yayınla'; }
  }
}

function createTicket(subject, desc){
  if(!subject) return;
  const id = 'DEST-'+(120+state.tickets.length);
  const priority = isPassActive();
  state.tickets.unshift({id, subject, status:'Açık', date:'Bugün', priority, thread:[{from:'me',text:desc,time:'Şimdi'}]});
  toast(priority?`Hızlı Destek talebin oluşturuldu: ${id}`:'Destek talebin oluşturuldu: '+id,'success');
  render();
}

function replyTicket(text){
  const t = state.tickets.find(x=>x.id===state.activeTicket);
  if(!t || !text.trim()) return;
  t.thread.push({from:'me',text,time:'Şimdi'});
  openTicketModal();
  setTimeout(()=>{
    t.thread.push({from:'support',text:t.priority?'Hızlı Destek: Talebiniz öncelikli sıraya alındı, ilgili birimimiz hemen ilgileniyor.':'Talebiniz için teşekkürler, ilgili birimimiz en kısa sürede dönüş yapacaktır.',time:'Şimdi'});
    openTicketModal();
  }, t.priority?300:900);
}

async function adminHandleListingImages(fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return;
  if(_adminNewListingImages.length>=6){ toast('En fazla 6 görsel ekleyebilirsin','error'); return; }
  const toUpload = files.slice(0, 6-_adminNewListingImages.length);
  _adminNewListingUploading += toUpload.length;
  adminRenderListingImageThumbs();
  for(const file of toUpload){
    try{
      const url = await uploadToImgbb(file);
      _adminNewListingImages.push(url);
    }catch(err){ toast('Görsel yüklenemedi: '+err.message,'error'); }
    finally{ _adminNewListingUploading = Math.max(0,_adminNewListingUploading-1); adminRenderListingImageThumbs(); }
  }
}

async function adminCreateListing(){
  adminCollectListingFields();

  const cat = document.getElementById('addCat').value;
  const title = document.getElementById('addTitle').value.trim();
  const price = Number(document.getElementById('addPrice').value)||0;
  const oldPriceRaw = document.getElementById('addOldPrice').value;
  const oldPrice = oldPriceRaw ? Number(oldPriceRaw) : undefined;
  const stock = Number(document.getElementById('addStock').value)||1;
  const sellerName = document.getElementById('addSeller').value.trim() || 'NADAS HİZMETLERİ';
  const desc = document.getElementById('addDesc').value.trim();
  const featured = document.getElementById('addFeatured').checked;
  if(!title){ toast('Lütfen bir ilan başlığı gir','error'); return; }
  if(!price){ toast('Lütfen bir fiyat gir','error'); return; }
  if(CATEGORY_TYPE_FIELDS[cat] && !d.type){ toast('Lütfen bir ilan türü seç (Hesap, Bakiye/UC-Elmas vb.)','error'); return; }
  const isRandomAcc = isRandomAccountListing({type:d.type, randomAccount:d.randomAccount});
  let stockAccounts = null;
  if(isRandomAcc){
    stockAccounts = collectStockAccountFields(stock, 'adm');
    const stockErr = validateStockAccounts(stock, stockAccounts);
    if(stockErr){ toast(stockErr,'error'); return; }
  }
  if(_adminNewListingUploading>0){ toast('Görseller yükleniyor, lütfen bekle...','error'); return; }
  const btn = document.getElementById('addListingSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Yayınlanıyor...'; }
  const badges = featured ? ['hot'] : ['new'];
  const type = d.type || undefined;
  const specs = (CATEGORY_TYPE_FIELDS[cat] && d.type) ? buildListingSpecs(d) : undefined;
  const base = { cat, title, price, oldPrice, stock,
    active: (stock||0) > 0,
    randomAccount: isRandomAcc || undefined,
    seller:{name:sellerName, sellerUid: state.uid||undefined, rating:5.0, sales:0, verified:true}, badges,
    type, specs,
    images: _adminNewListingImages.length ? _adminNewListingImages.slice() : 3 };
  if(desc) base.desc = desc;
  try{
    let id;
    if(FIREBASE_ENABLED){
      const fsData = stripUndefinedDeep(Object.assign({}, base, {specs: specsToFirestore(base.specs)}));
      const ref = await fbDb.collection('listings').add(fsData);
      id = ref.id;
    }else{
      id = 'ADM-'+Date.now();
    }
    const newListing = makeListing(Object.assign({id}, base));
    LISTINGS.unshift(newListing);
    if(isRandomAcc && stockAccounts && stockAccounts.length){
      try{ await saveRandomAccountStock(id, stockAccounts, newListing); }
      catch(err){ console.error('Stok hesapları kaydedilemedi:', err); toast('İlan eklendi ancak stok hesapları kaydedilirken sorun oluştu.','error'); }
    }
    toast('İlan başarıyla eklendi','success');
  }catch(err){ toast('İlan eklenemedi: '+authErrorMessage(err),'error'); if(btn){ btn.disabled=false; btn.textContent = 'İlanı Yayınla'; } return; }
  _adminNewListingImages = [];
  closeModal();
  render();
}

/* ---------------- ADMIN: BİLDİRİM & DUYURU YÖNETİMİ ----------------
   Artık HER İKİ hedef kitle de aynı şekilde ANINDA teslim edilir:
   1) audience 'all' / 'sellers' (yayın/duyuru): admin, ilgili kitledeki
      TÜM kayıtlı kullanıcıları 'users' koleksiyonundan çeker ve her birinin
      "notifications" kaydına doğrudan pushNotification() ile yazar. Alıcı
      o an aktif/çevrimiçi olmasa bile bildirim kalıcı olarak bekler ve
      uygulamayı açtığında "Bildirimler"de hazır bulur. Gönderilen kayıt,
      ayrıca 'announcements' koleksiyonuna 'delivered:true' ile audit/geçmiş
      amaçlı da yazılır; bu bayrak sayesinde eski canlı-dinleyici mekanizması
      (loadAnnouncementsForUser / watchAnnouncementsRealtime /
      pushAnnouncementNotification / announceMatchesUser) bu duyuruyu bir
      daha işleyip mükerrer bildirim oluşturmaz.
   2) audience 'user' (belirli kullanıcı(lar)): admin, e-postadan uid'i
      bulur ve aynı şekilde doğrudan hedef kullanıcının "notifications"
      kaydına pushNotification() ile yazar.
   Firestore Rules bu çapraz-kullanıcı yazımını zaten sadece isAdmin() için
   açıkça serbest bırakıyor (bkz. dosya başındaki "match /notifications"
   kuralı) — ekstra bir kural değişikliği GEREKMEZ. */

  return Array.from(new Set(
    (raw||'').split(/[,\n]/).map(e=>e.trim().toLowerCase()).filter(Boolean)
  )).slice(0,25); // kötüye kullanımı önlemek için tek seferde en fazla 25 alıcı

async function adminSendAnnouncement(){
  const title = (document.getElementById('announceTitle').value||'').trim();
  const text = (document.getElementById('announceText').value||'').trim();
  const type = document.getElementById('announceType').value || 'admin';
  const target = document.getElementById('announceTarget').value || 'all';
  const linkKey = document.getElementById('announceLinkView').value || '';
  const listingId = (document.getElementById('announceLinkListingId').value||'').trim();
  if(!title){ toast('Lütfen bir başlık gir','error'); return; }
  if(!text){ toast('Lütfen içerik metnini gir','error'); return; }
  let link = null, linkLabel = '';
  if(linkKey==='listing'){
    if(!listingId){ toast('Yönlendirme için bir İlan ID gir','error'); return; }
    link = {view:'listing', params:{id:listingId}};
    linkLabel = 'İlan: '+listingId;
  }else if(linkKey){
    link = ANNOUNCE_LINK_MAP[linkKey] || null;
    linkLabel = (ANNOUNCE_LINK_OPTIONS.find(o=>o[0]===linkKey)||[])[1] || '';
  }
  const btn = document.getElementById('sendAnnounceBtn');
  if(btn){ btn.disabled=true; btn.textContent='Gönderiliyor...'; }
  try{
    if(target==='user'){
      if(!FIREBASE_ENABLED){ toast('Belirli kullanıcıya bildirim göndermek için Firebase yapılandırması gerekir.','error'); if(btn){ btn.disabled=false; btn.textContent='Bildirimi/Duyuruyu Gönder'; } return; }
      const emails = parseAnnounceEmails(document.getElementById('announceUserEmails').value);
      if(!emails.length){ toast('Lütfen en az bir hedef kullanıcı e-postası gir','error'); if(btn){ btn.disabled=false; btn.textContent='Bildirimi/Duyuruyu Gönder'; } return; }
      let sent=0, notFound=[];
      for(const email of emails){
        const snap = await fbDb.collection('users').where('email','==',email).limit(1).get();
        if(snap.empty){ notFound.push(email); continue; }
        const doc = snap.docs[0];
        const userName = doc.data().name || email;
        const ref = await pushNotification(doc.id, {type, title, text, link});
        state.announcements.unshift({
          id:'USR-'+Date.now()+'-'+Math.random().toString(36).slice(2),
          notifId: ref?ref.id:null, notifUid: doc.id,
          title, text, type, link, linkLabel, tag: notifMeta(type).label,
          audience:'user', targetEmail:email, targetName:userName, createdAt:Date.now(),
        });
        sent++;
      }
      if(sent) toast(`Bildirim ${sent} kullanıcıya gönderildi${notFound.length?` (bulunamayan: ${notFound.join(', ')})`:''}`,'success');
      else toast('Girilen e-postalara ait kullanıcı bulunamadı: '+notFound.join(', '),'error');
    }else{
      // 'delivered:true' -> bu duyuru, kullanıcı uygulamayı aktif açtığında
      // canlı dinleyici üzerinden DEĞİL, gönderim anında doğrudan herkesin
      // "notifications" kaydına yazılarak iletilir. Böylece alıcı o an
      // çevrimdışı/aktif değilse bile bildirim kalıcı olarak bekler ve
      // uygulamayı sonradan açtığında "Bildirimler"de hazır bulur.
      const base = { title, text, tag:'Duyuru', audience:target, type, link, linkLabel, delivered:true };
      let id, sentCount = 0;
      if(FIREBASE_ENABLED){
        const ref = await fbDb.collection('announcements').add(Object.assign({}, base, {createdAt: firebase.firestore.FieldValue.serverTimestamp()}));
        id = ref.id;
        const usersSnap = await fbDb.collection('users').get();
        const targets = usersSnap.docs.filter(d=>{
          if(d.id===state.uid) return false; // kendine bildirim gitmesin
          if(target==='sellers') return !!((d.data().shopName||'').trim());
          return true;
        });
        await Promise.all(targets.map(d=>pushNotification(d.id, {type, title, text, link})));
        sentCount = targets.length;
      }else{
        id = 'DYR-'+Date.now();
        sentCount = 1;
      }
      state.announcements.unshift(Object.assign({id, createdAt:Date.now()}, base));
      markAnnouncementSeen(id); // kendi gönderdiğin duyuruyu tekrar bildirim olarak görme
      toast(target==='sellers'?`Duyuru ${sentCount} mağaza sahibine gönderildi`:`Duyuru ${sentCount} kayıtlı kullanıcıya gönderildi`,'success');
    }
  }catch(err){ toast('Gönderilemedi: '+authErrorMessage(err),'error'); if(btn){ btn.disabled=false; btn.textContent='Bildirimi/Duyuruyu Gönder'; } return; }
  if(btn){ btn.disabled=false; btn.textContent='Bildirimi/Duyuruyu Gönder'; }

async function adminSendBalance(){

  const amount = Number(document.getElementById('sendBalanceAmount').value)||0;
  if(!email){ toast('Lütfen bir e-posta gir','error'); return; }

async function saveBanner(index){
  const tag = document.getElementById('bnTag').value.trim();
  const title = document.getElementById('bnTitle').value.trim();
  const desc = document.getElementById('bnDesc').value.trim();
  const cat = document.getElementById('bnCat').value;
  if(!title){ toast('Lütfen bir başlık gir','error'); return; }
  const data = {tag: tag||'Duyuru', title, desc, cat};
  const isNew = index===null || index===undefined;
  const btn = document.getElementById('bnSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  try{
    if(isNew){
      let id = 'local-'+Date.now();
      if(FIREBASE_ENABLED){
        const ref = await fbDb.collection('banners').add(data);
        id = ref.id;
      }
      BANNERS.push(Object.assign({id}, data));
      toast('Banner eklendi','success');
    }else{
      const existing = BANNERS[index];
      if(FIREBASE_ENABLED && existing.id && !String(existing.id).startsWith('local-')){
        await fbDb.collection('banners').doc(existing.id).set(data);
      }
      BANNERS[index] = Object.assign({id: existing.id}, data);
      toast('Banner güncellendi','success');
    }
  }catch(err){ toast('Banner kaydedilemedi: '+err.message,'error'); if(btn){ btn.disabled=false; btn.textContent = isNew?'Bannerı Ekle':'Kaydet'; } return; }
  closeModal();
  render();
}
async function deleteBanner(index){
  const b = BANNERS[index];
  if(!b) return;
  try{
    if(FIREBASE_ENABLED && b.id && !String(b.id).startsWith('local-')){
      await fbDb.collection('banners').doc(b.id).delete();
    }
    BANNERS.splice(index,1);
    toast('Banner kaldırıldı','success');
    render();
  }catch(err){ toast('Banner kaldırılamadı: '+err.message,'error'); }
}

/* ---------------- ADMIN: HAVALE/EFT ONAYLARI ---------------- */
async function adminApprovePayment(id){
  const req = state.paymentRequests.find(r=>r.id===id);
  if(!req || req.status!=='Bekliyor') return;
  if(FIREBASE_ENABLED){
    try{
      await fbDb.runTransaction(async (tx)=>{
        const reqRef = fbDb.collection('paymentRequests').doc(id);
        const reqSnap = await tx.get(reqRef);
        if(!reqSnap.exists || reqSnap.data().status!=='Bekliyor') throw new Error('Talep artık bekleyen durumda değil.');
        const data = reqSnap.data();
        const userRef = fbDb.collection('users').doc(data.uid);
        tx.update(userRef, { balance: firebase.firestore.FieldValue.increment(data.amount) });
        tx.update(reqRef, { status:'Onaylandı' });
        const txRef = fbDb.collection('transactions').doc();
        tx.set(txRef, { userName: data.userName||data.uid, uid:data.uid, type:(data.method==='Google Play TL'?'Google Play TL Onayı':'Havale/EFT Onayı'), amount:data.amount, date:'Bugün', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
      if(state.uid === req.uid){ state.balance += req.amount; }
    }catch(err){ toast('Onay işlemi başarısız: '+authErrorMessage(err),'error'); return; }
  }else{
    if(state.uid === req.uid || req.uid==='demo-user'){ state.balance += req.amount; }
  }
  req.status='Onaylandı';
  state.globalTransactions.unshift({id:'TX-'+Date.now(), userName:req.userName, type:(req.method==='Google Play TL'?'Google Play TL Onayı':'Havale/EFT Onayı'), amount:req.amount, date:'Bugün'});
  pushNotification(req.uid, {
    type:'balance', title:'Bakiye Yüklendi',
    text:`${fmt(req.amount)} tutarındaki bakiye talebin onaylandı ve hesabına eklendi.`,
    link:{view:'account', params:{tab:'bakiyegecmisi'}},
  });
  toast(`${fmt(req.amount)} tutarındaki talep onaylandı ve bakiyeye eklendi.`,'success');
  render();
}
async function adminRejectPayment(id){
  const req = state.paymentRequests.find(r=>r.id===id);
  if(!req || req.status!=='Bekliyor') return;
  if(FIREBASE_ENABLED){
    try{ await fbDb.collection('paymentRequests').doc(id).update({status:'Reddedildi'}); }
    catch(err){ toast('Reddetme başarısız: '+authErrorMessage(err),'error'); return; }
  }

/* ---------------- ADMIN: PARA ÇEKME TALEPLERİ ----------------
   Onaylama, tek bir Firestore transaction içinde: (1) talebin hâlâ 'Bekliyor'
   durumda olduğunu, (2) kullanıcının GÜNCEL bakiyesinin talep tutarına yetip
   yetmediğini kontrol eder — yetmiyorsa işlem tamamen iptal edilir (kullanıcı
   arada başka bir harcama yapmış olabilir). Yetiyorsa bakiyeden düşer, talebi
   'Onaylandı' yapar ve işlem geçmişine kaydeder. Reddedilirse bakiyeye
   dokunulmaz. */
async function adminApproveWithdrawal(id){
  const req = (state.withdrawalRequests||[]).find(r=>r.id===id);
  if(!req || req.status!=='Bekliyor') return;
  if(FIREBASE_ENABLED){
    try{
      await fbDb.runTransaction(async (tx)=>{
        const reqRef = fbDb.collection('withdrawalRequests').doc(id);
        const reqSnap = await tx.get(reqRef);
        if(!reqSnap.exists || reqSnap.data().status!=='Bekliyor') throw new Error('Talep artık bekleyen durumda değil.');
        const data = reqSnap.data();
        const userRef = fbDb.collection('users').doc(data.uid);
        const userSnap = await tx.get(userRef);
        const currentBalance = (userSnap.exists && typeof userSnap.data().balance==='number') ? userSnap.data().balance : 0;
        if(currentBalance < data.amount) throw new Error('Kullanıcının bakiyesi bu tutar için yetersiz.');
        tx.update(userRef, { balance: firebase.firestore.FieldValue.increment(-data.amount) });
        tx.update(reqRef, { status:'Onaylandı' });
        const txRef = fbDb.collection('transactions').doc();
        tx.set(txRef, { userName: data.userName||data.uid, uid:data.uid, type:'Para Çekme Onayı', amount:-data.amount, date:'Bugün', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
      if(state.uid === req.uid){ state.balance -= req.amount; }
    }catch(err){ toast('Onay işlemi başarısız: '+authErrorMessage(err),'error'); return; }
  }else{
    if(state.balance < req.amount && (state.uid === req.uid || req.uid==='demo-user')){ toast('Kullanıcının bakiyesi bu tutar için yetersiz.','error'); return; }
    if(state.uid === req.uid || req.uid==='demo-user'){ state.balance -= req.amount; }
  }
  req.status='Onaylandı';
  state.globalTransactions.unshift({id:'TX-'+Date.now(), userName:req.userName, type:'Para Çekme Onayı', amount:-req.amount, date:'Bugün'});
  pushNotification(req.uid, {
    type:'balance', title:'Para Çekme Talebi Onaylandı',
    text:`${fmt(req.amount)} tutarındaki para çekme talebin onaylandı, tutar bakiyenden düşüldü ve IBAN'ına gönderildi.`,
    link:{view:'account', params:{tab:'paracek'}},
  });
  toast(`${fmt(req.amount)} tutarındaki para çekme talebi onaylandı.`,'success');
  render();
}
async function adminRejectWithdrawal(id){
  const req = (state.withdrawalRequests||[]).find(r=>r.id===id);
  if(!req || req.status!=='Bekliyor') return;
  if(FIREBASE_ENABLED){

/* İlk yükleme
   hardNavigate() ile (kategori değişimi / giriş / çıkış sonrası) tetiklenen
   tam sayfa yenilemelerinde, sekmeye özel sessionStorage'da bırakılan hedef
   görünüm burada okunup uygulanır; böylece kullanıcı yenileme sonrası doğru
   sayfada (ör. tıkladığı kategoride) ve GÜNCEL veriyle karşılanır. */
(function bootWithPendingNav(){
  loadLocalAppState();
  const pending = consumePendingNav();
  if(pending && pending.view){
    state.view = pending.view;
    state.params = pending.params || {};
  }
  state.loading = true;
  render();
  setTimeout(()=>{ state.loading=false; render(); }, 500);
})();

   girmemiş olsa bile ilk andan itibaren görünür olsun diye burada bir kez
   render edilir. Firebase modunda gerçek mesaj akışı, oturum açıldığında
   watchAuthState() içinden listenGlobalChat() ile başlar (bkz. güvenlik
   kuralları — okuma sadece giriş yapmış kullanıcılara açık); yerel demo
   modunda ise akış doğrudan burada başlar. */
renderGlobalChatWidget();
if(!FIREBASE_ENABLED){ listenGlobalChat(); }
/* Yapay Zeka Asistanı floating butonu da (Global Chat'in hemen üstünde)
   sitenin her sayfasında görünür olması için burada bir kez render edilir. */
renderAIAssistFab();
document.addEventListener('click', function(e){
  if(e.target.closest('.catmenu-overlay')) return;
  if(e.target.closest('.icon-btn') || e.target.closest('[style*="position:absolute"]')) return;
  if(state.panelsOpen.notif || state.panelsOpen.userMenu || state.panelsOpen.catMenu){
    state.panelsOpen.notif=false; state.panelsOpen.userMenu=false; state.panelsOpen.catMenu=false;
    renderHeaderOnly(); renderCatMenuRoot();
  }
  if(state.gchat && state.gchat.open && !e.target.closest('.gchat-panel') && !e.target.closest('.gchat-fab')){
    closeGlobalChat();
  }
  if(state.aiAssist && state.aiAssist.open && !e.target.closest('.ai-panel') && !e.target.closest('.ai-fab')){
    closeAIAssistFab();
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && (state.panelsOpen.notif||state.panelsOpen.userMenu||state.panelsOpen.catMenu||state.panelsOpen.accountPanel)){
    state.panelsOpen.notif=false; state.panelsOpen.userMenu=false; state.panelsOpen.catMenu=false; state.panelsOpen.accountPanel=false;
    renderHeaderOnly(); renderCatMenuRoot();
  }
  if(e.key==='Escape' && state.gchat && state.gchat.open){ closeGlobalChat(); }
  if(e.key==='Escape' && state.aiAssist && state.aiAssist.open){ closeAIAssistFab(); }
});
/* Ekran döndürme / pencere yeniden boyutlandırmada (ör. tablet <-> masaüstü
   eşiği geçilirken) mesajlar sayfasındaki VE Global Sohbet panelindeki tam
   ekran kilidini günceller. */
window.addEventListener('resize', function(){ scrollMsgThreadToBottom(); });
